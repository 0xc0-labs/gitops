apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/0xc0-labs/gitops.git
        revision: main
        directories:
          - path: platform/*
  # Deleting the ApplicationSet or an Application never deletes what it
  # deployed.
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: "{{ .path.basename }}"
      # Fields the API server defaults (a listener's tls.mode, a route's
      # weight) are not drift.
      annotations:
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: platform
      source:
        repoURL: https://github.com/0xc0-labs/gitops.git
        targetRevision: main
        path: "{{ .path.path }}"
      destination:
        server: https://kubernetes.default.svc
        # What a chart leaves without a namespace lands here (CLAUDE.md).
        namespace: "{{ .path.basename }}"
      syncPolicy:
        # Components holding data or CRDs opt out with Prune=false.
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # Some CRDs are too large for client-side apply's annotation.
          - ServerSideApply=true
        # Retrying, not sync waves, orders components that need another's CRDs.
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # One directory per environment of an application: apps/<app>/prod is
  # <app>, apps/<app>/staging is <app>-staging, as Application and namespace.
  generators:
    - git:
        repoURL: https://github.com/0xc0-labs/gitops.git
        revision: main
        directories:
          - path: apps/*/prod
          - path: apps/*/staging
  # Deleting the ApplicationSet or an Application never deletes what it
  # deployed.
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: '{{ index .path.segments 1 }}{{ if eq .path.basename "staging" }}-staging{{ end }}'
      # Fields the API server defaults (a listener's tls.mode, a route's
      # weight) are not drift.
      annotations:
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: apps
      source:
        repoURL: https://github.com/0xc0-labs/gitops.git
        targetRevision: main
        path: "{{ .path.path }}"
      destination:
        server: https://kubernetes.default.svc
        # For what a chart leaves without one: Kustomize's namespace field
        # does not reach what helmCharts inflates.
        namespace: '{{ index .path.segments 1 }}{{ if eq .path.basename "staging" }}-staging{{ end }}'
      syncPolicy:
        # Components holding data or CRDs opt out with Prune=false.
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # Some CRDs are too large for client-side apply's annotation.
          - ServerSideApply=true
        # Retrying, not sync waves, orders components that need another's CRDs.
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m

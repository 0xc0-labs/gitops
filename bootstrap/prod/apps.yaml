apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/0xc0-labs/gitops.git
        revision: main
        directories:
          - path: apps/*/prod
          - path: apps/*/staging
          # An application deployed once per site: a directory each, beside its
          # base (apps/mautic/README.md).
          - path: apps/mautic/*
          - path: apps/mautic/base
            exclude: true
  # Deleting the ApplicationSet or an Application never deletes what it
  # deployed.
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: '{{ index .path.segments 1 }}{{ if ne .path.basename "prod" }}-{{ .path.basename }}{{ end }}'
      # Fields the API server defaults (a listener's tls.mode, a route's
      # weight) are not drift.
      annotations:
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: apps
      source:
        repoURL: https://github.com/0xc0-labs/gitops.git
        targetRevision: main
        path: "{{ .path.path }}"
      destination:
        server: https://kubernetes.default.svc
        # What a chart leaves without a namespace lands here (CLAUDE.md).
        namespace: '{{ index .path.segments 1 }}{{ if ne .path.basename "prod" }}-{{ .path.basename }}{{ end }}'
      syncPolicy:
        # What holds data opts out with Prune=false, in its own manifest.
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # Server-Side Diff's dry-run apply drops a field removed from git
          # only if Argo CD's apply owns it. A client-side sync owns what it
          # changes as an update, whose removal the diff would not show (#179).
          - ServerSideApply=true
        # Retrying, not sync waves, orders components that need another's CRDs.
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m

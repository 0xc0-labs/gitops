# Instead of Argo CD's default project, which allows everything.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: The cluster's shared services, from platform/ in this repo.
  sourceRepos:
    - https://github.com/0xc0-labs/gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
---
# A cluster-scoped kind an application needs goes through platform/.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
spec:
  description: The applications, from apps/ in this repo.
  sourceRepos:
    - https://github.com/0xc0-labs/gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: mautic
    - server: https://kubernetes.default.svc
      namespace: offby1-cc
    - server: https://kubernetes.default.svc
      namespace: payload
    - server: https://kubernetes.default.svc
      namespace: payload-staging
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

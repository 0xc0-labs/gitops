# Instead of Argo CD's default project, which allows everything.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: The cluster's shared services, from platform/ in this repo.
  sourceRepos:
    - https://github.com/0xc0-labs/gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
---
# A cluster-scoped kind an application needs goes through platform/.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
spec:
  description: The applications, from apps/ in this repo.
  sourceRepos:
    - https://github.com/0xc0-labs/gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: artistlabco-com
    - server: https://kubernetes.default.svc
      namespace: artistlabco-com-staging
    - server: https://kubernetes.default.svc
      namespace: mautic-artistlabco-com
    - server: https://kubernetes.default.svc
      namespace: offby1-cc
    - server: https://kubernetes.default.svc
      namespace: plane
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
---
# Matchmark's gateway (agentgateway) is its own and brings cluster-scoped
# kinds, so its Application alone gets a project that admits exactly those
# (operator decision, 2026-11-19; apps/matchmark/README.md).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: matchmark
  namespace: argocd
spec:
  description: Matchmark, from apps/matchmark in this repo.
  sourceRepos:
    - https://github.com/0xc0-labs/gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: matchmark
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding

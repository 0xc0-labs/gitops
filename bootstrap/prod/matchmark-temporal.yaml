# Matchmark's Temporal (apps/matchmark/README.md, Temporal). Declared here, not
# generated: it deploys into another application's namespace and project
# (`matchmark`), and the `apps` ApplicationSet would name both after its
# folder, so it excludes `apps/matchmark-temporal/prod`. An Application of its
# own, so a failed sync of one never holds the other's back; the namespace is
# the `matchmark` Application's.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: matchmark-temporal
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: matchmark
  source:
    repoURL: https://github.com/0xc0-labs/gitops.git
    targetRevision: main
    path: apps/matchmark-temporal/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: matchmark
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m

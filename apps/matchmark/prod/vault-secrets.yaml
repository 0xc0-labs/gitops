apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: matchmark
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-secrets
  namespace: matchmark
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    # Shared by every application; admits this namespace by its label.
    role: apps
    serviceAccount: vault-secrets
    audiences: [vault]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: rustfs-root
  namespace: matchmark
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: matchmark/storage
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: StatefulSet
      name: rustfs
  destination:
    name: rustfs-root-vault
    create: true
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        access_key:
          text: '{{ get .Secrets "access_key" | trimAll "\r\n" }}'
        secret_key:
          text: '{{ get .Secrets "secret_key" | trimAll "\r\n" }}'
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: matchmark-api
  namespace: matchmark
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: matchmark/api
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: Deployment
      name: api
  destination:
    name: matchmark-api-vault
    create: true
    transformation:
      excludeRaw: true
---
# The operator's Claude subscription token (`claude setup-token`), read by the
# subscription probe's pod alone (README.md, The subscription probe).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: claude-subscription
  namespace: matchmark
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: matchmark/claude-subscription
  refreshAfter: 1h
  destination:
    name: claude-subscription-vault
    create: true
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        oauth_token:
          text: '{{ get .Secrets "oauth_token" | trimAll "\r\n" }}'
---
# The image is private: the kubelet reads this at each pull, so a new token
# needs no restart.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ghcr-pull
  namespace: matchmark
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: shared/ghcr-pull
  refreshAfter: 1h
  destination:
    name: ghcr-pull-vault
    create: true
    type: kubernetes.io/dockerconfigjson
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        .dockerconfigjson:
          text: '{{ dict "auths" (dict "ghcr.io" (dict "auth" (printf "%s:%s" (get .Secrets "username") (get .Secrets "password") | b64enc))) | toJson }}'

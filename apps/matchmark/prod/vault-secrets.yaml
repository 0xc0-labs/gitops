# Wave -2 here, on `matchmark-database` and on `ghcr-pull`: the migration hook
# (wave -1) reads the password and pulls its image with them (README.md, The
# usage record).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: matchmark
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-secrets
  namespace: matchmark
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    # Shared by every application; admits this namespace by its label.
    role: apps
    serviceAccount: vault-secrets
    audiences: [vault]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: rustfs-root
  namespace: matchmark
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: matchmark/storage
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: StatefulSet
      name: rustfs
  destination:
    name: rustfs-root-vault
    create: true
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        access_key:
          text: '{{ get .Secrets "access_key" | trimAll "\r\n" }}'
        secret_key:
          text: '{{ get .Secrets "secret_key" | trimAll "\r\n" }}'
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: matchmark-api
  namespace: matchmark
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: matchmark/api
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: Deployment
      name: api
    - kind: Deployment
      name: factory-worker
  destination:
    name: matchmark-api-vault
    create: true
    transformation:
      excludeRaw: true
---
# The operator's own Claude subscription (README.md, The factory worker): the
# worker's Claude Code reads it, and nothing else mounts it.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: claude-subscription
  namespace: matchmark
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: matchmark/claude-subscription
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: Deployment
      name: factory-worker
  destination:
    name: claude-subscription-vault
    create: true
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        oauth_token:
          text: '{{ get .Secrets "oauth_token" | trimAll "\r\n" }}'
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: matchmark-database
  namespace: matchmark
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: matchmark/database
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: Deployment
      name: api
  destination:
    name: matchmark-database-vault
    create: true
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        password:
          text: '{{ get .Secrets "password" | trimAll "\r\n" }}'
---
# The image is private: the kubelet reads this at each pull, so a new token
# needs no restart.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ghcr-pull
  namespace: matchmark
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: shared/ghcr-pull
  refreshAfter: 1h
  destination:
    name: ghcr-pull-vault
    create: true
    type: kubernetes.io/dockerconfigjson
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        .dockerconfigjson:
          text: '{{ dict "auths" (dict "ghcr.io" (dict "auth" (printf "%s:%s" (get .Secrets "username") (get .Secrets "password") | b64enc))) | toJson }}'
---
# The sandboxes' token key (README.md, The factory worker): each sandbox's
# token is derived from it and the sandbox's name.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: matchmark-sandbox
  namespace: matchmark
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: matchmark/sandbox
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: Deployment
      name: factory-worker
  destination:
    name: matchmark-sandbox-vault
    create: true
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        token_key:
          text: '{{ get .Secrets "token_key" | trimAll "\r\n" }}'
---
# The artifact credential, narrower than RustFS's root one (README.md,
# Artifacts): the worker reads it, and so does the Job that creates its user.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: matchmark-artifacts
  namespace: matchmark
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: matchmark/artifacts
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: Deployment
      name: factory-worker
  destination:
    name: matchmark-artifacts-vault
    create: true
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        access_key_id:
          text: '{{ get .Secrets "access_key_id" | trimAll "\r\n" }}'
        secret_access_key:
          text: '{{ get .Secrets "secret_access_key" | trimAll "\r\n" }}'

apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: matchmark
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-secrets
  namespace: matchmark
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    # Shared by every application; admits this namespace by its label.
    role: apps
    serviceAccount: vault-secrets
    audiences: [vault]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: rustfs-root
  namespace: matchmark
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: matchmark/storage
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: StatefulSet
      name: rustfs
  destination:
    name: rustfs-root-vault
    create: true
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        access_key:
          text: '{{ get .Secrets "access_key" | trimAll "\r\n" }}'
        secret_key:
          text: '{{ get .Secrets "secret_key" | trimAll "\r\n" }}'

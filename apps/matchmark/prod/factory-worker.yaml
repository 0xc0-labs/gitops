# Matchmark's factory worker (README.md, The factory worker). The image is the
# kustomization's pin, never a tag here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-worker
  namespace: matchmark
# The sandbox adapter calls the API server with this token (README.md, The
# factory worker); Vault Secrets Operator reads the secrets with
# `vault-secrets`.
automountServiceAccountToken: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: factory-worker
  namespace: matchmark
spec:
  # One run at a time is enough for this phase, and each run starts a Claude
  # Code process that can take about 1 GiB.
  replicas: 1
  # A second pod beside the first would double that memory while it rolls.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: matchmark-factory-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matchmark-factory-worker
    spec:
      serviceAccountName: factory-worker
      automountServiceAccountToken: true
      enableServiceLinks: false
      # 30 s for the runs in flight, then it cancels them and tells Temporal.
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: ghcr-pull-vault
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # A Secret's files belong to root: the group is how the user reads the
        # App's key (mode 0440, below, as decimal 288).
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: factory-worker
          image: ghcr.io/0xc0-labs/matchmark-factory-worker
          envFrom:
            - configMapRef:
                name: release
            - configMapRef:
                name: sandboxd-image
          # The worker refuses to start with ANTHROPIC_API_KEY,
          # ANTHROPIC_AUTH_TOKEN or CLAUDE_CODE_USE_BEDROCK, _VERTEX or
          # _FOUNDRY set: the subscription's token is its only credential.
          env:
            - name: MATCHMARK_TEMPORAL_ADDRESS
              value: temporal-frontend.matchmark.svc.cluster.local:7233
            - name: MATCHMARK_API_URL
              value: http://api.matchmark.svc.cluster.local
            - name: MATCHMARK_GATEWAY_URL
              value: http://gateway.matchmark.svc.cluster.local:8080
            # Both are plain HTTP between pods of the namespace, where its
            # network policies stand in for TLS.
            - name: MATCHMARK_PLAIN_HTTP
              value: "1"
            - name: TMPDIR
              value: /tmp
            - name: MATCHMARK_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: matchmark-api-vault
                  key: service_token
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: claude-subscription-vault
                  key: oauth_token
            # Replaced by the kustomization with the pinned image of
            # `ghcr.io/0xc0-labs/matchmark-runner` (README.md, The runner).
            - name: MATCHMARK_RUNNER_IMAGE
              value: ghcr.io/0xc0-labs/matchmark-runner
            # A sandbox's pod pulls the private runner image with this Secret
            # of the sandboxes' namespace (apps/matchmark-sandboxes).
            - name: MATCHMARK_SANDBOX_IMAGE_PULL_SECRET
              value: ghcr-pull-vault
            # The workspace runs on the subscription whose token is
            # CLAUDE_CODE_OAUTH_TOKEN above.
            - name: MATCHMARK_RUNNER_SUBSCRIPTION
              value: "true"
            # The other MATCHMARK_SANDBOX_* settings keep the adapter's defaults.
            - name: MATCHMARK_SANDBOX_TOKEN_KEY
              valueFrom:
                secretKeyRef:
                  name: matchmark-sandbox-vault
                  key: token_key
            - name: MATCHMARK_ARTIFACTS_ENDPOINT
              value: http://rustfs.matchmark.svc.cluster.local:9000
            - name: MATCHMARK_ARTIFACTS_BUCKET
              value: matchmark-artifacts
            - name: MATCHMARK_ARTIFACTS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: matchmark-artifacts-vault
                  key: access_key_id
            - name: MATCHMARK_ARTIFACTS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: matchmark-artifacts-vault
                  key: secret_access_key
            # The App `matchmark-bot` (README.md, The factory worker). The key
            # is a file; the adapter refuses it as a variable.
            - name: MATCHMARK_GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: matchmark-github-app-vault
                  key: app_id
            - name: MATCHMARK_GITHUB_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: matchmark-github-app-vault
                  key: installation_id
            - name: MATCHMARK_GITHUB_APP_KEY_FILE
              value: /run/secrets/github-app/private_key
            # Every request to GitHub goes through the sandboxes' proxy, with
            # CONNECT, and none goes direct. Set or absent, never empty.
            - name: MATCHMARK_GITHUB_PROXY_URL
              value: http://egress-proxy.matchmark-sandboxes.svc.cluster.local:3128
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://openobserve-collector-gateway-collector.openobserve-collector.svc.cluster.local:4318
            - name: OTEL_SERVICE_NAME
              value: matchmark-factory-worker
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.version=$(APP_VERSION),deployment.environment=prod
          # The worker's own check of its liveness file. No readiness probe:
          # it takes no traffic.
          livenessProbe:
            exec:
              command: [python, -m, matchmark_factory_worker, probe]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # A start, to be measured with the first runs.
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: github-app-key
              mountPath: /run/secrets/github-app
              readOnly: true
      volumes:
        # Only the key: the two numbers reach the worker as variables.
        - name: github-app-key
          secret:
            secretName: matchmark-github-app-vault
            defaultMode: 288 # 0440
            items:
              - key: private_key
                path: private_key
        # Each run's working files and the liveness file. Not backed up: it
        # holds nothing that outlives a pod.
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi

# Whether Claude Code, signed in with the operator's subscription token, works
# through the gateway (README.md, The subscription probe). A plain Job, not a
# sync hook: a hook that fails holds every later sync back (gitops#438), and
# this one's failure is a finding. It spends the plan each time it runs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: subscription-probe-script
  namespace: matchmark
data:
  agent-token.mjs: |
    const response = await fetch(`${process.env.API_URL}/v1/agent-tokens`, {
      method: "POST",
      headers: {
        Authorization: `Bearer ${process.env.SERVICE_TOKEN}`,
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        tenant: "default",
        app: "smoke",
        project: "matchmark",
        agent: "subscription-probe",
        task: "harness",
        attempt: 1,
        model: process.env.PROBE_MODEL,
      }),
    });
    if (response.status !== 201) {
      console.error(`agent token: status ${response.status}`);
      process.exit(1);
    }
    process.stdout.write((await response.json()).token);
  probe.sh: |
    set -eu
    npm install --silent --no-audit --no-fund --prefix /tmp/claude "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
    echo "claude code $(/tmp/claude/node_modules/.bin/claude --version)"
    AGENT_TOKEN=$(node /probe/agent-token.mjs)
    echo "agent token issued for model ${PROBE_MODEL}"
    export ANTHROPIC_CUSTOM_HEADERS="Matchmark-Agent-Token: ${AGENT_TOKEN}"
    status=0
    /tmp/claude/node_modules/.bin/claude -p "Say only: ok" --output-format json --max-turns 1 || status=$?
    echo "claude exited ${status}"
    exit "${status}"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: subscription-probe
  namespace: matchmark
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matchmark-subscription-probe
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: docker.io/library/node
          command: [sh, /probe/probe.sh]
          env:
            - name: API_URL
              value: http://api.matchmark.svc.cluster.local
            - name: SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: matchmark-api-vault
                  key: service_token
            # Not bare mode, which does not read this variable. ANTHROPIC_API_KEY
            # and ANTHROPIC_AUTH_TOKEN stay unset: either would win over it.
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: claude-subscription-vault
                  key: oauth_token
            - name: ANTHROPIC_BASE_URL
              value: http://gateway.matchmark.svc.cluster.local:8080/claude
            # The model the agent token names; the small model is the same, so
            # no call asks for one the token does not grant.
            - name: PROBE_MODEL
              value: claude-haiku-5-5
            - name: ANTHROPIC_MODEL
              value: claude-haiku-5-5
            - name: ANTHROPIC_DEFAULT_HAIKU_MODEL
              value: claude-haiku-5-5
            - name: CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC
              value: "1"
            - name: CLAUDE_CODE_VERSION
              value: 2.1.311
            - name: HOME
              value: /tmp/home
            - name: npm_config_cache
              value: /tmp/npm
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: probe
              mountPath: /probe
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: probe
          configMap:
            name: subscription-probe-script
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi

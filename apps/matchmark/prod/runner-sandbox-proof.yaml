# The proof that a sandbox pulls the private runner image and runs its tree
# (README.md, The runner): a plain Job, kept after it ends and not run again by
# a sync. It runs in the worker's image with the worker's ServiceAccount and
# labels (as `worker-proof-1` does), so it has the worker's rights and network,
# and makes a Sandbox the way the worker's adapter does.
#
# Waits for the one Sandbox the quota allows, so it can run beside the other
# proofs.
apiVersion: batch/v1
kind: Job
metadata:
  # The middle segment is replaced with APP_VERSION (kustomization.yaml), as
  # runner-proof's: the release moves the runner's pin, a Job is immutable, so
  # each release is a new Job and Argo CD prunes the previous one. `-r2` is
  # the corrected copy: a Job cannot be edited, and the first one's `bwrap`
  # check expected the wrong PID.
  name: runner-sandbox-proof-version-r4
  namespace: matchmark
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 4200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matchmark-factory-worker
        app.kubernetes.io/component: runner-sandbox-proof
    spec:
      restartPolicy: Never
      serviceAccountName: factory-worker
      automountServiceAccountToken: true
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull-vault
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proof
          # The worker's image: its Python has gRPC, which the proof needs to
          # reach sandboxd's process service.
          image: ghcr.io/0xc0-labs/matchmark-factory-worker
          command: [python, /opt/proof/sandbox-proof.py]
          envFrom:
            - configMapRef:
                name: sandboxd-image
          env:
            # Replaced by the kustomization with the pinned image of
            # `ghcr.io/0xc0-labs/matchmark-runner`, as the worker's.
            - name: MATCHMARK_RUNNER_IMAGE
              value: ghcr.io/0xc0-labs/matchmark-runner
            # The Secret the worker names in the pods it creates (the
            # worker's MATCHMARK_SANDBOX_IMAGE_PULL_SECRET).
            - name: MATCHMARK_SANDBOX_IMAGE_PULL_SECRET
              value: ghcr-pull-vault
            - name: MATCHMARK_SANDBOX_TOKEN_KEY
              valueFrom:
                secretKeyRef:
                  name: matchmark-sandbox-vault
                  key: token_key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: proof
              mountPath: /opt/proof
              readOnly: true
      volumes:
        - name: proof
          configMap:
            name: runner-proof

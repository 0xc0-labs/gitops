# What `intake-api` reaches and who reaches it (README.md, intake-api). DNS is
# `dns` in network-policy.yaml. Plane's side is `apps/plane/prod/network-policy.yaml`
# (`webhooks-to-matchmark`), the other Application; the API's is `api-ingress`.
# The rules name the pod's port: a Service's port is translated to the pod's
# before a policy applies.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: intake-api-ingress
  namespace: matchmark
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: matchmark-intake-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: plane
          podSelector:
            matchLabels:
              app.name: plane-plane-worker
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: intake-api-egress
  namespace: matchmark
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: matchmark-intake-api
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: matchmark-api
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openobserve-collector
          podSelector:
            matchLabels:
              app.kubernetes.io/component: opentelemetry-collector
              app.kubernetes.io/instance: openobserve-collector.openobserve-collector-gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opentelemetry
          podSelector:
            matchLabels:
              app.kubernetes.io/component: opentelemetry-collector
              app.kubernetes.io/instance: opentelemetry.otel-gateway
      ports:
        - protocol: TCP
          port: 4318

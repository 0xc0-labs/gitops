# Matchmark's object store (../README.md, RustFS). Only the factory worker and
# the bucket's setup Job connect to it (network-policy-artifacts.yaml), and its
# console is off: no Service names port 9001.
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: matchmark
spec:
  selector:
    app.kubernetes.io/name: rustfs
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs-headless
  namespace: matchmark
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: rustfs
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rustfs
  namespace: matchmark
spec:
  serviceName: rustfs-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rustfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rustfs
          image: docker.io/rustfs/rustfs:1.0.6@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-root-vault
                  key: access_key
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-root-vault
                  key: secret_key
            - name: RUSTFS_ADDRESS
              value: ":9000"
            - name: RUSTFS_CONSOLE_ENABLE
              value: "false"
            # The image writes its logs under /logs unless this is empty; with
            # it empty they go to stdout, where the node collector reads them.
            - name: RUSTFS_OBS_LOG_DIRECTORY
              value: ""
            - name: RUSTFS_OBS_USE_STDOUT
              value: "true"
            # Metrics are pushed over OTLP/HTTP; the namespace is admitted in
            # the collector's `otlp-from-senders`.
            - name: RUSTFS_OBS_METRICS_EXPORT_ENABLED
              value: "true"
            - name: RUSTFS_OBS_METRIC_ENDPOINT
              value: http://otel-gateway.opentelemetry.svc.cluster.local:4318/v1/metrics
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: s3
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: s3
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        # No pruning: it holds data.
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            # Backup: PBS's nightly backup of the RKE2 VMs.
            storage: 10Gi

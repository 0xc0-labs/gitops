# The proof that the runner's tree works where a sandbox runs it (README.md,
# The runner): a plain Job, kept after it ends and not run again by a sync.
#
# The pod has the sandbox's shape: gVisor, user 10001, no privilege escalation,
# no capability, the runtime's default seccomp profile, a read-only root and no
# ServiceAccount token. The init container copies the runner's tree as the
# worker's sandboxes do; the toolchain image mounts it read-only. Its labels
# match no egress policy, so it has the default's DNS and nothing else.
apiVersion: batch/v1
kind: Job
metadata:
  # The last segment is replaced with APP_VERSION (kustomization.yaml): the
  # release moves the runner's pin, a Job is immutable, so each release is a new
  # Job and Argo CD prunes the previous one.
  name: runner-proof-version
  namespace: matchmark
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matchmark-runner-proof
    spec:
      restartPolicy: Never
      runtimeClassName: gvisor
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull-vault
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The image is the kustomization's pin, and the worker's
        # MATCHMARK_RUNNER_IMAGE is copied from it.
        - name: runner
          image: ghcr.io/0xc0-labs/matchmark-runner
          command: [cp, -a, /opt/runner/., /work/]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: runner
              mountPath: /work
      containers:
        # The playground's toolchain image: it has Python, and the proof's own
        # driver uses it; the tree under test never does.
        - name: proof
          image: ghcr.io/astral-sh/uv:python3.12-trixie@sha256:f41e4fb82558e309e208a59ff7f0ac1ee9e70f87df60c6f77a17ad8c028402a3
          command: [python, /opt/proof/proof.py]
          env:
            - name: PATH
              value: /opt/runner/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: HOME
              value: /tmp
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            # Set in the pod's first process, which the proof must not find
            # inside the sandbox's own /proc/1/environ.
            - name: PROOF_POD_FIRST_PROCESS
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: runner
              mountPath: /opt/runner
              readOnly: true
            - name: proof
              mountPath: /opt/proof
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        # The tree is 522M. Nothing here outlives the pod, so no backup.
        - name: runner
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: proof
          configMap:
            name: runner-proof

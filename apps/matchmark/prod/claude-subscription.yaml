# The route from Matchmark's gateway to Anthropic's real API, for Claude Code on
# the operator's subscription (README.md, The subscription probe).
#
# The backend has no credential of its own: the `Authorization` the caller sends
# goes upstream as it is, and `anthropic-beta` is never touched. The agent
# token travels in another header, which the proxy removes before the request
# leaves.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: claude-subscription
  namespace: matchmark
spec:
  ai:
    provider:
      anthropic: {}
      host: api.anthropic.com
      port: 443
  policies:
    tls: {}
    ai:
      # Suffixes, matched with ends-with: the exact paths first, the rest as is.
      routes:
        /v1/messages: Messages
        /v1/messages/count_tokens: AnthropicTokenCount
        "*": Passthrough
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: claude
  namespace: matchmark
spec:
  parentRefs:
    - name: gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /claude
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: claude-subscription
---
# The same chain as `agent-token` (gateway-route.yaml), read from the header
# Matchmark-Agent-Token because `Authorization` carries the subscription's
# token, which is not ours to validate.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: claude-agent-token
  namespace: matchmark
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: claude
  traffic:
    jwtAuthentication:
      mode: Strict
      providers:
        - issuer: https://api.matchmark.int.0xc0.cc
          audiences:
            - matchmark-gateway
          jwks:
            remote:
              backendRef:
                name: api
                port: 80
              jwksPath: .well-known/jwks.json
      location:
        header:
          name: Matchmark-Agent-Token
    authorization:
      action: Require
      policy:
        matchExpressions:
          - has(jwt.tenant) && jwt.tenant == "default"
          - has(jwt.model) && llm.requestModel == jwt.model

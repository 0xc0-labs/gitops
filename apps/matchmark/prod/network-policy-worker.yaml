# What the factory worker and the runs it takes open, on top of the default
# deny (network-policy.yaml). A Service's port is translated to the pod's
# before a policy applies, so the rules name the pods' ports (README.md, The
# factory worker).
#
# The worker calls the API, the gateway's proxy, Temporal's frontend, the
# collector, the Kubernetes API servers, the sandboxes' runtime, RustFS and the
# sandboxes' egress proxy. Nothing reaches it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: factory-worker-egress
  namespace: matchmark
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: matchmark-factory-worker
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: matchmark-api
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: gateway
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: temporal
              app.kubernetes.io/component: frontend
      ports:
        - protocol: TCP
          port: 7233
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openobserve-collector
          podSelector:
            matchLabels:
              app.kubernetes.io/component: opentelemetry-collector
              app.kubernetes.io/instance: openobserve-collector.openobserve-collector-gateway
      ports:
        - protocol: TCP
          port: 4318
    # Under Canal a Service address is translated before the policy applies,
    # so the rule names the three RKE2 servers (infrastructure's `servers`).
    - to:
        - ipBlock:
            cidr: 10.10.4.21/32
        - ipBlock:
            cidr: 10.10.4.22/32
        - ipBlock:
            cidr: 10.10.4.23/32
      ports:
        - protocol: TCP
          port: 6443
    # The sandboxes' runtime: files over REST, processes over gRPC. Their own
    # ingress policy admits the worker (apps/matchmark-sandboxes).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: matchmark-sandboxes
          podSelector:
            matchLabels:
              app.kubernetes.io/name: matchmark-sandbox
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9090
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rustfs
      ports:
        - protocol: TCP
          port: 9000
    # GitHub's API, through the sandboxes' proxy: the worker's only way out. A
    # policy cannot name a host, so the proxy's list decides which. The
    # proxy's ingress policy admits the worker.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: matchmark-sandboxes
          podSelector:
            matchLabels:
              app.kubernetes.io/name: egress-proxy
      ports:
        - protocol: TCP
          port: 3128
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-to-api
  namespace: matchmark
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: matchmark-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: matchmark-factory-worker
      ports:
        - protocol: TCP
          port: 8000
---
# The proxy's listener, for the worker: the `/claude` route.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-to-proxy
  namespace: matchmark
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: matchmark-factory-worker
      ports:
        - protocol: TCP
          port: 8080
---
# The API starts and reads runs in Temporal. The frontend's side is in
# `apps/matchmark-temporal/prod/network-policy.yaml`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-to-temporal
  namespace: matchmark
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: matchmark-api
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: temporal
              app.kubernetes.io/component: frontend
      ports:
        - protocol: TCP
          port: 7233

# The proof that the chain holds (README.md, The proof): once per deployed
# version, the API issues a token, the gateway answers a call made with it, and
# refuses the calls that should be refused. A plain Job, not a sync hook: a hook
# that fails holds every later sync back.
apiVersion: v1
kind: ConfigMap
metadata:
  name: proof-script
  namespace: matchmark
data:
  proof.py: |
    import json
    import os
    import sys
    import time
    from datetime import datetime, timedelta, timezone
    from decimal import Decimal

    import httpx

    API = os.environ["API_URL"]
    GATEWAY = os.environ["GATEWAY_URL"]
    MODEL = "claude-sonnet-4-5"
    REQUEST = {
        "model": MODEL,
        "max_tokens": 32,
        "messages": [{"role": "user", "content": "Say only: ok"}],
    }
    # What Pydantic AI sends for a typed output, and Anthropic's shape of it:
    # the stand-in answers a forced tool with an input that follows from the
    # tool's schema (matchmark's README, A forced tool call).
    TYPED_SCHEMA = {
        "type": "object",
        "additionalProperties": False,
        "required": ["title", "kind", "done"],
        "properties": {
            "title": {"type": "string"},
            "kind": {"type": "string", "enum": ["feature", "fix"]},
            "done": {"type": "boolean"},
        },
    }
    TYPED_RESULT = {"title": "", "kind": "feature", "done": False}
    FORCED_CHAT = {
        "model": MODEL,
        "stream": False,
        "max_completion_tokens": 256,
        "messages": [
            {"role": "system", "content": "Be brief."},
            {"role": "user", "content": "Describe the change."},
        ],
        "tool_choice": "required",
        "tools": [
            {
                "type": "function",
                "function": {
                    "name": "final_result",
                    "description": "The final response which ends this conversation",
                    "parameters": TYPED_SCHEMA,
                    "strict": True,
                },
            }
        ],
    }
    FORCED_MESSAGES = {
        "model": MODEL,
        "max_tokens": 256,
        "system": "Be brief.",
        "messages": [{"role": "user", "content": "Describe the change."}],
        "tool_choice": {"type": "any"},
        "tools": [
            {
                "name": "final_result",
                "description": "The final response which ends this conversation",
                "input_schema": TYPED_SCHEMA,
            }
        ],
    }
    failures = []
    # The usage record's `from` is the proof's start, less a margin for the
    # clocks of the nodes the pods run on.
    STARTED = (datetime.now(timezone.utc) - timedelta(seconds=10)).strftime("%Y-%m-%dT%H:%M:%SZ")
    USAGE_WAIT_SECONDS = 60


    def check(step, ok, detail):
        print(f"{step}: {'ok' if ok else 'FAILED'} ({detail})", flush=True)
        if not ok:
            failures.append(step)


    def chat_tool_arguments(answer):
        call = answer["choices"][0]["message"]["tool_calls"][0]
        return call["function"]["name"], json.loads(call["function"]["arguments"])


    def messages_tool_input(answer):
        block = answer["content"][0]
        if answer["stop_reason"] != "tool_use" or block["type"] != "tool_use":
            raise ValueError("not a tool_use answer")
        return block["name"], block["input"]


    # A refusal of the gateway and one of the stand-in differ in their body, so
    # a failed step prints it.
    def check_forced_tool(step, response, read):
        ok = False
        if response.status_code == 200:
            try:
                name, value = read(response.json())
                ok = name == "final_result" and value == TYPED_RESULT
            except (ValueError, KeyError, IndexError, TypeError):
                pass
        detail = f"status {response.status_code}"
        if not ok:
            detail += f", body {response.text[:300]!r}"
        check(step, ok, detail)


    with httpx.Client(timeout=15) as client:
        issued = client.post(
            f"{API}/v1/agent-tokens",
            headers={"Authorization": f"Bearer {os.environ['SERVICE_TOKEN']}"},
            json={
                "tenant": "default",
                "app": "smoke",
                "project": "matchmark",
                "agent": "proof",
                "task": "phase-0",
                "attempt": 1,
                "model": MODEL,
            },
        )
        check("1 token issued", issued.status_code == 201, f"status {issued.status_code}")
        if issued.status_code != 201:
            sys.exit(1)
        token = issued.json()["token"]
        headers = {"Authorization": f"Bearer {token}"}
        chat_url = f"{GATEWAY}/v1/chat/completions"
        messages_url = f"{GATEWAY}/v1/messages"

        answered = client.post(chat_url, headers=headers, json=REQUEST)
        usage = answered.json().get("usage") if answered.status_code == 200 else None
        check(
            "2 chat completions, the token and its model",
            usage is not None and usage.get("prompt_tokens") == 3 and usage.get("completion_tokens") == 16,
            f"status {answered.status_code}, usage {usage}",
        )

        answered = client.post(messages_url, headers=headers, json=REQUEST)
        usage = answered.json().get("usage") if answered.status_code == 200 else None
        check(
            "3 messages, the token and its model",
            usage is not None and usage.get("input_tokens") == 3 and usage.get("output_tokens") == 16,
            f"status {answered.status_code}, usage {usage}",
        )

        for step, url in (("4 chat completions", chat_url), ("5 messages", messages_url)):
            other = client.post(url, headers=headers, json={**REQUEST, "model": "claude-haiku-4-5"})
            check(f"{step}, another model", other.status_code == 403, f"status {other.status_code}")

        for step, url in (("6 chat completions", chat_url), ("7 messages", messages_url)):
            bare = client.post(url, json=REQUEST)
            check(f"{step}, no token", bare.status_code == 401, f"status {bare.status_code}")

        check_forced_tool(
            "8 chat completions, a forced tool",
            client.post(chat_url, headers=headers, json=FORCED_CHAT),
            chat_tool_arguments,
        )
        check_forced_tool(
            "9 messages, a forced tool",
            client.post(messages_url, headers=headers, json=FORCED_MESSAGES),
            messages_tool_input,
        )

        # The collector batches, so the rows land a moment after the calls. Both
        # plain calls (steps 2 and 3) must be there; a refused call logs no
        # usage and has none, and the forced tools' token counts differ.
        def priced(row):
            cost = row.get("cost_usd")
            return (
                row.get("input_tokens") == 3
                and row.get("output_tokens") == 16
                and cost is not None
                and Decimal(cost) > 0
                and row.get("app") == "smoke"
                and row.get("project") == "matchmark"
            )

        deadline = time.monotonic() + USAGE_WAIT_SECONDS
        rows = []
        while True:
            listed = client.get(
                f"{API}/v1/usage",
                headers={"Authorization": f"Bearer {os.environ['SERVICE_TOKEN']}"},
                params={"tenant": "default", "agent": "proof", "from": STARTED},
            )
            if listed.status_code == 200:
                rows = [row for row in listed.json().get("items", []) if priced(row)]
            if len(rows) >= 2 or time.monotonic() >= deadline:
                break
            time.sleep(3)
        check(
            "10 usage record, one row per successful call",
            len(rows) >= 2,
            f"status {listed.status_code}, {len(rows)} matching rows",
        )

    sys.exit(1 if failures else 0)
---
apiVersion: batch/v1
kind: Job
metadata:
  # The third segment is replaced with APP_VERSION (kustomization.yaml): Jobs are
  # immutable, so a release is a new Job and Argo CD prunes the previous one.
  name: gateway-proof-version-r2
  namespace: matchmark
  annotations:
    # After the API's new pods are Healthy: the last step reads the usage
    # record through them.
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 1
  # Two attempts, the last step's minute of waiting included.
  activeDeadlineSeconds: 420
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matchmark-proof
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull-vault
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proof
          image: ghcr.io/0xc0-labs/matchmark-api
          command: [python, /proof/proof.py]
          env:
            - name: API_URL
              value: http://api.matchmark.svc.cluster.local
            - name: GATEWAY_URL
              value: http://gateway.matchmark.svc.cluster.local:8080
            - name: SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: matchmark-api-vault
                  key: service_token
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: proof
              mountPath: /proof
              readOnly: true
      volumes:
        - name: proof
          configMap:
            name: proof-script

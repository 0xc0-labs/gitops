# The proof that the chain holds (README.md, The proof): after every sync, the
# API issues a token, the gateway answers a call made with it, and refuses the
# calls that should be refused.
apiVersion: v1
kind: ConfigMap
metadata:
  name: proof-script
  namespace: matchmark
data:
  proof.py: |
    import os
    import sys

    import httpx

    API = os.environ["API_URL"]
    GATEWAY = os.environ["GATEWAY_URL"]
    MODEL = "claude-sonnet-4-5"
    REQUEST = {
        "model": MODEL,
        "max_tokens": 32,
        "messages": [{"role": "user", "content": "Say only: ok"}],
    }
    failures = []


    def check(step, ok, detail):
        print(f"{step}: {'ok' if ok else 'FAILED'} ({detail})", flush=True)
        if not ok:
            failures.append(step)


    with httpx.Client(timeout=15) as client:
        issued = client.post(
            f"{API}/v1/agent-tokens",
            headers={"Authorization": f"Bearer {os.environ['SERVICE_TOKEN']}"},
            json={
                "tenant": "default",
                "app": "smoke",
                "project": "matchmark",
                "agent": "proof",
                "task": "phase-0",
                "attempt": 1,
                "model": MODEL,
            },
        )
        check("1 token issued", issued.status_code == 201, f"status {issued.status_code}")
        if issued.status_code != 201:
            sys.exit(1)
        token = issued.json()["token"]
        url = f"{GATEWAY}/v1/messages"

        answered = client.post(url, headers={"Authorization": f"Bearer {token}"}, json=REQUEST)
        usage = answered.json().get("usage") if answered.status_code == 200 else None
        check(
            "2 call with the token and its model",
            usage is not None and usage.get("input_tokens") == 3 and usage.get("output_tokens") == 16,
            f"status {answered.status_code}, usage {usage}",
        )

        other = client.post(
            url,
            headers={"Authorization": f"Bearer {token}"},
            json={**REQUEST, "model": "claude-haiku-4-5"},
        )
        check("3 call asking for another model", other.status_code == 403, f"status {other.status_code}")

        bare = client.post(url, json=REQUEST)
        check("4 call with no token", bare.status_code == 401, f"status {bare.status_code}")

    sys.exit(1 if failures else 0)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gateway-proof
  namespace: matchmark
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matchmark-proof
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull-vault
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proof
          image: ghcr.io/0xc0-labs/matchmark-api
          command: [python, /proof/proof.py]
          env:
            - name: API_URL
              value: http://api.matchmark.svc.cluster.local
            - name: GATEWAY_URL
              value: http://gateway.matchmark.svc.cluster.local:8080
            - name: SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: matchmark-api-vault
                  key: service_token
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: proof
              mountPath: /proof
              readOnly: true
      volumes:
        - name: proof
          configMap:
            name: proof-script

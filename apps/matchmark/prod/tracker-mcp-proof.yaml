# The proof that the route to `tracker-mcp` holds (README.md, tracker-mcp): once
# per deployed version, as the gateway's (proof.yaml). A plain Job, not a sync
# hook: a hook that fails holds every later sync back. It runs in the API's
# image, which has Python and httpx, with the label the gateway's proof has, so
# it takes the same network rules.
apiVersion: batch/v1
kind: Job
metadata:
  # `version` is replaced with APP_VERSION (kustomization.yaml): Jobs are
  # immutable, so a release is a new Job and Argo CD prunes the previous one.
  # A Job that reruns on the same version needs a new name, so the suffix
  # moves when the proof changes (#631).
  name: tracker-mcp-proof-version-r3
  namespace: matchmark
  annotations:
    # After the API's and the server's new pods are Healthy.
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matchmark-proof
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull-vault
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proof
          image: ghcr.io/0xc0-labs/matchmark-api
          command: [python, /proof/proof.py]
          env:
            - name: API_URL
              value: http://api.matchmark.svc.cluster.local
            - name: GATEWAY_URL
              value: http://gateway.matchmark.svc.cluster.local:8080
            - name: SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: matchmark-api-vault
                  key: service_token
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: proof
              mountPath: /proof
              readOnly: true
      volumes:
        - name: proof
          configMap:
            name: tracker-mcp-proof

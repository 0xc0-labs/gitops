# The door for what a connector sends signed (README.md, intake-api). The image
# is the kustomization's pin, never a tag here. It keeps nothing: no volume but
# /tmp.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: intake-api
  namespace: matchmark
automountServiceAccountToken: false
---
# Cluster-internal only, and no route: Plane's worker is the one caller
# (network-policy-intake.yaml). Port 80 is translated to the pod's 8000 before
# a policy applies.
apiVersion: v1
kind: Service
metadata:
  name: intake-api
  namespace: matchmark
spec:
  selector:
    app.kubernetes.io/name: matchmark-intake-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intake-api
  namespace: matchmark
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: matchmark-intake-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matchmark-intake-api
    spec:
      serviceAccountName: intake-api
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull-vault
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # A Secret's files belong to root: the group is how the user reads
        # them (mode 0440, below, as decimal 288).
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: intake-api
          image: ghcr.io/0xc0-labs/matchmark-intake-api
          envFrom:
            - configMapRef:
                name: release
          env:
            - name: MATCHMARK_INTAKE_API_ADDRESS
              value: http://api.matchmark.svc.cluster.local
            - name: MATCHMARK_INTAKE_API_TOKEN_FILE
              value: /run/secrets/intake-api/token
            # No connector until Plane's webhook secret exists: a connector
            # with some of its settings and not all stops the start, so the
            # door serves nothing and answers every webhook 404
            # (README.md, intake-api).
            - name: MATCHMARK_INTAKE_API_CONNECTORS
              value: ""
            # To turn the Plane connector on, once `plane-webhook` below
            # exists: the connector's name here, and
            #
            # - name: MATCHMARK_INTAKE_API_CONNECTORS
            #   value: plane
            # - name: MATCHMARK_INTAKE_API_PLANE_TENANT
            #   value: default
            # - name: MATCHMARK_INTAKE_API_PLANE_WORKSPACE
            #   value: "0xc0"
            # - name: MATCHMARK_INTAKE_API_PLANE_PROJECTS
            #   value: 6d044e4f-e44a-4be5-86ae-8f7ec48b05cd=PLAY
            # - name: MATCHMARK_INTAKE_API_PLANE_WEBHOOK_SECRET_FILE
            #   value: /run/secrets/plane-webhook/secret
            #
            # with the volume and the mount of the same name, from the Secret
            # `matchmark-plane-webhook-vault`, key `secret`, mode 0440.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://openobserve-collector-gateway-collector.openobserve-collector.svc.cluster.local:4318
            - name: OTEL_SERVICE_NAME
              value: matchmark-intake-api
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.version=$(APP_VERSION),deployment.environment=prod
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: intake-token
              mountPath: /run/secrets/intake-api
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: intake-token
          secret:
            secretName: matchmark-intake-api-vault
            defaultMode: 288 # 0440
            items:
              - key: token
                path: token

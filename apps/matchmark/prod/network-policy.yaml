apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: matchmark
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dns
  namespace: matchmark
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Under Canal a Service address is translated before the policy applies, so
# the rule names the three RKE2 servers (infrastructure's `servers`).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: controller-to-api-server
  namespace: matchmark
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentgateway
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.10.4.21/32
        - ipBlock:
            cidr: 10.10.4.22/32
        - ipBlock:
            cidr: 10.10.4.23/32
      ports:
        - protocol: TCP
          port: 6443
---
# xDS: the proxy pulls its configuration from the controller.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: proxy-to-controller
  namespace: matchmark
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agentgateway
      ports:
        - protocol: TCP
          port: 9978
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: xds-from-proxy
  namespace: matchmark
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentgateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: gateway
      ports:
        - protocol: TCP
          port: 9978
---
# The proxy's access log and traces, over OTLP gRPC.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otlp-to-collector
  namespace: matchmark
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opentelemetry
          podSelector:
            matchLabels:
              app.kubernetes.io/component: opentelemetry-collector
              app.kubernetes.io/instance: opentelemetry.otel-gateway
      ports:
        - protocol: TCP
          port: 4317
---
# The scrape of the collector and of Prometheus: the controller's metrics and
# the proxy's.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics-from-collector
  namespace: matchmark
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openobserve-collector
          podSelector:
            matchLabels:
              app.kubernetes.io/component: opentelemetry-collector
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 15020
---
# RustFS pushes its metrics over OTLP/HTTP. What it accepts on 9000 is in
# network-policy-artifacts.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rustfs-otlp-to-collector
  namespace: matchmark
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rustfs
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opentelemetry
          podSelector:
            matchLabels:
              app.kubernetes.io/component: opentelemetry-collector
              app.kubernetes.io/instance: opentelemetry.otel-gateway
      ports:
        - protocol: TCP
          port: 4318
---
# The API's port: Traefik's pods for WARP, the namespace's gateway, which
# fetches the JWKS from inside the cluster, `intake-api` and `tracker-mcp`. The Service's port 80 is
# translated to 8000 before the policy applies.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingress
  namespace: matchmark
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: matchmark-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agentgateway
        - podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: matchmark-intake-api
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: matchmark-tracker-mcp
      ports:
        - protocol: TCP
          port: 8000
---
# The controller and the proxy fetch the API's JWKS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: controller-to-api
  namespace: matchmark
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentgateway
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: matchmark-api
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: proxy-to-api
  namespace: matchmark
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: matchmark-api
      ports:
        - protocol: TCP
          port: 8000
---
# Vault's API: the API signs and reads its key's public half with its own
# identity.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-to-vault
  namespace: matchmark
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: matchmark-api
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
              component: server
      ports:
        - protocol: TCP
          port: 8200
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-otlp-to-collector
  namespace: matchmark
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: matchmark-api
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opentelemetry
          podSelector:
            matchLabels:
              app.kubernetes.io/component: opentelemetry-collector
              app.kubernetes.io/instance: opentelemetry.otel-gateway
      ports:
        - protocol: TCP
          port: 4318

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: matchmark
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dns
  namespace: matchmark
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Under Canal a Service address is translated before the policy applies, so
# the rule names the three RKE2 servers (infrastructure's `servers`).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: controller-to-api-server
  namespace: matchmark
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentgateway
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.10.4.21/32
        - ipBlock:
            cidr: 10.10.4.22/32
        - ipBlock:
            cidr: 10.10.4.23/32
      ports:
        - protocol: TCP
          port: 6443
---
# xDS: the proxy pulls its configuration from the controller.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: proxy-to-controller
  namespace: matchmark
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agentgateway
      ports:
        - protocol: TCP
          port: 9978
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: xds-from-proxy
  namespace: matchmark
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentgateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: gateway
      ports:
        - protocol: TCP
          port: 9978
---
# The proxy's access log and traces, over OTLP gRPC.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otlp-to-collector
  namespace: matchmark
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openobserve-collector
          podSelector:
            matchLabels:
              app.kubernetes.io/component: opentelemetry-collector
              app.kubernetes.io/instance: openobserve-collector.openobserve-collector-gateway
      ports:
        - protocol: TCP
          port: 4317
---
# The collector's scrape: the controller's metrics and the proxy's.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics-from-collector
  namespace: matchmark
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openobserve-collector
          podSelector:
            matchLabels:
              app.kubernetes.io/component: opentelemetry-collector
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 15020
---
# RustFS pushes its metrics over OTLP/HTTP. It accepts connections from no pod
# yet: the consumer's own policy opens 9000 when there is one.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rustfs-otlp-to-collector
  namespace: matchmark
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rustfs
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openobserve-collector
          podSelector:
            matchLabels:
              app.kubernetes.io/component: opentelemetry-collector
              app.kubernetes.io/instance: openobserve-collector.openobserve-collector-gateway
      ports:
        - protocol: TCP
          port: 4318

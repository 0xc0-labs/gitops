# Matchmark's agentgateway (controller, CRDs and one Gateway, in-cluster only)
# and its object store, RustFS, and its API (../README.md). The agentgateway
# and the API hold no data; RustFS's volume declares its backup in rustfs.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: matchmark
# The sandboxd pin, shared with the sandbox proof (README.md, The factory worker).
components:
  - ../../matchmark-sandboxes/sandboxd-image
helmCharts:
  - name: agentgateway-crds
    repo: oci://cr.agentgateway.dev/charts
    version: v1.7.0
    releaseName: agentgateway-crds
    namespace: matchmark
    kubeVersion: "1.36.4"
  - name: agentgateway
    repo: oci://cr.agentgateway.dev/charts
    version: v1.7.0
    releaseName: agentgateway
    namespace: matchmark
    kubeVersion: "1.36.4"
    valuesFile: values.yaml
resources:
  - namespace.yaml
  - gateway.yaml
  - network-policy.yaml
  - vault-secrets.yaml
  - rustfs.yaml
  - api.yaml
  - intake-api.yaml
  - network-policy-intake.yaml
  - migrate.yaml
  - network-policy-usage.yaml
  - stand-in-provider.yaml
  - gateway-route.yaml
  - network-policy-provider.yaml
  - proof.yaml
  - claude-subscription.yaml
  - network-policy-subscription.yaml
  - gateway-warp.yaml
  - factory-worker.yaml
  - network-policy-worker.yaml
  - network-policy-tracker.yaml
  - network-policy-sandbox.yaml
  - network-policy-artifacts.yaml
  - artifacts.yaml
  - runner-proof.yaml
  - runner-sandbox-proof.yaml
images:
  - name: cr.agentgateway.dev/controller
    newTag: v1.7.0
    digest: sha256:87c1363bf0cbc7fdb375866e592294114c8763097d2d0c9fc45fcb1fe00a4ab8
  # The API's and the stand-in's pins, one tag: the application's release job
  # moves both (README.md, The API).
  - name: ghcr.io/0xc0-labs/matchmark-api
    newTag: v0.38.8
    digest: sha256:2dd9f786f49a39896b0b8c2c51ef4d75f93a4bb455fbb18a1472a16e317130f1
  - name: ghcr.io/0xc0-labs/matchmark-stand-in-provider
    newTag: v0.38.8
    digest: sha256:789c5d6eac1d5d98f75f44f2d3c8196f92b7a44549f5a18f7ff129d28a986ee9
  # Built from the release's commit, v0.38.8 (d416e8e): the release job does
  # not list it yet, so this pin is moved by hand until it does.
  - name: ghcr.io/0xc0-labs/matchmark-intake-api
    newTag: v0.38.8
    digest: sha256:91dd07c8ea8c5018f2fd6726c7bd32e690cb6a2afa557ac05165971db8f49fa8
  - name: ghcr.io/0xc0-labs/matchmark-factory-worker
    newTag: v0.38.8
    digest: sha256:ffc837a451c34208b1a742bd1dfe11b2b6305641143d20054cd9d3d718681a29
  # The runner's pin: the proof's init container carries it, and the worker's
  # MATCHMARK_RUNNER_IMAGE, and the sandbox proof's, are copied from there
  # (replacements, below). v0.31.0
  # was built from the commit of this digest; the registry carries that tag for
  # the runner from the first release that lists it. A pull goes by the digest.
  - name: ghcr.io/0xc0-labs/matchmark-runner
    newTag: v0.38.8
    digest: sha256:c7db50858b1036b6d55d1faaf013e774d4d40b59678f7bc7916b1c92eaf87647
configMapGenerator:
  # No hash suffix: a Job's pod template cannot change, so a renamed ConfigMap
  # would fail the sync instead of leaving the finished Jobs alone.
  - name: artifacts
    files:
      - artifacts/s3.py
      - artifacts/rc-setup.sh
      - artifacts/setup.py
      - artifacts/worker-proof.py
      - artifacts/policy.json
    options:
      disableNameSuffixHash: true
  # Same reason as `artifacts`: the proof Jobs' templates cannot change.
  - name: runner-proof
    files:
      - runner-proof/proof.py
      - runner-proof/sandbox-proof.py
    options:
      disableNameSuffixHash: true
  - name: release
    literals:
      - APP_VERSION=v0.38.8
replacements:
  # `images:` rewrites container images only, so the worker's setting takes the
  # rendered `<name>:<tag>@sha256:<digest>` of the proof's init container:
  # one pin, and they cannot differ (README.md, The runner). It comes first:
  # it finds the Job by the name the next entry replaces.
  - source:
      kind: Job
      name: runner-proof-version-r3
      fieldPath: spec.template.spec.initContainers.[name=runner].image
    targets:
      - select:
          kind: Deployment
          name: factory-worker
        fieldPaths:
          - spec.template.spec.containers.[name=factory-worker].env.[name=MATCHMARK_RUNNER_IMAGE].value
      - select:
          kind: Job
          name: runner-sandbox-proof-version-r2
        fieldPaths:
          - spec.template.spec.containers.[name=proof].env.[name=MATCHMARK_RUNNER_IMAGE].value
  - source:
      kind: ConfigMap
      name: release
      fieldPath: data.APP_VERSION
    targets:
      - select:
          kind: Job
          name: gateway-proof-version
        fieldPaths:
          - metadata.name
        options:
          delimiter: "-"
          index: 2
      - select:
          kind: Job
          name: runner-proof-version-r3
        fieldPaths:
          - metadata.name
        options:
          delimiter: "-"
          index: 2
      - select:
          kind: Job
          name: runner-sandbox-proof-version-r2
        fieldPaths:
          - metadata.name
        options:
          delimiter: "-"
          index: 3
patches:
  # Deleting a CRD deletes every object of its kind.
  - target:
      kind: CustomResourceDefinition
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-options
        value: Prune=false
  # Nothing here uses it, and the CRD chart has no values to leave it out; the
  # controller's own switch is off (values.yaml).
  - target:
      kind: CustomResourceDefinition
      name: agentgatewaymodels.agentgateway.dev
    patch: |-
      $patch: delete
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: agentgatewaymodels.agentgateway.dev

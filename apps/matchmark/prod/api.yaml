# Matchmark's API (README.md, The API). The image is the kustomization's pin,
# never a tag here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: matchmark
# Vault takes the projected token below, not the API's.
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: matchmark
spec:
  selector:
    app.kubernetes.io/name: matchmark-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: matchmark
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: matchmark-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matchmark-api
    spec:
      serviceAccountName: api
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull-vault
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # A Secret's files belong to root: the group is how the user reads the
        # Plane key (mode 0440, below, as decimal 288).
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/0xc0-labs/matchmark-api
          envFrom:
            - configMapRef:
                name: release
          env:
            - name: MATCHMARK_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: matchmark-api-vault
                  key: service_token
            - name: MATCHMARK_ISSUER
              value: https://api.matchmark.int.0xc0.cc
            - name: MATCHMARK_VAULT_SA_TOKEN_FILE
              value: /var/run/secrets/vault/token
            - name: PGHOST
              value: postgres.postgres.svc.cluster.local
            - name: PGDATABASE
              value: matchmark
            - name: PGUSER
              value: matchmark
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: matchmark-database-vault
                  key: password
            # The shared PostgreSQL serves no TLS (README.md, The usage record).
            - name: PGSSLMODE
              value: disable
            - name: MATCHMARK_TEMPORAL_ADDRESS
              value: temporal-frontend.matchmark.svc.cluster.local:7233
            # Operator decision, 2026-11-19: an agent runs on one of two
            # harnesses, chosen by the platform's administrator per
            # workspace, and the operator's own workspace runs on the Claude
            # Agent SDK, paid by their subscription. Until there is more than
            # one workspace the choice is this setting, kept in Git with the
            # deployment (matchmark's docs/platform/workspaces.md).
            - name: MATCHMARK_HARNESS
              value: claude_agent_sdk
            # The application that runs tasks.
            - name: MATCHMARK_TASK_APP
              value: factory
            # The tracker's connection (README.md, The tracker): the key is a
            # file, never a variable. No webhook secret: only `intake-api`
            # holds one.
            - name: MATCHMARK_TRACKER_ADDRESS
              value: http://plane-api.plane.svc.cluster.local:8000
            - name: MATCHMARK_TRACKER_WORKSPACE
              value: "0xc0"
            - name: MATCHMARK_TRACKER_API_KEY_FILE
              value: /run/secrets/plane/api_key
            # The door's token, a file: `intake-api` holds the same one, and
            # the API accepts it on `POST /v1/tracker/events` alone
            # (README.md, intake-api).
            - name: MATCHMARK_API_INTAKE_TOKEN_FILE
              value: /run/secrets/intake-api/token
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-gateway.opentelemetry.svc.cluster.local:4318
            # Grafana's Explore of the `tempo` data source
            # (platform/kube-prometheus-stack) for one trace, for the
            # operators over WARP: a client never reaches it. The API accepts
            # no `{` or `}` besides its placeholders, so the panes are
            # percent-encoded, and Grafana takes milliseconds where the
            # placeholders are microseconds: the range is the last 14 days,
            # Tempo's retention. An address, not a secret.
            - name: MATCHMARK_TRACE_URL_TEMPLATE
              value: https://grafana.int.0xc0.cc/explore?schemaVersion=1&orgId=1&panes=%7B%22a%22%3A%7B%22datasource%22%3A%22tempo%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22datasource%22%3A%7B%22type%22%3A%22tempo%22%2C%22uid%22%3A%22tempo%22%7D%2C%22queryType%22%3A%22traceql%22%2C%22query%22%3A%22{trace_id}%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22now-14d%22%2C%22to%22%3A%22now%22%7D%7D%7D
            - name: OTEL_SERVICE_NAME
              value: matchmark-api
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.version=$(APP_VERSION),deployment.environment=prod
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: vault-token
              mountPath: /var/run/secrets/vault
              readOnly: true
            - name: plane-api-key
              mountPath: /run/secrets/plane
              readOnly: true
            - name: intake-token
              mountPath: /run/secrets/intake-api
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: plane-api-key
          secret:
            secretName: matchmark-plane-vault
            defaultMode: 288 # 0440
            items:
              - key: api_key
                path: api_key
        - name: intake-token
          secret:
            secretName: matchmark-intake-api-vault
            defaultMode: 288 # 0440
            items:
              - key: token
                path: token
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: vault
                  expirationSeconds: 3600
                  path: token
---
# Internal only: WARP, on the listener of *.matchmark.int.0xc0.cc, with no
# public annotation. The paths are named so `/otlp`, which asks for no
# credential, is not reachable from here (README.md, The usage record).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  namespace: matchmark
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: internal-matchmark
  hostnames:
    - api.matchmark.int.0xc0.cc
  rules:
    - matches:
        - path:
            type: Exact
            value: /healthz
        - path:
            type: PathPrefix
            value: /v1/
        - path:
            type: PathPrefix
            value: /.well-known/
      backendRefs:
        - name: api
          port: 80

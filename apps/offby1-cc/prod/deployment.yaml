apiVersion: v1
kind: Service
metadata:
  name: offby1-cc
  namespace: offby1-cc
spec:
  selector:
    app.kubernetes.io/name: offby1-cc
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: offby1-cc
  namespace: offby1-cc
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: offby1-cc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: offby1-cc
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: offby1-cc
      containers:
        - name: web
          image: ghcr.io/0xc0-labs/offby1.cc:sha-e1bc299@sha256:4bf2b71b708f9f588959de9b2dd4ea0a7263502c03e42dbe6fc25d79553a43aa
          env:
            # Next.js binds to $HOSTNAME, which Kubernetes sets to the pod's
            # name.
            - name: HOSTNAME
              value: 0.0.0.0
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://openobserve-collector-gateway-collector.openobserve-collector.svc.cluster.local:4318
            - name: OTEL_SERVICE_NAME
              value: offby1-cc
            # Optional: without it the page renders with RUM off.
            - name: OPENOBSERVE_RUM_CLIENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: offby1-cc-rum-vault
                  key: client_token
                  optional: true
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz/
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz/
              port: http
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

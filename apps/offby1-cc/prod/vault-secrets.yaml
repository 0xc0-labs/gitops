# OpenObserve's RUM client token: one per organization, shared by every
# frontend. Public by design, but it lives in Vault like any credential.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: offby1-cc
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-secrets
  namespace: offby1-cc
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    # Shared by every application; admits this namespace by its label.
    role: apps
    serviceAccount: vault-secrets
    audiences: [vault]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: offby1-cc-rum
  namespace: offby1-cc
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: shared/openobserve-rum
  refreshAfter: 1h
  destination:
    name: offby1-cc-rum-vault
    create: true
    transformation:
      excludeRaw: true
  # Read at start: a new token restarts the pods.
  rolloutRestartTargets:
    - kind: Deployment
      name: offby1-cc

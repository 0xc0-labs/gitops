# This app's own headers (README.md, Headers).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: offby1-cc
spec:
  headers:
    frameDeny: true
    permissionsPolicy: camera=(), microphone=(), geolocation=(), payment=(), usb=()
    customResponseHeaders:
      Cross-Origin-Opener-Policy: same-origin
      Cross-Origin-Resource-Policy: same-origin
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: offby1-cc
  namespace: offby1-cc
  annotations:
    gateway.0xc0.cc/public: "true"
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure-offby1-cc-apex
  hostnames:
    - offby1.cc
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: security-headers
      backendRefs:
        - name: offby1-cc
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: offby1-cc-www
  namespace: offby1-cc
  annotations:
    gateway.0xc0.cc/public: "true"
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure-offby1-cc
  hostnames:
    - www.offby1.cc
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            # With the scheme set, the redirect uses 443, not the listener's
            # 8443.
            scheme: https
            hostname: offby1.cc
            statusCode: 301

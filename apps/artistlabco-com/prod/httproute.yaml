# This app's own headers (README.md, Headers).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
spec:
  headers:
    frameDeny: true
    permissionsPolicy: camera=(), microphone=(), geolocation=(), payment=(), usb=()
    customResponseHeaders:
      Cross-Origin-Opener-Policy: same-origin
      Cross-Origin-Resource-Policy: same-origin
---
# Per visitor: CF-Connecting-IP, since the public tunnel is the only way in.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rum-rate-limit
spec:
  rateLimit:
    average: 1
    period: 1s
    burst: 20
    sourceCriterion:
      requestHeaderName: Cf-Connecting-Ip
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: artistlabco-com
  annotations:
    gateway.0xc0.cc/public: "true"
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure-artistlabco-com-apex
  hostnames:
    - artistlabco.com
  rules:
    # The browsers' RUM, to OpenObserve's intake: only this path is public
    # (platform/openobserve/reference-grant.yaml).
    - matches:
        - path: {type: Exact, value: /rum/v1/default/rum}
          method: POST
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: rum-rate-limit
      backendRefs:
        - name: openobserve
          namespace: openobserve
          port: 5080
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: security-headers
      backendRefs:
        - name: artistlabco-com
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: artistlabco-com-www
  annotations:
    gateway.0xc0.cc/public: "true"
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure-artistlabco-com
  hostnames:
    - www.artistlabco.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            # With the scheme set, the redirect uses 443, not the listener's
            # 8443.
            scheme: https
            hostname: artistlabco.com
            statusCode: 301

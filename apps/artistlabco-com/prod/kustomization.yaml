# Backups: the front holds no data. The CMS's database is in the shared
# PostgreSQL, dumped nightly by platform/postgres (postgres-dumps/<namespace>);
# its media is in R2, with no copy (README.md, The CMS).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: artistlabco-com
resources:
  - namespace.yaml
  - ../base
  - network-policy.yaml
  - pdb.yaml
  - httproute.yaml
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: artistlabco-com
      spec:
        replicas: 2
# The pin (../README.md, Upgrades). A placeholder until the first release.
images:
  - name: ghcr.io/0xc0-labs/artistlabco.com
    newTag: v0.2.0
    digest: sha256:194485fe66c08aa17ab5ebde0c827156cff18504f4f3a466f81b9f6ea5c78194
  - name: ghcr.io/0xc0-labs/artistlabco.com-cms
    newTag: v0.2.0
    digest: sha256:c68d789db7e785cd56267c684b447247567180e78c6bd56f4fa12cd86df8a17d
configMapGenerator:
  - name: release
    literals:
      - APP_VERSION=v0.2.0
      - APP_ENVIRONMENT=prod
  - name: artistlabco-com
    behavior: merge
    literals:
      - PAYLOAD_URL=http://payload.payload.svc
      - CMS_URL=http://artistlabco-com-cms.artistlabco-com.svc
      - CMS_ADMIN_URL=https://cms.artistlabco.com
  - name: artistlabco-com-cms
    behavior: merge
    literals:
      - PUBLIC_URL=https://cms.artistlabco.com
      - FRONT_URL=https://artistlabco.com
      - MEDIA_BASE_URL=https://media.artistlabco.com
# Each Vault path starts with the namespace (../base/vault-secrets.yaml).
replacements:
  - source:
      kind: Namespace
      fieldPath: metadata.name
    targets:
      - select:
          kind: VaultStaticSecret
          name: artistlabco-com-payload
        fieldPaths: [spec.path]
        options: {delimiter: /, index: 0}
      - select:
          kind: VaultStaticSecret
          name: artistlabco-com-preview
        fieldPaths: [spec.path]
        options: {delimiter: /, index: 0}
      - select:
          kind: VaultStaticSecret
          name: artistlabco-com-database
        fieldPaths: [spec.path]
        options: {delimiter: /, index: 0}
      - select:
          kind: VaultStaticSecret
          name: artistlabco-com-cms
        fieldPaths: [spec.path]
        options: {delimiter: /, index: 0}
      - select:
          kind: VaultStaticSecret
          name: artistlabco-com-cms-client
        fieldPaths: [spec.path]
        options: {delimiter: /, index: 0}
      - select:
          kind: Deployment
          name: artistlabco-com-cms
        fieldPaths:
          - spec.template.spec.containers.[name=cms].env.[name=VAULT_INTEGRATIONS_PATH].value
        options: {delimiter: /, index: 0}

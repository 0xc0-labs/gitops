# Backups: the front holds no data. The CMS's database is in the shared
# PostgreSQL, dumped nightly by platform/postgres (postgres-dumps/<namespace>);
# its media is in R2, with no copy (README.md, The CMS).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: artistlabco-com-staging
resources:
  - namespace.yaml
  - ../base
  - network-policy.yaml
  - httproute.yaml
# The pin (../README.md, Upgrades). A placeholder until the first release
# candidate.
images:
  - name: ghcr.io/0xc0-labs/artistlabco.com
    newTag: v0.3.0-rc.14
    digest: sha256:03fdcbb4928f23e64a314d0b0e6524a0cbe521322dd1378d27ac75bc6b775035
  - name: ghcr.io/0xc0-labs/artistlabco.com-cms
    newTag: v0.3.0-rc.14
    digest: sha256:6e4248194bb1be9ec4d78be22bfdb3a5b1fc781816942649ad4a3ba9a9665c73
configMapGenerator:
  - name: release
    literals:
      - APP_VERSION=v0.3.0-rc.14
      - APP_ENVIRONMENT=staging
  - name: artistlabco-com
    behavior: merge
    literals:
      - PAYLOAD_URL=http://payload.payload-staging.svc
      - CMS_URL=http://artistlabco-com-cms.artistlabco-com-staging.svc
      - CMS_ADMIN_URL=https://cms-staging.artistlabco.com
  - name: artistlabco-com-cms
    behavior: merge
    literals:
      - PUBLIC_URL=https://cms-staging.artistlabco.com
      - FRONT_URL=https://staging.artistlabco.com
# Each Vault path starts with the namespace (../base/vault-secrets.yaml).
replacements:
  - source:
      kind: Namespace
      fieldPath: metadata.name
    targets:
      - select:
          kind: VaultStaticSecret
          name: artistlabco-com-payload
        fieldPaths: [spec.path]
        options: {delimiter: /, index: 0}
      - select:
          kind: VaultStaticSecret
          name: artistlabco-com-preview
        fieldPaths: [spec.path]
        options: {delimiter: /, index: 0}
      - select:
          kind: VaultStaticSecret
          name: artistlabco-com-database
        fieldPaths: [spec.path]
        options: {delimiter: /, index: 0}
      - select:
          kind: VaultStaticSecret
          name: artistlabco-com-cms
        fieldPaths: [spec.path]
        options: {delimiter: /, index: 0}
      - select:
          kind: VaultStaticSecret
          name: artistlabco-com-cms-client
        fieldPaths: [spec.path]
        options: {delimiter: /, index: 0}
      - select:
          kind: Deployment
          name: artistlabco-com-cms
        fieldPaths:
          - spec.template.spec.containers.[name=cms].env.[name=VAULT_INTEGRATIONS_PATH].value
        options: {delimiter: /, index: 0}

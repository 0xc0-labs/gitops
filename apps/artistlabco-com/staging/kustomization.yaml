# Backups: none. It holds no data.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: artistlabco-com-staging
resources:
  - namespace.yaml
  - ../base
  - network-policy.yaml
  - httproute.yaml
# The pin (../README.md, Upgrades). A placeholder until the first release
# candidate.
images:
  - name: ghcr.io/0xc0-labs/artistlabco.com
    newTag: v0.2.0-rc.23
    digest: sha256:052f0172865b545ac0218ce8247f00abc6379e0e68dccb7864fccfcc64d58a7f
configMapGenerator:
  - name: release
    literals:
      - APP_VERSION=v0.2.0-rc.23
      - APP_ENVIRONMENT=staging
  - name: artistlabco-com
    behavior: merge
    literals:
      - PAYLOAD_URL=http://payload.payload-staging.svc
# Each Vault path starts with the namespace (../base/vault-secrets.yaml).
replacements:
  - source:
      kind: Namespace
      fieldPath: metadata.name
    targets:
      - select:
          kind: VaultStaticSecret
          name: artistlabco-com-payload
        fieldPaths: [spec.path]
        options: {delimiter: /, index: 0}
      - select:
          kind: VaultStaticSecret
          name: artistlabco-com-preview
        fieldPaths: [spec.path]
        options: {delimiter: /, index: 0}

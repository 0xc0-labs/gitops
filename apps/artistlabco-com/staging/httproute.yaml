# Nothing of staging is public (../README.md), and it has no RUM intake.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
spec:
  headers:
    frameDeny: true
    permissionsPolicy: camera=(), microphone=(), geolocation=(), payment=(), usb=()
    customResponseHeaders:
      Cross-Origin-Opener-Policy: same-origin
      Cross-Origin-Resource-Policy: same-origin
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: artistlabco-com
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: internal
  hostnames:
    - artistlabco-com-staging.int.0xc0.cc
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: security-headers
      backendRefs:
        - name: artistlabco-com
          port: 80

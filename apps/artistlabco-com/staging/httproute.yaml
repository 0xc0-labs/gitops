# The internal route's (../README.md, Headers).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
spec:
  headers:
    frameDeny: true
    permissionsPolicy: camera=(), microphone=(), geolocation=(), payment=(), usb=()
    customResponseHeaders:
      Cross-Origin-Opener-Policy: same-origin
      Cross-Origin-Resource-Policy: same-origin
---
# The listener is internal: the client is the connection's address.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rum-rate-limit
spec:
  rateLimit:
    average: 1
    period: 1s
    burst: 20
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: artistlabco-com
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: internal
  hostnames:
    - artistlabco-com-staging.int.0xc0.cc
  rules:
    # The browsers' RUM, to OpenObserve's intake: only this path
    # (platform/openobserve/reference-grant.yaml).
    - matches:
        - path: {type: Exact, value: /rum/v1/default/rum}
          method: POST
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: rum-rate-limit
      backendRefs:
        - name: openobserve
          namespace: openobserve
          port: 5080
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: security-headers
      backendRefs:
        - name: artistlabco-com
          port: 80
---
# The public route's: Access is the gate, and the header keeps the site out of
# search results should it ever be misconfigured.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers-public
spec:
  headers:
    frameDeny: true
    permissionsPolicy: camera=(), microphone=(), geolocation=(), payment=(), usb=()
    customResponseHeaders:
      Cross-Origin-Opener-Policy: same-origin
      Cross-Origin-Resource-Policy: same-origin
      X-Robots-Tag: noindex, nofollow
---
# Per visitor: CF-Connecting-IP, since the public tunnel is the only way in.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rum-rate-limit-public
spec:
  rateLimit:
    average: 1
    period: 1s
    burst: 20
    sourceCriterion:
      requestHeaderName: Cf-Connecting-Ip
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: artistlabco-com-public
  annotations:
    gateway.0xc0.cc/public: "true"
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure-artistlabco-com
  hostnames:
    - staging.artistlabco.com
  rules:
    - matches:
        - path: {type: Exact, value: /rum/v1/default/rum}
          method: POST
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: rum-rate-limit-public
      backendRefs:
        - name: openobserve
          namespace: openobserve
          port: 5080
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: security-headers-public
      backendRefs:
        - name: artistlabco-com
          port: 80

# The image is each environment's pin, never a tag here (../README.md,
# Upgrades).
apiVersion: v1
kind: Service
metadata:
  name: artistlabco-com
spec:
  selector:
    app.kubernetes.io/name: artistlabco-com
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: artistlabco-com
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: artistlabco-com
  template:
    metadata:
      labels:
        app.kubernetes.io/name: artistlabco-com
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull-vault
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: artistlabco-com
      containers:
        - name: web
          image: ghcr.io/0xc0-labs/artistlabco.com
          envFrom:
            - configMapRef:
                name: artistlabco-com
            - configMapRef:
                name: release
          env:
            # Next.js binds to $HOSTNAME, which Kubernetes sets to the pod's
            # name.
            - name: HOSTNAME
              value: 0.0.0.0
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.version=$(APP_VERSION),deployment.environment=$(APP_ENVIRONMENT)
            - name: PAYLOAD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: artistlabco-com-payload-vault
                  key: api_key
            - name: PREVIEW_SECRET
              valueFrom:
                secretKeyRef:
                  name: artistlabco-com-preview-vault
                  key: secret
            - name: OPENOBSERVE_RUM_CLIENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: artistlabco-com-rum-vault
                  key: client_token
                  optional: true
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz/
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz/
              port: http
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

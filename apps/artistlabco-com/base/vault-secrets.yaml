# Each environment reads its own secrets at apps/<its namespace>/: the first
# segment of the paths below is set to the namespace by each environment's
# kustomization.yaml (replacements), and Vault's apps policy grants nothing
# else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-secrets
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    # Shared by every application; admits this namespace by its label.
    role: apps
    serviceAccount: vault-secrets
    audiences: [vault]
---
# The key this front reads its Payload with.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: artistlabco-com-payload
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: NAMESPACE/payload
  refreshAfter: 1h
  destination:
    name: artistlabco-com-payload-vault
    create: true
    transformation:
      excludeRaw: true
  rolloutRestartTargets:
    - kind: Deployment
      name: artistlabco-com
---
# The same value as Payload's apps/<its namespace>/preview.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: artistlabco-com-preview
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: NAMESPACE/preview
  refreshAfter: 1h
  destination:
    name: artistlabco-com-preview-vault
    create: true
    transformation:
      excludeRaw: true
  rolloutRestartTargets:
    - kind: Deployment
      name: artistlabco-com
---
# The RUM client token is public by design, but it lives in Vault like any
# credential.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: artistlabco-com-rum
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: shared/openobserve-rum
  refreshAfter: 1h
  destination:
    name: artistlabco-com-rum-vault
    create: true
    transformation:
      excludeRaw: true
  rolloutRestartTargets:
    - kind: Deployment
      name: artistlabco-com
---
# The image is private: the kubelet reads this at each pull, so a new token
# needs no restart.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ghcr-pull
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: shared/ghcr-pull
  refreshAfter: 1h
  destination:
    name: ghcr-pull-vault
    create: true
    type: kubernetes.io/dockerconfigjson
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        .dockerconfigjson:
          text: '{{ dict "auths" (dict "ghcr.io" (dict "auth" (printf "%s:%s" (get .Secrets "username") (get .Secrets "password") | b64enc))) | toJson }}'
---
# The PostgreSQL role's password; platform/postgres reads the same path to
# create the role and the database.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: artistlabco-com-database
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: NAMESPACE/database
  refreshAfter: 1h
  destination:
    name: artistlabco-com-database-vault
    create: true
    transformation:
      excludeRaw: true
  rolloutRestartTargets:
    - kind: Deployment
      name: artistlabco-com-cms
---
# Strapi's secrets and the first super admin, each key named as the
# environment variable it becomes. New ones sign every admin out.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: artistlabco-com-cms
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: NAMESPACE/cms
  refreshAfter: 1h
  destination:
    name: artistlabco-com-cms-vault
    create: true
    transformation:
      excludeRaw: true
  rolloutRestartTargets:
    - kind: Deployment
      name: artistlabco-com-cms
---
# The front's read-only Strapi API token: the front sends it, Strapi accepts it.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: artistlabco-com-cms-client
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: NAMESPACE/cms-client
  refreshAfter: 1h
  destination:
    name: artistlabco-com-cms-client-vault
    create: true
    transformation:
      excludeRaw: true
  rolloutRestartTargets:
    - kind: Deployment
      name: artistlabco-com
    - kind: Deployment
      name: artistlabco-com-cms

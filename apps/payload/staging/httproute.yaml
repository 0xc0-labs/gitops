# Everything, admin included, over WARP only: never the public annotation,
# never a websecure listener.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: payload
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: internal
  hostnames:
    - payload-staging.int.0xc0.cc
  rules:
    - backendRefs:
        - name: payload
          port: 80

# Staging's data (../README.md). No TTL: the reset copies this Job, so it
# stays until the next sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: payload-seed
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payload-seed
        app.kubernetes.io/part-of: payload
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull-vault
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        # The migrations' settings (../base/migrate.yaml).
        - name: seed
          image: ghcr.io/0xc0-labs/payload
          args: [seed]
          envFrom:
            - configMapRef:
                name: payload
            - configMapRef:
                name: release
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payload-database-vault
                  key: password
            - name: DATABASE_URI
              value: postgres://$(NAMESPACE):$(DATABASE_PASSWORD)@postgres.postgres.svc.cluster.local:5432/$(NAMESPACE)
            - name: PAYLOAD_SECRET
              valueFrom:
                secretKeyRef:
                  name: payload-app-vault
                  key: payload-secret
            # Optional: without the key, the seed of an empty database fails
            # with its own message, instead of the pod never starting while
            # the hook waits. One with data does not read it.
            - name: SEED_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payload-app-vault
                  key: seed-password
                  optional: true
            # Its config loads the media storage plugin, as the server's does.
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: payload-media-vault
                  key: access_key_id
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: payload-media-vault
                  key: secret_access_key
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.version=$(APP_VERSION),deployment.environment=$(APP_ENVIRONMENT)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi

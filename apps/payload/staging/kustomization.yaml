# Backups:
# - The media uploaded in tests: the R2 bucket payload-staging-media, with no
#   copy. The seed holds no media.
# - Its database: platform/postgres's nightly dump,
#   postgres-dumps/payload-staging.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payload-staging
resources:
  - namespace.yaml
  - ../base
  - httproute.yaml
  - seed.yaml
# The pin (../README.md, Delivery).
images:
  - name: ghcr.io/0xc0-labs/payload
    newTag: v0.3.1-rc.8
    digest: sha256:f966aaad0e0a8d06bab3eabf7ce9e9cdbc6edce0622b6e8fe638da12614fa649
configMapGenerator:
  - name: release
    literals:
      - APP_VERSION=v0.3.1-rc.8
      - APP_ENVIRONMENT=staging
  # No MEDIA_PUBLIC_URL: Payload serves the files itself (../README.md, Media).
  - name: payload
    behavior: merge
    literals:
      - PAYLOAD_PUBLIC_SERVER_URL=https://payload-staging.int.0xc0.cc
      - S3_ENDPOINT=https://ca1599ae7852d5b4718cba351adad927.r2.cloudflarestorage.com
      - S3_BUCKET=payload-staging-media
  - name: payload-email
    behavior: merge
    literals:
      - EMAIL_FROM_NAME=0xc0 (staging)
# Not optional: staging never mails a real recipient (../README.md, Email).
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: payload
      spec:
        template:
          spec:
            containers:
              - name: web
                env:
                  - name: EMAIL_REDIRECT_TO
                    valueFrom:
                      secretKeyRef:
                        name: payload-email-vault
                        key: redirect_to
# Each Vault path starts with the namespace (../base/vault-secrets.yaml).
replacements:
  - source:
      kind: Namespace
      fieldPath: metadata.name
    targets:
      - select:
          kind: VaultStaticSecret
          name: payload-database
        fieldPaths: [spec.path]
        options: {delimiter: /, index: 0}
      - select:
          kind: VaultStaticSecret
          name: payload-app
        fieldPaths: [spec.path]
        options: {delimiter: /, index: 0}
      - select:
          kind: VaultStaticSecret
          name: payload-media
        fieldPaths: [spec.path]
        options: {delimiter: /, index: 0}
      - select:
          kind: VaultStaticSecret
          name: payload-email
        fieldPaths: [spec.path]
        options: {delimiter: /, index: 0}

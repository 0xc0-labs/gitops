# Payload CMS in staging: the same application as prod, its own namespace,
# database, bucket and Vault path, reached over WARP only, filled with the
# seed. ../README.md.
#
# Backups:
# - The media uploaded in tests: the R2 bucket payload-staging-media, which
#   keeps no copies of its own. The seed holds no media.
# - Its database: platform/postgres's nightly dump,
#   postgres-dumps/payload-staging.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payload-staging
resources:
  - namespace.yaml
  - ../base
  - httproute.yaml
  - seed.yaml
# The pin: each release candidate's PR changes only newTag, digest and
# APP_VERSION, which must equal newTag (pin / check), and merges itself once
# its checks pass. Until the first rc, a placeholder.
images:
  - name: ghcr.io/0xc0-labs/payload
    newTag: v0.2.1-rc.1
    digest: sha256:05156a8de36949146c0f003129124adc772c2d2074e7c5e9e1b5b0ec00902814
configMapGenerator:
  - name: release
    literals:
      - APP_VERSION=v0.2.1-rc.1
      - APP_ENVIRONMENT=staging
  # The media in R2, served by Payload itself at /api/media/file/, over
  # WARP: the bucket has no public hostname.
  - name: payload
    behavior: merge
    literals:
      - PAYLOAD_PUBLIC_SERVER_URL=https://payload-staging.int.0xc0.cc
      - S3_ENDPOINT=https://ca1599ae7852d5b4718cba351adad927.r2.cloudflarestorage.com
      - S3_BUCKET=payload-staging-media
# The environment's own Vault paths start with its namespace
# (../base/vault-secrets.yaml).
replacements:
  - source:
      kind: Namespace
      fieldPath: metadata.name
    targets:
      - select:
          kind: VaultStaticSecret
          name: payload-database
        fieldPaths: [spec.path]
        options: {delimiter: /, index: 0}
      - select:
          kind: VaultStaticSecret
          name: payload-app
        fieldPaths: [spec.path]
        options: {delimiter: /, index: 0}
      - select:
          kind: VaultStaticSecret
          name: payload-media
        fieldPaths: [spec.path]
        options: {delimiter: /, index: 0}

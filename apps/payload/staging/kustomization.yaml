# Payload CMS in staging: the same application as prod, its own namespace,
# database, volumes and Vault path, reached over WARP only, filled with the
# seed. ../README.md.
#
# Backups:
# - payload-media (Longhorn, 2Gi): the seed's media and what is uploaded in
#   tests, covered by PBS's nightly backup of the RKE2 VMs (03:00).
# - Its database: platform/postgres's nightly dump,
#   postgres-dumps/payload-staging.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payload-staging
resources:
  - namespace.yaml
  - ../base
  - httproute.yaml
  - seed.yaml
# The pin: each release candidate's PR changes only newTag, digest and
# APP_VERSION, which must equal newTag (pin / check), and merges itself once
# its checks pass. Until the first rc, a placeholder.
images:
  - name: ghcr.io/0xc0-labs/payload
    newTag: v0.2.0-rc.1
    digest: sha256:7aa66d5bf1cd845b7883ba7edd0227ff0b2d0d0e0b9f2119d784c28ac642b1e0
configMapGenerator:
  - name: release
    literals:
      - APP_VERSION=v0.2.0-rc.1
      - APP_ENVIRONMENT=staging
  - name: payload
    behavior: merge
    literals:
      - PAYLOAD_PUBLIC_SERVER_URL=https://payload-staging.int.0xc0.cc
patches:
  # The seed and the tests need little room.
  - target:
      kind: PersistentVolumeClaim
      name: payload-media
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 2Gi
# The environment's own Vault paths start with its namespace
# (../base/vault-secrets.yaml).
replacements:
  - source:
      kind: Namespace
      fieldPath: metadata.name
    targets:
      - select:
          kind: VaultStaticSecret
          name: payload-database
        fieldPaths: [spec.path]
        options: {delimiter: /, index: 0}
      - select:
          kind: VaultStaticSecret
          name: payload-app
        fieldPaths: [spec.path]
        options: {delimiter: /, index: 0}

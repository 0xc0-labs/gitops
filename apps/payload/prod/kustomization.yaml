# Backups:
# - The uploaded media: the R2 bucket payload-media, with no copy: an
#   accepted risk (../README.md, Media).
# - Its database: platform/postgres's nightly dump, postgres-dumps/payload.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payload
resources:
  - namespace.yaml
  - ../base
  - httproute.yaml
  - front.yaml
  - mautic.yaml
# The pin (../README.md, Delivery).
images:
  - name: ghcr.io/0xc0-labs/payload
    newTag: v0.8.0
    digest: sha256:cc829a3c6b2843d8e9fc29392bc270a2830a9b99283128f901f6e87aeb9b4e43
configMapGenerator:
  - name: release
    literals:
      - APP_VERSION=v0.8.0
      - APP_ENVIRONMENT=prod
  - name: payload
    behavior: merge
    literals:
      - PAYLOAD_PUBLIC_SERVER_URL=https://payload.int.0xc0.cc
      - S3_ENDPOINT=https://ca1599ae7852d5b4718cba351adad927.r2.cloudflarestorage.com
      - S3_BUCKET=payload-media
      - MEDIA_PUBLIC_URL=https://media.0xc0.cc
  - name: payload-email
    behavior: merge
    literals:
      - EMAIL_FROM_NAME=0xc0
# The sites' Mautic (mautic.yaml), prod alone.
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: payload
      spec:
        template:
          spec:
            containers:
              - name: web
                volumeMounts:
                  - name: tenant-artistlab-mautic
                    mountPath: /var/run/secrets/tenants/artistlab/mautic
                    readOnly: true
            volumes:
              - name: tenant-artistlab-mautic
                secret:
                  secretName: payload-tenant-artistlab-mautic-vault
                  optional: true
# Each Vault path starts with the namespace (../base/vault-secrets.yaml).
replacements:
  - source:
      kind: Namespace
      fieldPath: metadata.name
    targets:
      - select:
          kind: VaultStaticSecret
          name: payload-database
        fieldPaths: [spec.path]
        options: {delimiter: /, index: 0}
      - select:
          kind: VaultStaticSecret
          name: payload-app
        fieldPaths: [spec.path]
        options: {delimiter: /, index: 0}
      - select:
          kind: VaultStaticSecret
          name: payload-media
        fieldPaths: [spec.path]
        options: {delimiter: /, index: 0}
      - select:
          kind: VaultStaticSecret
          name: payload-email
        fieldPaths: [spec.path]
        options: {delimiter: /, index: 0}
      - select:
          kind: VaultStaticSecret
          name: payload-preview
        fieldPaths: [spec.path]
        options: {delimiter: /, index: 0}
      - select:
          kind: VaultStaticSecret
          name: payload-resources-storage
        fieldPaths: [spec.path]
        options: {delimiter: /, index: 0}
      - select:
          kind: VaultStaticSecret
          labelSelector: app.kubernetes.io/component=tenant-secret
        fieldPaths: [spec.path]
        options: {delimiter: /, index: 0}

# Payload CMS in prod, one multi-tenant instance, the backend of several
# frontends (operator decision, 2026-10-09; workspace#64). ../README.md.
#
# Backups:
# - The uploaded media: the R2 bucket payload-media, which keeps no copies
#   of its own, and nothing copies outside Cloudflare: an accepted risk, in
#   the workspace's docs/accepted-risks.md (workspace#89).
# - Its database: platform/postgres's nightly dump, postgres-dumps/payload.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payload
resources:
  - namespace.yaml
  - ../base
  - httproute.yaml
# The pin: a release's PR changes only newTag, digest and APP_VERSION, which
# must equal newTag (pin / check). Until the first release, a placeholder.
images:
  - name: ghcr.io/0xc0-labs/payload
    newTag: v0.2.0
    digest: sha256:7aa66d5bf1cd845b7883ba7edd0227ff0b2d0d0e0b9f2119d784c28ac642b1e0
configMapGenerator:
  - name: release
    literals:
      - APP_VERSION=v0.2.0
      - APP_ENVIRONMENT=prod
  # The media in R2, served by Cloudflare at media.0xc0.cc: Payload serves
  # no file, and nothing of it is public (../README.md).
  - name: payload
    behavior: merge
    literals:
      - PAYLOAD_PUBLIC_SERVER_URL=https://payload.int.0xc0.cc
      - S3_ENDPOINT=https://ca1599ae7852d5b4718cba351adad927.r2.cloudflarestorage.com
      - S3_BUCKET=payload-media
      - MEDIA_PUBLIC_URL=https://media.0xc0.cc
  - name: payload-email
    behavior: merge
    literals:
      - EMAIL_FROM_NAME=0xc0
# The environment's own Vault paths start with its namespace
# (../base/vault-secrets.yaml).
replacements:
  - source:
      kind: Namespace
      fieldPath: metadata.name
    targets:
      - select:
          kind: VaultStaticSecret
          name: payload-database
        fieldPaths: [spec.path]
        options: {delimiter: /, index: 0}
      - select:
          kind: VaultStaticSecret
          name: payload-app
        fieldPaths: [spec.path]
        options: {delimiter: /, index: 0}
      - select:
          kind: VaultStaticSecret
          name: payload-media
        fieldPaths: [spec.path]
        options: {delimiter: /, index: 0}
      - select:
          kind: VaultStaticSecret
          name: payload-email
        fieldPaths: [spec.path]
        options: {delimiter: /, index: 0}

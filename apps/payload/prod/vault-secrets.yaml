# platform/postgres reads apps/payload/database too, to create the role.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: payload
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-secrets
  namespace: payload
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    # Shared by every application; admits this namespace by its label.
    role: apps
    serviceAccount: vault-secrets
    audiences: [vault]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: payload-database
  namespace: payload
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: payload/database
  refreshAfter: 1h
  destination:
    name: payload-database-vault
    create: true
    transformation:
      excludeRaw: true
  # Read at start: a new value restarts the pod.
  rolloutRestartTargets:
    - kind: Deployment
      name: payload
---
# PAYLOAD_SECRET signs the sessions and tokens: a new value restarts the pod
# and signs every user out.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: payload-app
  namespace: payload
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: payload/app
  refreshAfter: 1h
  destination:
    name: payload-app-vault
    create: true
    transformation:
      excludeRaw: true
  rolloutRestartTargets:
    - kind: Deployment
      name: payload
---
# OpenObserve's RUM client token, shared by every frontend.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: payload-rum
  namespace: payload
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: shared/openobserve-rum
  refreshAfter: 1h
  destination:
    name: payload-rum-vault
    create: true
    transformation:
      excludeRaw: true
  # Read at start: a new token restarts the pod.
  rolloutRestartTargets:
    - kind: Deployment
      name: payload

# The public name serves only the uploaded files, the media collection's file
# route: anything else there answers 404, since no rule matches it. The admin,
# the REST and GraphQL APIs and authentication stay on payload.int.0xc0.cc,
# over WARP (workspace docs/design.md, Application delivery). The route is
# Payload v3's for an upload collection with slug media: recheck it on a
# major upgrade.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: payload
  annotations:
    gateway.0xc0.cc/public: "true"
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure-0xc0-cc
  hostnames:
    - payload.0xc0.cc
  rules:
    # By path element: /api/media/file/<filename>, never /api/media/filex.
    - matches:
        - path: {type: PathPrefix, value: /api/media/file}
      backendRefs:
        - name: payload
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: payload-admin
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: internal
  hostnames:
    - payload.int.0xc0.cc
  rules:
    - backendRefs:
        - name: payload
          port: 80

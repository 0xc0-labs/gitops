# Nothing of Payload is public (../README.md).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: payload-admin
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: internal
  hostnames:
    - payload.int.0xc0.cc
  rules:
    - backendRefs:
        - name: payload
          port: 80

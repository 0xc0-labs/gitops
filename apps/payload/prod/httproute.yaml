# The admin, the REST and GraphQL APIs and authentication, over WARP alone.
# Nothing of Payload is public: the media is at media.0xc0.cc, served by
# Cloudflare from the bucket (../README.md).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: payload-admin
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: internal
  hostnames:
    - payload.int.0xc0.cc
  rules:
    - backendRefs:
        - name: payload
          port: 80

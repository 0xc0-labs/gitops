# The public name serves what the frontends read: the REST and GraphQL APIs
# and the media. The admin UI and the GraphQL playground are refused there
# (403, no hint of the internal name) and served only on
# payload.int.0xc0.cc. Checked against Payload v3's routes: recheck on a
# major upgrade.
#
# Gateway API cannot refuse a request: an allow list only loopback matches.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: refuse
  namespace: payload
spec:
  ipAllowList:
    sourceRange: [127.0.0.1/32]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: payload
  namespace: payload
  annotations:
    gateway.0xc0.cc/public: "true"
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure-0xc0-cc
  hostnames:
    - payload.0xc0.cc
  rules:
    - matches:
        - path: {type: PathPrefix, value: /admin}
        - path: {type: PathPrefix, value: /api/graphql-playground}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: refuse
      # Never reached: the middleware answers first.
      backendRefs:
        - name: payload
          port: 80
    - backendRefs:
        - name: payload
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: payload-admin
  namespace: payload
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: internal
  hostnames:
    - payload.int.0xc0.cc
  rules:
    - backendRefs:
        - name: payload
          port: 80

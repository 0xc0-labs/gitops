# A Sync hook, never PreSync (workspace docs/design/delivery.md, Application
# delivery): PreSync would also run before a secret this same sync brings,
# such as the GHCR pull secret.
apiVersion: batch/v1
kind: Job
metadata:
  name: payload-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 2
  # A pull or a migration that hangs fails the sync instead of holding it.
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payload-migrate
        app.kubernetes.io/part-of: payload
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull-vault
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        # The server's settings (deployment.yaml), less what only serving needs.
        - name: migrate
          image: ghcr.io/0xc0-labs/payload
          args: [migrate]
          envFrom:
            - configMapRef:
                name: payload
            - configMapRef:
                name: release
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payload-database-vault
                  key: password
            - name: DATABASE_URI
              value: postgres://$(NAMESPACE):$(DATABASE_PASSWORD)@postgres.postgres.svc.cluster.local:5432/$(NAMESPACE)
            - name: PAYLOAD_SECRET
              valueFrom:
                secretKeyRef:
                  name: payload-app-vault
                  key: payload-secret
            # Its config loads the media storage plugin, as the server's does.
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: payload-media-vault
                  key: access_key_id
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: payload-media-vault
                  key: secret_access_key
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.version=$(APP_VERSION),deployment.environment=$(APP_ENVIRONMENT)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi

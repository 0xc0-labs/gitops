# The image is each environment's pin, never a tag here (../README.md,
# Delivery).
apiVersion: v1
kind: Service
metadata:
  name: payload
spec:
  selector:
    app.kubernetes.io/name: payload
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payload
  annotations:
    # After the migrations (../README.md, Migrations).
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: payload
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payload
        app.kubernetes.io/part-of: payload
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull-vault
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/0xc0-labs/payload
          args: [serve]
          envFrom:
            - configMapRef:
                name: payload
            - configMapRef:
                name: payload-email
            - configMapRef:
                name: release
          env:
            # Next.js binds to $HOSTNAME, which Kubernetes sets to the pod's
            # name.
            - name: HOSTNAME
              value: 0.0.0.0
            # Expanded by Kubernetes: these stay above DATABASE_URI. The
            # role and the database are named after the namespace
            # (platform/postgres), and the password is hex, so it needs no
            # URL escaping (../README.md).
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payload-database-vault
                  key: password
            - name: DATABASE_URI
              value: postgres://$(NAMESPACE):$(DATABASE_PASSWORD)@postgres.postgres.svc.cluster.local:5432/$(NAMESPACE)
            - name: PAYLOAD_SECRET
              valueFrom:
                secretKeyRef:
                  name: payload-app-vault
                  key: payload-secret
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: payload-media-vault
                  key: access_key_id
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: payload-media-vault
                  key: secret_access_key
            # Resend takes its API key as the SMTP password.
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: payload-email-vault
                  key: api_key
            - name: TENANT_SECRETS_DIR
              value: /var/run/secrets/tenants
            # Optional: the bucket's credentials may reach Vault after this
            # manifest.
            - name: RESOURCES_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: payload-resources-storage-vault
                  key: bucket
                  optional: true
            - name: RESOURCES_S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: payload-resources-storage-vault
                  key: endpoint
                  optional: true
            - name: RESOURCES_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: payload-resources-storage-vault
                  key: access_key_id
                  optional: true
            - name: RESOURCES_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: payload-resources-storage-vault
                  key: secret_access_key
                  optional: true
            - name: PREVIEW_SECRET
              valueFrom:
                secretKeyRef:
                  name: payload-preview-vault
                  key: secret
                  optional: true
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.version=$(APP_VERSION),deployment.environment=$(APP_ENVIRONMENT)
            - name: OPENOBSERVE_RUM_CLIENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: payload-rum-vault
                  key: client_token
                  optional: true
          ports:
            - name: http
              containerPort: 3000
          # The port opens before Payload initialises, which it does on its
          # first request, and only then starts its jobs' crons (#162): the
          # readiness probe is that request. /api/users/me answers 200 with no
          # session. The first one took 8s on staging, hence the timeout.
          # Startup and liveness stay TCP, so a database blip never restarts
          # the pod.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/users/me
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
            - name: tenant-artistlab-email
              mountPath: /var/run/secrets/tenants/artistlab/email
              readOnly: true
            - name: tenant-artistlab-stripe
              mountPath: /var/run/secrets/tenants/artistlab/stripe
              readOnly: true
            - name: tenant-artistlab-discord
              mountPath: /var/run/secrets/tenants/artistlab/discord
              readOnly: true
            - name: tenant-artistlab-bunny
              mountPath: /var/run/secrets/tenants/artistlab/bunny
              readOnly: true
      # A tenant's secrets, one volume per secret, optional so that a rollout
      # never waits on a value Vault does not hold yet (../README.md, Tenants).
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 512Mi
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: tenant-artistlab-email
          secret:
            secretName: payload-tenant-artistlab-email-vault
            optional: true
        - name: tenant-artistlab-stripe
          secret:
            secretName: payload-tenant-artistlab-stripe-vault
            optional: true
        - name: tenant-artistlab-discord
          secret:
            secretName: payload-tenant-artistlab-discord-vault
            optional: true
        - name: tenant-artistlab-bunny
          secret:
            secretName: payload-tenant-artistlab-bunny-vault
            optional: true

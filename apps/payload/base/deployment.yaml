# The image is each environment's pin (its kustomization.yaml, images), never
# a tag here. No volume: the media is in each environment's R2 bucket
# (its kustomization.yaml, S3_BUCKET).
apiVersion: v1
kind: Service
metadata:
  name: payload
spec:
  selector:
    app.kubernetes.io/name: payload
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payload
  annotations:
    # After the migrations (migrate.yaml): a failed one leaves the running
    # version serving.
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  # No volume to hand over: the new pod serves before the old one stops.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: payload
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payload
        app.kubernetes.io/part-of: payload
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull-vault
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/0xc0-labs/payload
          args: [serve]
          # What the server and its Jobs share (kustomization.yaml), and the
          # version this environment runs (its pin).
          envFrom:
            - configMapRef:
                name: payload
            - configMapRef:
                name: release
          env:
            # Next.js binds to $HOSTNAME, which Kubernetes sets to the pod's
            # name.
            - name: HOSTNAME
              value: 0.0.0.0
            # Expanded by Kubernetes: these stay above DATABASE_URI. The
            # role and the database are named after the namespace
            # (platform/postgres), and the password is hex, so it needs no
            # URL escaping (README.md).
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payload-database-vault
                  key: password
            - name: DATABASE_URI
              value: postgres://$(NAMESPACE):$(DATABASE_PASSWORD)@postgres.postgres.svc.cluster.local:5432/$(NAMESPACE)
            - name: PAYLOAD_SECRET
              valueFrom:
                secretKeyRef:
                  name: payload-app-vault
                  key: payload-secret
            # The environment's R2 bucket (S3_BUCKET, S3_ENDPOINT), with a
            # token scoped to it.
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: payload-media-vault
                  key: access_key_id
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: payload-media-vault
                  key: secret_access_key
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.version=$(APP_VERSION),deployment.environment=$(APP_ENVIRONMENT)
            # Optional: without it RUM stays off.
            - name: OPENOBSERVE_RUM_CLIENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: payload-rum-vault
                  key: client_token
                  optional: true
          ports:
            - name: http
              containerPort: 3000
          # Payload has no health route of its own: a TCP check, with room for
          # the first start.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 512Mi
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi

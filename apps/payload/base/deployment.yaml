# The image is each environment's pin (its kustomization.yaml, images), never
# a tag here.
#
# Backup: PBS's nightly backup of the RKE2 VMs (each environment's
# kustomization.yaml, Backups).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: payload-media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: payload
spec:
  selector:
    app.kubernetes.io/name: payload
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payload
  annotations:
    # After the migrations (migrate.yaml): a failed one leaves the running
    # version serving.
    argocd.argoproj.io/sync-wave: "2"
spec:
  # One replica: the media volume is RWO.
  replicas: 1
  # RWO: the old pod releases the volume before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: payload
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payload
        app.kubernetes.io/part-of: payload
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull-vault
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/0xc0-labs/payload
          args: [serve]
          # What the server and its Jobs share (kustomization.yaml), and the
          # version this environment runs (its pin).
          envFrom:
            - configMapRef:
                name: payload
            - configMapRef:
                name: release
          env:
            # Next.js binds to $HOSTNAME, which Kubernetes sets to the pod's
            # name.
            - name: HOSTNAME
              value: 0.0.0.0
            # Expanded by Kubernetes: these stay above DATABASE_URI. The
            # role and the database are named after the namespace
            # (platform/postgres), and the password is hex, so it needs no
            # URL escaping (README.md).
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payload-database-vault
                  key: password
            - name: DATABASE_URI
              value: postgres://$(NAMESPACE):$(DATABASE_PASSWORD)@postgres.postgres.svc.cluster.local:5432/$(NAMESPACE)
            - name: PAYLOAD_SECRET
              valueFrom:
                secretKeyRef:
                  name: payload-app-vault
                  key: payload-secret
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.version=$(APP_VERSION),deployment.environment=$(APP_ENVIRONMENT)
            # Optional: without it RUM stays off.
            - name: OPENOBSERVE_RUM_CLIENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: payload-rum-vault
                  key: client_token
                  optional: true
          ports:
            - name: http
              containerPort: 3000
          # Payload has no health route of its own: a TCP check, with room for
          # the first start.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: media
              mountPath: /app/media
            - name: cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: payload-media
        - name: cache
          emptyDir:
            sizeLimit: 512Mi
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi

# Each environment reads its own secrets at apps/<its namespace>/: the first
# segment of the paths below is set to the namespace by each environment's
# kustomization.yaml (replacements), and Vault's apps policy grants nothing
# else. platform/postgres reads apps/<namespace>/database too, to create the
# role.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-secrets
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    # Shared by every application; admits this namespace by its label.
    role: apps
    serviceAccount: vault-secrets
    audiences: [vault]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: payload-database
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: NAMESPACE/database
  refreshAfter: 1h
  destination:
    name: payload-database-vault
    create: true
    transformation:
      excludeRaw: true
  rolloutRestartTargets:
    - kind: Deployment
      name: payload
---
# A new PAYLOAD_SECRET signs every user out.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: payload-app
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: NAMESPACE/app
  refreshAfter: 1h
  destination:
    name: payload-app-vault
    create: true
    transformation:
      excludeRaw: true
  rolloutRestartTargets:
    - kind: Deployment
      name: payload
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: payload-media
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: NAMESPACE/media
  refreshAfter: 1h
  destination:
    name: payload-media-vault
    create: true
    transformation:
      excludeRaw: true
  rolloutRestartTargets:
    - kind: Deployment
      name: payload
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: payload-email
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: NAMESPACE/email
  refreshAfter: 1h
  destination:
    name: payload-email-vault
    create: true
    transformation:
      excludeRaw: true
  rolloutRestartTargets:
    - kind: Deployment
      name: payload
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: payload-rum
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: shared/openobserve-rum
  refreshAfter: 1h
  destination:
    name: payload-rum-vault
    create: true
    transformation:
      excludeRaw: true
  rolloutRestartTargets:
    - kind: Deployment
      name: payload
---
# The kubelet reads it at each pull, so a new token needs no restart.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ghcr-pull
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: shared/ghcr-pull
  refreshAfter: 1h
  destination:
    name: ghcr-pull-vault
    create: true
    type: kubernetes.io/dockerconfigjson
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        .dockerconfigjson:
          text: '{{ dict "auths" (dict "ghcr.io" (dict "auth" (printf "%s:%s" (get .Secrets "username") (get .Secrets "password") | b64enc))) | toJson }}'

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - network-policy.yaml
  - vault-secrets.yaml
  - migrate.yaml
  - deployment.yaml
# Each environment merges its URL, its R2 bucket and its trusted internal
# hosts in.
configMapGenerator:
  - name: payload
    literals:
      - NEXT_TELEMETRY_DISABLED=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://openobserve-collector-gateway-collector.openobserve-collector.svc.cluster.local:4318
      - OTEL_SERVICE_NAME=payload
      - TRUSTED_INTERNAL_HOSTS=
  # The server's alone (../README.md, Email). Each environment merges its
  # EMAIL_FROM_NAME in.
  - name: payload-email
    literals:
      - SMTP_HOST=smtp.resend.com
      - SMTP_PORT=587
      - SMTP_USER=resend
      - EMAIL_FROM_ADDRESS=noreply@0xc0.cc

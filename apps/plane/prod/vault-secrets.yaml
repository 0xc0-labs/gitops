# Every Secret the chart would create comes from here instead, through its
# external_secrets values (values.yaml). A VaultStaticSecret reads one path, so
# each Secret holds what one path can build; AMQP_URL, which needs RabbitMQ's
# password beside a database's, is composed in kustomization.yaml.
#
# The passwords go inside URLs and are generated as hex, so nothing is escaped
# (../README.md, Before the first sync).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: plane
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-secrets
  namespace: plane
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    # Shared by every application; admits this namespace by its label.
    role: apps
    serviceAccount: vault-secrets
    audiences: [vault]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: plane-database
  namespace: plane
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: plane/database
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: Deployment
      name: plane-api-wl
    - kind: Deployment
      name: plane-worker-wl
    - kind: Deployment
      name: plane-beat-worker-wl
  destination:
    name: plane-database-vault
    create: true
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        DATABASE_URL:
          text: 'postgresql://plane:{{ get .Secrets "password" | trimAll "\r\n" }}@postgres.postgres.svc.cluster.local:5432/plane'
        REDIS_URL:
          text: redis://plane-redis.plane.svc.cluster.local:6379/
---
# SECRET_KEY encrypts Plane's instance configuration: never rotated.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: plane-app-keys
  namespace: plane
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: plane/app
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: Deployment
      name: plane-api-wl
    - kind: Deployment
      name: plane-worker-wl
    - kind: Deployment
      name: plane-beat-worker-wl
  destination:
    name: plane-app-keys-vault
    create: true
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        SECRET_KEY:
          text: '{{ get .Secrets "secret_key" | trimAll "\r\n" }}'
        LIVE_SERVER_SECRET_KEY:
          text: '{{ get .Secrets "live_server_secret_key" | trimAll "\r\n" }}'
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: plane-live
  namespace: plane
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: plane/app
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: Deployment
      name: plane-live-wl
  destination:
    name: plane-live-vault
    create: true
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        LIVE_SERVER_SECRET_KEY:
          text: '{{ get .Secrets "live_server_secret_key" | trimAll "\r\n" }}'
        REDIS_URL:
          text: redis://plane-redis.plane.svc.cluster.local:6379/
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: plane-rabbitmq
  namespace: plane
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: plane/rabbitmq
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: StatefulSet
      name: plane-rabbitmq-wl
    - kind: Deployment
      name: plane-api-wl
    - kind: Deployment
      name: plane-worker-wl
    - kind: Deployment
      name: plane-beat-worker-wl
  destination:
    name: plane-rabbitmq-vault
    create: true
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        RABBITMQ_DEFAULT_USER:
          text: plane
        RABBITMQ_DEFAULT_PASS:
          text: '{{ get .Secrets "password" | trimAll "\r\n" }}'
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: plane-storage
  namespace: plane
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: plane/storage
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: StatefulSet
      name: plane-minio-wl
    - kind: Deployment
      name: plane-api-wl
    - kind: Deployment
      name: plane-worker-wl
    - kind: Deployment
      name: plane-beat-worker-wl
  destination:
    name: plane-storage-vault
    create: true
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        USE_MINIO:
          text: "1"
        MINIO_ROOT_USER:
          text: plane
        MINIO_ROOT_PASSWORD:
          text: '{{ get .Secrets "root_password" | trimAll "\r\n" }}'
        AWS_ACCESS_KEY_ID:
          text: plane
        AWS_SECRET_ACCESS_KEY:
          text: '{{ get .Secrets "root_password" | trimAll "\r\n" }}'
        AWS_S3_BUCKET_NAME:
          text: uploads
        AWS_S3_ENDPOINT_URL:
          text: http://plane-minio:9000
        FILE_SIZE_LIMIT:
          text: "5242880"

# Plane, the tracker of Matchmark: WARP only, never public (../README.md).
#
# Backups, every volume (Longhorn):
# - data of plane-minio-wl, 5Gi (the attachments): PBS's nightly backup of the
#   RKE2 VMs (03:00).
# - data of plane-rabbitmq-wl, 1Gi (queued jobs): the same.
# - data of plane-redis-wl, 1Gi (cache and sessions): the same.
# - The database is the shared PostgreSQL's: platform/postgres' nightly dump
#   (01:30) and the same PBS backup.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: plane
helmCharts:
  - name: plane-ce
    repo: https://helm.plane.so/
    version: 1.9.1
    releaseName: plane
    namespace: plane
    kubeVersion: "1.36.4"
    valuesFile: values.yaml
resources:
  - namespace.yaml
  - network-policy.yaml
  - vault-secrets.yaml
  - httproute.yaml
configMapGenerator:
  - name: plane-web-caddy
    files:
      - Caddyfile=caddy/web.Caddyfile
  - name: plane-admin-caddy
    files:
      - Caddyfile=caddy/admin.Caddyfile
images:
  - name: artifacts.plane.so/makeplane/plane-frontend
    newTag: v1.5.0
    digest: sha256:d6e8afb888431c8d2bc77d4ff7244a5cd28f8c674aa46f114315b8300014b8ce
  - name: artifacts.plane.so/makeplane/plane-space
    newTag: v1.5.0
    digest: sha256:e7fd925a61796c4e37c2c42b39bf0c660dd0d4ca220705df70bee9f5e28e9273
  - name: artifacts.plane.so/makeplane/plane-admin
    newTag: v1.5.0
    digest: sha256:3857dc1000f08446375c277674ccda119ab092562f454e935bdba3aca5c5f4ee
  - name: artifacts.plane.so/makeplane/plane-live
    newTag: v1.5.0
    digest: sha256:f285e6979ed213b39207fcdf62abee9b5bde5dcc3731b4346d71e3a4f595810f
  - name: artifacts.plane.so/makeplane/plane-backend
    newTag: v1.5.0
    digest: sha256:386f659e0e43c9cb29050fb71439f04f40c5c7e1d93cca2c810bc7e2b1134daf
  - name: valkey/valkey
    newTag: 7.2.11-alpine
    digest: sha256:10328d00120dc14fbc87b2ed61b7677ddbb0d011e705361b4788329a0ec69a93
  - name: rabbitmq
    newTag: 3.13.6-management-alpine
    digest: sha256:611107e29cce05c2acd968325d5dcbde7e2fee404970f1ead75fdb22be2821b3
  - name: docker.io/pgsty/silo
    newTag: RELEASE.2026-09-16T00-00-00Z
    digest: sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
  - name: docker.io/pgsty/mc
    newTag: RELEASE.2026-09-16T00-00-00Z
    digest: sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
  - name: busybox
    newTag: 1.37.0
    digest: sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
patches:
  # The chart names its Jobs by the release's revision, which Argo CD always
  # renders as 1: a new version changes a Job's immutable pod template, and the
  # sync would fail. As hooks, deleted before each creation, they run again
  # after every sync (the migrations and the bucket are idempotent).
  - target: {kind: Job}
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/hook: Sync
          argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  # AMQP_URL carries RabbitMQ's password, which Vault holds at a path of its
  # own: an env entry beats envFrom, and expands the password beside it.
  - target: {kind: Deployment, name: "plane-(api|worker|beat-worker)-wl"}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: RABBITMQ_DEFAULT_PASS
            valueFrom:
              secretKeyRef:
                name: plane-rabbitmq-vault
                key: RABBITMQ_DEFAULT_PASS
          - name: AMQP_URL
            value: amqp://plane:$(RABBITMQ_DEFAULT_PASS)@plane-rabbitmq.plane.svc.cluster.local/
  - target: {kind: Job, name: plane-api-migrate-1}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: RABBITMQ_DEFAULT_PASS
            valueFrom:
              secretKeyRef:
                name: plane-rabbitmq-vault
                key: RABBITMQ_DEFAULT_PASS
          - name: AMQP_URL
            value: amqp://plane:$(RABBITMQ_DEFAULT_PASS)@plane-rabbitmq.plane.svc.cluster.local/
  # The frontends' Caddyfile, without the rate limit (README, Hardening).
  - target: {kind: Deployment, name: plane-web-wl}
    patch: |-
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: caddyfile
            configMap:
              name: plane-web-caddy
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: caddyfile
            mountPath: /etc/caddy/Caddyfile
            subPath: Caddyfile
            readOnly: true
  - target: {kind: Deployment, name: plane-admin-wl}
    patch: |-
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: caddyfile
            configMap:
              name: plane-admin-caddy
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: caddyfile
            mountPath: /etc/caddy/Caddyfile
            subPath: Caddyfile
            readOnly: true
  # The chart allows http:// too.
  - target: {kind: ConfigMap, name: plane-app-vars}
    patch: |-
      - op: replace
        path: /data/CORS_ALLOWED_ORIGINS
        value: https://plane.int.0xc0.cc

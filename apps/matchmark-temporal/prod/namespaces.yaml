# The Temporal namespaces and their retention (README.md, Namespaces): the one
# list, `NAMESPACES`. A sync hook in PostSync, so it runs once the frontend is
# available, and deleted before each creation, so every sync brings each
# namespace to the retention written here. Safe to run twice at once: a
# namespace that exists is updated to the same value. The chart's own
# namespace Job is off (`server.config.namespaces.create: false`): it never
# updates one.
#
# No credential: the frontend has no authorizer (values.yaml). The pod carries
# the labels of the chart's Jobs, so `temporal-to-frontend` lets it reach
# `temporal-frontend:7233` and `temporal-frontend-from-clients` lets it in.
apiVersion: batch/v1
kind: Job
metadata:
  name: temporal-namespaces
  namespace: matchmark
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
        app.kubernetes.io/instance: temporal
        app.kubernetes.io/component: database
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: namespaces
          image: temporalio/admin-tools
          command:
            - /bin/sh
            - -ec
            - |
              for entry in $NAMESPACES; do
                name=${entry%%=*}
                retention=${entry#*=}
                if temporal operator namespace describe -n "$name" >/dev/null 2>&1; then
                  temporal operator namespace update -n "$name" --retention "$retention"
                else
                  temporal operator namespace create -n "$name" --retention "$retention"
                fi
              done
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal-frontend:7233
            # `<name>=<retention>`, space-separated. Retention counts from the
            # moment a workflow closes; 1d is Temporal's minimum.
            - name: NAMESPACES
              value: "factory=30d platform=1d"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi

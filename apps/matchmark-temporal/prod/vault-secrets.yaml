# The databases' passwords, written by the operator (0xc0-labs/gitops#450) and
# set on the roles by platform/postgres. `vault-secrets` is the matchmark
# Application's. A change restarts the four server Deployments, which read the
# password at start.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: temporal-database
  namespace: matchmark
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: matchmark/temporal-database
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: Deployment
      name: temporal-frontend
    - kind: Deployment
      name: temporal-history
    - kind: Deployment
      name: temporal-matching
    - kind: Deployment
      name: temporal-worker
  destination:
    name: temporal-database-vault
    create: true
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        password:
          text: '{{ get .Secrets "password" | trimAll "\r\n" }}'
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: temporal-visibility-database
  namespace: matchmark
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: matchmark/temporal-visibility-database
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: Deployment
      name: temporal-frontend
    - kind: Deployment
      name: temporal-history
    - kind: Deployment
      name: temporal-matching
    - kind: Deployment
      name: temporal-worker
  destination:
    name: temporal-visibility-database-vault
    create: true
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        password:
          text: '{{ get .Secrets "password" | trimAll "\r\n" }}'

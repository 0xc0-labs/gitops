# Matchmark's Temporal, in the namespace `matchmark` and an Application of its
# own (../README.md, Temporal). The namespace, `default-deny`, `vault-secrets`
# and the VaultAuth belong to the `matchmark` Application.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: matchmark
helmCharts:
  - name: temporal
    repo: https://go.temporal.io/helm-charts
    version: 1.8.0
    releaseName: temporal
    namespace: matchmark
    kubeVersion: "1.36.4"
    valuesFile: values.yaml
    # The test Pod is a hook; `skipHooks` would drop the two Jobs too.
    skipTests: true
resources:
  - vault-secrets.yaml
  - ui-route.yaml
  - network-policy.yaml
  - namespaces.yaml
images:
  - name: temporalio/server
    newTag: 1.32.2
    digest: sha256:7bf69188a6232fea14869b9cef3d94aa82a1601d99517f7e86c71f22da4e0670
  - name: temporalio/admin-tools
    newTag: 1.32.2
    digest: sha256:4a95866efba29d7e17ab012df5232795e8b0ad0f7d5f9d1ec4df321f7792a754
  - name: temporalio/ui
    newTag: 2.56.4
    digest: sha256:6cd528352cbb5cc298c8f308010f6e34dcd6fe3512c7ccab1d165133c9fc3de9
patches:
  # The chart has no value for it, and nothing here calls the API server.
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/automountServiceAccountToken
        value: false
  - target:
      kind: Job
    patch: |-
      - op: add
        path: /spec/template/spec/automountServiceAccountToken
        value: false
  # The chart's schema Job is no hook and a Job's pod template is immutable,
  # but it needs no `Replace=true` (which fails every sync, #679): its template
  # keeps the pool's placement (next patch), and a new chart version names the
  # Job anew (`temporal-schema-<version>-<rev>`), so Argo CD creates it instead
  # of updating the old one.
  # A Job's pod template is immutable and the chart names this Job, so dropping
  # the placement would fail the sync; the admission policy accepts a pod that
  # already selects `apps`.
  - target: {kind: Job, name: temporal-schema-1-8-0-1}
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          0xc0.cc/pool: apps
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: 0xc0.cc/pool
            operator: Equal
            value: apps
            effect: NoSchedule

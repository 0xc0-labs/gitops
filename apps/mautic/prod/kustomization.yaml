# Mautic (operator decision, 2026-10-02). Installed once by hand: README.md.
#
# Backups:
# - mautic-data (Longhorn, 5Gi): local.php, logs and uploaded media, covered
#   by PBS's nightly backup of the RKE2 VMs (03:00).
# - Its database: platform/mariadb's nightly dump, mariadb-dumps/mautic.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mautic
resources:
  - namespace.yaml
  - network-policy.yaml
  - vault-secrets.yaml
  - deployment.yaml
  - httproute.yaml
# Hashed, so a change rolls the pod. Old ones stay behind (no pruning).
configMapGenerator:
  - name: mautic-supervisord
    files:
      - supervisord.conf
# No pruning: it holds data.
commonAnnotations:
  argocd.argoproj.io/sync-options: Prune=false

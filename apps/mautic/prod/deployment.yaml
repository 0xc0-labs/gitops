# The image's three roles (web, cron, worker) as containers of one pod, so
# one RWO volume serves them all: no RWX, no NFS share-manager.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mautic-env
  namespace: mautic
data:
  MAUTIC_DB_HOST: mariadb.mariadb.svc.cluster.local
  MAUTIC_DB_PORT: "3306"
  MAUTIC_DB_DATABASE: mautic
  MAUTIC_DB_USER: mautic
  MAUTIC_MESSENGER_DSN_EMAIL: doctrine://default
  MAUTIC_MESSENGER_DSN_HIT: doctrine://default
  # Traefik, from the pods' range: trust its X-Forwarded-*.
  MAUTIC_TRUSTED_PROXIES: '["10.42.0.0/16"]'
  PHP_INI_VALUE_DATE_TIMEZONE: Europe/Madrid
  DOCKER_MAUTIC_WORKERS_CONSUME_EMAIL: "1"
  DOCKER_MAUTIC_WORKERS_CONSUME_HIT: "1"
  DOCKER_MAUTIC_WORKERS_CONSUME_FAILED: "1"
---
# Backup: PBS's nightly backup of the RKE2 VMs (kustomization.yaml, Backups).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mautic-data
  namespace: mautic
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mautic
  namespace: mautic
spec:
  selector:
    app.kubernetes.io/name: mautic
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mautic
  namespace: mautic
spec:
  replicas: 1
  # RWO: the old pod releases the volume before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mautic
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mautic
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # The 7.2 image lacks GrapesJS's compiled assets
      # (mautic/docker-mautic#479): take them from the release ZIP. An image
      # bump bumps version and sha256 here too; remove this once it ships them.
      initContainers:
        - name: grapesjs-assets
          image: docker.io/mautic/mautic:7.2.1-apache@sha256:ff584fd13c8db06b4a7dd640e837dbbde69bd8c40da62140ff6c3c2dd0402abc
          command:
            - bash
            - -euo
            - pipefail
            - -c
            - |
              curl -fsSL -o /download/mautic.zip \
                "https://github.com/mautic/mautic/releases/download/${MAUTIC_VERSION}/${MAUTIC_VERSION}.zip"
              echo "${MAUTIC_ZIP_SHA256}  /download/mautic.zip" | sha256sum -c -
              unzip -q -o -j /download/mautic.zip \
                'plugins/GrapesJsBuilderBundle/Assets/library/js/dist/*' -d /dist
              rm /download/mautic.zip
              ls -l /dist
          env:
            - name: MAUTIC_VERSION
              value: "7.2.1"
            - name: MAUTIC_ZIP_SHA256
              value: 5c86cf1fe8b4f9818232ce8bb755760f502d47846706e9164d144865d031ecbd
          securityContext:
            capabilities:
              drop: [NET_RAW]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: download
              mountPath: /download
            - name: grapesjs-assets
              mountPath: /dist
      containers:
        - name: web
          image: docker.io/mautic/mautic:7.2.1-apache@sha256:ff584fd13c8db06b4a7dd640e837dbbde69bd8c40da62140ff6c3c2dd0402abc
          env:
            - name: DOCKER_MAUTIC_ROLE
              value: mautic_web
            - &password
              name: MAUTIC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mautic-database-vault
                  key: password
            # Wins over local.php's DSN. Optional: without it, nothing is sent.
            - &mailer
              name: MAUTIC_MAILER_DSN
              valueFrom:
                secretKeyRef:
                  name: mautic-mailer-vault
                  key: dsn
                  optional: true
          envFrom: &env
            - configMapRef:
                name: mautic-env
          ports:
            - name: http
              containerPort: 80
          # Migrations run before apache listens: minutes after an upgrade.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 6
          securityContext: &security
            capabilities:
              drop: [NET_RAW]
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/www/html/config
              subPath: config
            - name: data
              mountPath: /var/www/html/var/logs
              subPath: logs
            - name: data
              mountPath: /var/www/html/docroot/media/files
              subPath: media/files
            - name: data
              mountPath: /var/www/html/docroot/media/images
              subPath: media/images
            - name: cache-web
              mountPath: /var/www/html/var/cache
            - name: grapesjs-assets
              mountPath: /var/www/html/docroot/plugins/GrapesJsBuilderBundle/Assets/library/js/dist
              readOnly: true
        - name: cron
          image: docker.io/mautic/mautic:7.2.1-apache@sha256:ff584fd13c8db06b4a7dd640e837dbbde69bd8c40da62140ff6c3c2dd0402abc
          env:
            - name: DOCKER_MAUTIC_ROLE
              value: mautic_cron
            - *password
            - *mailer
          envFrom: *env
          securityContext: *security
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/www/html/config
              subPath: config
            - name: data
              mountPath: /var/www/html/var/logs
              subPath: logs
            - name: data
              mountPath: /var/www/html/docroot/media/files
              subPath: media/files
            - name: data
              mountPath: /var/www/html/docroot/media/images
              subPath: media/images
            - name: cache-cron
              mountPath: /var/www/html/var/cache
        - name: worker
          image: docker.io/mautic/mautic:7.2.1-apache@sha256:ff584fd13c8db06b4a7dd640e837dbbde69bd8c40da62140ff6c3c2dd0402abc
          env:
            - name: DOCKER_MAUTIC_ROLE
              value: mautic_worker
            - *password
            - *mailer
          envFrom: *env
          securityContext: *security
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/www/html/config
              subPath: config
            - name: data
              mountPath: /var/www/html/var/logs
              subPath: logs
            - name: data
              mountPath: /var/www/html/docroot/media/files
              subPath: media/files
            - name: data
              mountPath: /var/www/html/docroot/media/images
              subPath: media/images
            - name: cache-worker
              mountPath: /var/www/html/var/cache
            - name: supervisord
              mountPath: /etc/supervisor/conf.d/supervisord.conf
              subPath: supervisord.conf
              readOnly: true
        # Mautic's own log goes to dated files under var/logs, which the
        # collector never sees: copy them to stdout. Files found at start are
        # followed from their end, so a restart repeats nothing.
        - name: logs
          image: docker.io/mautic/mautic:7.2.1-apache@sha256:ff584fd13c8db06b4a7dd640e837dbbde69bd8c40da62140ff6c3c2dd0402abc
          command:
            - sh
            - -c
            - |
              cd /logs
              seen=" "
              for f in *.php; do
                [ -e "$f" ] || continue
                tail -n 0 -F "$f" &
                seen="$seen$f "
              done
              while :; do
                sleep 30
                for f in *.php; do
                  [ -e "$f" ] || continue
                  case "$seen" in *" $f "*) continue ;; esac
                  tail -n +1 -F "$f" &
                  seen="$seen$f "
                done
              done
          securityContext:
            runAsUser: 33
            runAsGroup: 33
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /logs
              subPath: logs
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mautic-data
        - name: supervisord
          configMap:
            name: mautic-supervisord
        # Symfony's cache, outside the image: the image's own is stale and
        # cache:clear cannot rename it on overlayfs. One per container, so no
        # two warm it at once.
        - name: cache-web
          emptyDir:
            sizeLimit: 512Mi
        - name: cache-cron
          emptyDir:
            sizeLimit: 512Mi
        - name: cache-worker
          emptyDir:
            sizeLimit: 512Mi
        - name: download
          emptyDir:
            sizeLimit: 256Mi
        - name: grapesjs-assets
          emptyDir:
            sizeLimit: 32Mi

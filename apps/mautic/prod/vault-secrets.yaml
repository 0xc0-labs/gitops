# platform/mariadb reads apps/mautic/database too, to create the user.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: mautic
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-secrets
  namespace: mautic
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    # Shared by every application; admits this namespace by its label.
    role: apps
    serviceAccount: vault-secrets
    audiences: [vault]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mautic-database
  namespace: mautic
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: mautic/database
  refreshAfter: 1h
  destination:
    name: mautic-database-vault
    create: true
    transformation:
      excludeRaw: true
---
# A Symfony mailer DSN. A new value restarts the pod.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mautic-mailer
  namespace: mautic
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: mautic/mailer
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: Deployment
      name: mautic
  destination:
    name: mautic-mailer-vault
    create: true
    transformation:
      excludeRaw: true

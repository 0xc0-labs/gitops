; The image's supervisord.conf (docker-mautic, common/templates), with limits
; on every consumer: each exits after five minutes, or at 256M, and
; supervisord starts it again. A restarted consumer reads the configuration
; anew, so a change made in Mautic reaches the queues within five minutes,
; and no PHP process grows for ever (gitops#81).
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
user=root

[program:messenger-consume-email]
command=php /var/www/html/bin/console messenger:consume email --time-limit=300 --memory-limit=256M
user=www-data
numprocs=%(ENV_DOCKER_MAUTIC_WORKERS_CONSUME_EMAIL)s
startsecs=0
autostart=true
autorestart=true
startretries=10
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:messenger-consume-hit]
command=php /var/www/html/bin/console messenger:consume hit --time-limit=300 --memory-limit=256M
user=www-data
numprocs=%(ENV_DOCKER_MAUTIC_WORKERS_CONSUME_HIT)s
startsecs=0
autostart=true
autorestart=true
startretries=10
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:messenger-consume-failed]
command=php /var/www/html/bin/console messenger:consume failed --time-limit=300 --memory-limit=256M
user=www-data
numprocs=%(ENV_DOCKER_MAUTIC_WORKERS_CONSUME_FAILED)s
startsecs=0
autostart=true
autorestart=true
startretries=10
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

<VirtualHost *:8080>
	DocumentRoot ${APACHE_DOCUMENT_ROOT}
	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
	# Mautic forces https on every route when site_url is https; TLS ends at
	# Traefik and the in-cluster callers (provision, Payload over the Service)
	# speak plain HTTP, so they would get a 301.
	SetEnv HTTPS on
</VirtualHost>

# The image's three roles (web, cron, worker) as containers of one pod, so
# one RWO volume serves them all: no RWX, no NFS share-manager.
# Backup: PBS's nightly backup of the RKE2 VMs (kustomization.yaml, Backups).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mautic-data
  # No pruning: it holds data.
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mautic
spec:
  selector:
    app.kubernetes.io/name: mautic
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mautic
spec:
  replicas: 1
  # RWO: the old pod releases the volume before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mautic
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mautic
    spec:
      automountServiceAccountToken: false
      # 33 is www-data, the image's own unprivileged user. fsGroup makes the
      # volume writable to it, which the image's entrypoint (root, chown)
      # no longer does: the containers below skip that entrypoint.
      securityContext:
        runAsUser: 33
        runAsGroup: 33
        runAsNonRoot: true
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # The 7.2 image lacks GrapesJS's compiled assets
      # (mautic/docker-mautic#479): take them from the release ZIP. An image
      # bump bumps version and sha256 here too; remove this once it ships them.
      initContainers:
        - name: grapesjs-assets
          image: docker.io/mautic/mautic:7.2.1-apache@sha256:ff584fd13c8db06b4a7dd640e837dbbde69bd8c40da62140ff6c3c2dd0402abc
          command:
            - bash
            - -euo
            - pipefail
            - -c
            - |
              curl -fsSL -o /download/mautic.zip \
                "https://github.com/mautic/mautic/releases/download/${MAUTIC_VERSION}/${MAUTIC_VERSION}.zip"
              echo "${MAUTIC_ZIP_SHA256}  /download/mautic.zip" | sha256sum -c -
              unzip -q -o -j /download/mautic.zip \
                'plugins/GrapesJsBuilderBundle/Assets/library/js/dist/*' -d /dist
              rm /download/mautic.zip
              ls -l /dist
          env:
            - name: MAUTIC_VERSION
              value: "7.2.1"
            - name: MAUTIC_ZIP_SHA256
              value: 5c86cf1fe8b4f9818232ce8bb755760f502d47846706e9164d144865d031ecbd
          securityContext: &security
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: download
              mountPath: /download
            - name: grapesjs-assets
              mountPath: /dist
      containers:
        - name: web
          image: docker.io/mautic/mautic:7.2.1-apache@sha256:ff584fd13c8db06b4a7dd640e837dbbde69bd8c40da62140ff6c3c2dd0402abc
          # The image's entrypoint chowns volumes and runs the migrations
          # through su, both root's: the same steps, without it. It installs
          # too, which the entrypoint does only for its own environment.
          command:
            - bash
            - -euo
            - pipefail
            - -c
            - |
              console=/var/www/html/bin/console
              config=/var/www/html/config
              installed() {
                php -r "include('$config/local.php'); exit(!empty(\$parameters['db_driver']) && !empty(\$parameters['site_url']) ? 0 : 1);"
              }
              [ -f "$config/local.php" ] || cp /templates/local.php "$config/local.php"
              if ! installed; then
                # Without --db_backup_tables the installer drops what it finds.
                php "$console" mautic:install "$SITE_URL" --force \
                  --db_driver pdo_mysql --db_host "$MAUTIC_DB_HOST" --db_port "$MAUTIC_DB_PORT" \
                  --db_name "$MAUTIC_DB_DATABASE" --db_user "$MAUTIC_DB_USER" \
                  --db_password "$MAUTIC_DB_PASSWORD" --db_backup_tables true \
                  --admin_email "$ADMIN_EMAIL" --admin_password "$ADMIN_PASSWORD"
                # README.md, Install, once per site (gitops#293).
                php "$console" doctrine:migrations:up-to-date -n ||
                  php "$console" doctrine:migrations:version --add --all -n
              fi
              # Not environment variables in Mautic 7.2.1: they live in local.php.
              php -r "
                \$file = '$config/local.php';
                include \$file;
                \$want = ['api_enabled' => true, 'api_enable_basic_auth' => true];
                if (array_intersect_assoc(\$want, \$parameters) == \$want) exit;
                file_put_contents(\$file, '<?php' . PHP_EOL . '\$parameters = ' . var_export(array_merge(\$parameters, \$want), true) . ';' . PHP_EOL);
              "
              if installed; then
                php "$console" doctrine:migrations:migrate -n
              fi
              exec apache2-foreground
          env:
            - name: DOCKER_MAUTIC_ROLE
              value: mautic_web
            - &password
              name: MAUTIC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mautic-database-vault
                  key: password
            # Wins over local.php (README.md, The app secret).
            - &secret
              name: MAUTIC_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mautic-app-vault
                  key: secret_key
            - &resend
              name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mautic-email-vault
                  key: api_key
            # Resend's SMTP, user resend and the key as password. Wins over
            # local.php's DSN (README.md, The sending provider).
            - &mailer
              name: MAUTIC_MAILER_DSN
              value: smtp://resend:$(RESEND_API_KEY)@smtp.resend.com:587
            # The first admin installs, and logs in to the API for the
            # provision container.
            - &adminEmail
              name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: mautic-admin-vault
                  key: email
            - &adminPassword
              name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mautic-admin-vault
                  key: password
          envFrom: &env
            - configMapRef:
                name: mautic-env
          ports:
            - name: http
              containerPort: 8080
          # Migrations run before apache listens (README.md, Upgrades).
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 6
          securityContext: *security
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/www/html/config
              subPath: config
            - name: data
              mountPath: /var/www/html/var/logs
              subPath: logs
            - name: data
              mountPath: /var/www/html/docroot/media/files
              subPath: media/files
            - name: data
              mountPath: /var/www/html/docroot/media/images
              subPath: media/images
            - name: cache-web
              mountPath: /var/www/html/var/cache
            - name: var-tmp
              mountPath: /var/www/html/var/tmp
            - name: tmp
              mountPath: /tmp
            - name: apache-run
              mountPath: /var/run/apache2
            - name: apache-run
              mountPath: /var/lock/apache2
            - name: apache
              mountPath: /etc/apache2/ports.conf
              subPath: ports.conf
              readOnly: true
            - name: apache
              mountPath: /etc/apache2/sites-available/000-default.conf
              subPath: 000-default.conf
              readOnly: true
            - name: grapesjs-assets
              mountPath: /var/www/html/docroot/plugins/GrapesJsBuilderBundle/Assets/library/js/dist
              readOnly: true
        - name: cron
          image: docker.io/mautic/mautic:7.2.1-apache@sha256:ff584fd13c8db06b4a7dd640e837dbbde69bd8c40da62140ff6c3c2dd0402abc
          # The image's cron daemon is root's: the same three jobs of its
          # crontab, on a loop. One at a time, so a slow one skips a slot
          # instead of overlapping.
          command:
            - bash
            - -euo
            - pipefail
            - -c
            - |
              until php -r "include('/var/www/html/config/local.php'); exit(!empty(\$parameters['db_driver']) && !empty(\$parameters['site_url']) ? 0 : 1);"; do
                sleep 5
              done
              while :; do
                case $(( 10#$(date +%M) % 15 )) in
                  0) job=mautic:segments:update ;;
                  5) job=mautic:campaigns:update ;;
                  10) job=mautic:campaigns:trigger ;;
                  *) job= ;;
                esac
                [ -z "$job" ] || php /var/www/html/bin/console "$job" || true
                sleep $(( 60 - 10#$(date +%S) ))
              done
          env:
            - name: DOCKER_MAUTIC_ROLE
              value: mautic_cron
            - *password
            - *secret
            - *resend
            - *mailer
          envFrom: *env
          securityContext: *security
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/www/html/config
              subPath: config
            - name: data
              mountPath: /var/www/html/var/logs
              subPath: logs
            - name: data
              mountPath: /var/www/html/docroot/media/files
              subPath: media/files
            - name: data
              mountPath: /var/www/html/docroot/media/images
              subPath: media/images
            - name: cache-cron
              mountPath: /var/www/html/var/cache
            - name: var-tmp
              mountPath: /var/www/html/var/tmp
            - name: tmp
              mountPath: /tmp
        - name: worker
          image: docker.io/mautic/mautic:7.2.1-apache@sha256:ff584fd13c8db06b4a7dd640e837dbbde69bd8c40da62140ff6c3c2dd0402abc
          command:
            - bash
            - -euo
            - pipefail
            - -c
            - |
              until php -r "include('/var/www/html/config/local.php'); exit(!empty(\$parameters['db_driver']) && !empty(\$parameters['site_url']) ? 0 : 1);"; do
                sleep 5
              done
              exec supervisord -c /etc/supervisor/conf.d/supervisord.conf
          env:
            - name: DOCKER_MAUTIC_ROLE
              value: mautic_worker
            - *password
            - *secret
            - *resend
            - *mailer
          envFrom: *env
          securityContext: *security
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/www/html/config
              subPath: config
            - name: data
              mountPath: /var/www/html/var/logs
              subPath: logs
            - name: data
              mountPath: /var/www/html/docroot/media/files
              subPath: media/files
            - name: data
              mountPath: /var/www/html/docroot/media/images
              subPath: media/images
            - name: cache-worker
              mountPath: /var/www/html/var/cache
            - name: var-tmp
              mountPath: /var/www/html/var/tmp
            - name: tmp
              mountPath: /tmp
            - name: supervisord
              mountPath: /etc/supervisor/conf.d/supervisord.conf
              subPath: supervisord.conf
              readOnly: true
        # Payload's API user and its role, through Mautic's own API once web
        # answers; what exists is left as it is. It idles after a failure
        # too, logged in one line: a container that exits is restarted, and a
        # crash loop takes the pod out of the Service.
        - name: provision
          image: docker.io/mautic/mautic:7.2.1-apache@sha256:ff584fd13c8db06b4a7dd640e837dbbde69bd8c40da62140ff6c3c2dd0402abc
          command: [bash, -euo, pipefail, -c, 'php /scripts/provision.php || true; exec sleep infinity']
          env:
            - *adminEmail
            - *adminPassword
            - name: PAYLOAD_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mautic-payload-vault
                  key: password
          envFrom: *env
          securityContext: *security
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: provision
              mountPath: /scripts
              readOnly: true
        # Mautic's own log goes to dated files under var/logs, which the
        # collector never sees: copy them to stdout. Files found at start are
        # followed from their end, so a restart repeats nothing.
        - name: logs
          image: docker.io/mautic/mautic:7.2.1-apache@sha256:ff584fd13c8db06b4a7dd640e837dbbde69bd8c40da62140ff6c3c2dd0402abc
          command:
            - sh
            - -c
            - |
              cd /logs
              seen=" "
              for f in *.php; do
                [ -e "$f" ] || continue
                tail -n 0 -F "$f" &
                seen="$seen$f "
              done
              while :; do
                sleep 30
                for f in *.php; do
                  [ -e "$f" ] || continue
                  case "$seen" in *" $f "*) continue ;; esac
                  tail -n +1 -F "$f" &
                  seen="$seen$f "
                done
              done
          securityContext: *security
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /logs
              subPath: logs
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mautic-data
        - name: supervisord
          configMap:
            name: mautic-supervisord
        - name: provision
          configMap:
            name: mautic-provision
        # Symfony's cache, outside the image: the image's own is stale and
        # cache:clear cannot rename it on overlayfs. One per container, so no
        # two warm it at once.
        - name: apache
          configMap:
            name: mautic-apache
        - name: apache-run
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: var-tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: cache-web
          emptyDir:
            sizeLimit: 512Mi
        - name: cache-cron
          emptyDir:
            sizeLimit: 512Mi
        - name: cache-worker
          emptyDir:
            sizeLimit: 512Mi
        - name: download
          emptyDir:
            sizeLimit: 256Mi
        - name: grapesjs-assets
          emptyDir:
            sizeLimit: 32Mi

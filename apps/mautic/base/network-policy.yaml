# Egress stays open: MariaDB, the sending provider and MaxMind's lookups.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: http-from-traefik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mautic
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
---
# Payload creates the leads through the API (apps/payload/prod/mautic.yaml).
# Prod's alone: staging has no Mautic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-from-payload
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mautic
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: payload
          podSelector:
            matchLabels:
              app.kubernetes.io/name: payload
      ports:
        - protocol: TCP
          port: 8080

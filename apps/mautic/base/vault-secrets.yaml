# Each path starts with the site's namespace: the overlay sets it
# (../README.md). platform/mariadb reads <namespace>/database too, to create
# the user.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-secrets
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    # Shared by every application; admits this namespace by its label.
    role: apps
    serviceAccount: vault-secrets
    audiences: [vault]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mautic-database
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: NAMESPACE/database
  refreshAfter: 1h
  destination:
    name: mautic-database-vault
    create: true
    transformation:
      excludeRaw: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mautic-app
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: NAMESPACE/app
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: Deployment
      name: mautic
  destination:
    name: mautic-app-vault
    create: true
    transformation:
      excludeRaw: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mautic-email
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: NAMESPACE/email
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: Deployment
      name: mautic
  destination:
    name: mautic-email-vault
    create: true
    transformation:
      excludeRaw: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mautic-admin
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: NAMESPACE/admin
  refreshAfter: 1h
  destination:
    name: mautic-admin-vault
    create: true
    transformation:
      excludeRaw: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mautic-payload
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: NAMESPACE/payload
  refreshAfter: 1h
  destination:
    name: mautic-payload-vault
    create: true
    transformation:
      excludeRaw: true

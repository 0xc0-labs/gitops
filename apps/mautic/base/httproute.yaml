# The public name serves what contacts reach. Landing pages take any path, so
# it cannot be an allowlist: the admin's paths are refused there (403) and
# served only on the internal name. /index.php reaches every route, so it is
# refused whole. Checked against 7.2.1's routes: recheck on a major upgrade.
# The hostnames and the listener are the overlay's.
#
# Gateway API cannot refuse a request: an allow list only loopback matches.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: refuse
spec:
  ipAllowList:
    sourceRange: [127.0.0.1/32]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mautic
  annotations:
    gateway.0xc0.cc/public: "true"
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure-example
  hostnames:
    - mautic.example.com
  rules:
    - matches:
        - path: {type: PathPrefix, value: /passwordreset}
        - path: {type: PathPrefix, value: /passwordresetconfirm}
        - path: {type: PathPrefix, value: /invite}
      # Emailed admin links carry the public name: send them to the internal
      # one.
      filters:
        - type: RequestRedirect
          requestRedirect:
            # With the scheme set, the redirect uses 443, not the listener's
            # 8443.
            scheme: https
            hostname: mautic.int.example.com
            statusCode: 302
    - matches:
        - path: {type: PathPrefix, value: /s}
        - path: {type: PathPrefix, value: /elfinder}
        - path: {type: PathPrefix, value: /efconnect}
        - path: {type: PathPrefix, value: /installer}
        - path: {type: PathPrefix, value: /api}
        - path: {type: PathPrefix, value: /oauth}
        - path: {type: PathPrefix, value: /saml}
        - path: {type: PathPrefix, value: /plugins}
        - path: {type: PathPrefix, value: /integration}
        - path: {type: PathPrefix, value: /index.php}
        # Mautic sends the root to its dashboard.
        - path: {type: Exact, value: /}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: refuse
      # Never reached: the middleware answers first.
      backendRefs:
        - name: mautic
          port: 80
    - backendRefs:
        - name: mautic
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mautic-admin
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: internal
  hostnames:
    - mautic.int.example.com
  rules:
    - backendRefs:
        - name: mautic
          port: 80

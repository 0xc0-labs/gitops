# The sandboxes' only way to the internet (README.md, The proxy).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-proxy
  namespace: matchmark-sandboxes
  labels:
    app.kubernetes.io/name: egress-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: egress-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: egress-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 13
        runAsGroup: 13
        fsGroup: 13
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: squid
          # ubuntu/squid, from Docker Hub as mariadb is. Its entrypoint
          # changes owners as root: the pod runs Squid itself.
          image: docker.io/ubuntu/squid:6.6-24.04_edge@sha256:d9c34c5ab74c6dd41cf1070d9b4221aac072e67e983527ca2d41512958f77506
          command: ["squid", "-N", "-f", "/etc/squid/squid.conf"]
          ports:
            - name: proxy
              containerPort: 3128
          readinessProbe:
            tcpSocket:
              port: proxy
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/squid
              readOnly: true
            - name: log
              mountPath: /var/log/squid
            - name: run
              mountPath: /var/run/squid
            - name: tmp
              mountPath: /tmp
        # The logs to stdout, where the cluster's collector takes every pod's
        # log to Loki, and what bounds them: the readiness probe opens
        # and closes a connection, which Squid logs as a request that never
        # was, so those lines are dropped here; and each file is emptied once
        # it passes 10 MiB (Squid appends, and `tail -F` follows the
        # truncation), so the volume never fills the pod up to eviction.
        - name: access-log
          image: docker.io/ubuntu/squid:6.6-24.04_edge@sha256:d9c34c5ab74c6dd41cf1070d9b4221aac072e67e983527ca2d41512958f77506
          command:
            - sh
            - -c
            - |
              cd /var/log/squid
              touch access.log cache.log
              while sleep 60; do
                for f in access.log cache.log; do
                  [ "$(wc -c < "$f")" -gt 10485760 ] && : > "$f"
                done
              done &
              tail -q -n +1 -F access.log cache.log 2>/dev/null |
                grep --line-buffered -v 'host=error:transaction-end-before-headers'
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: log
              mountPath: /var/log/squid
      volumes:
        # Generated with a hash in its name: a change to the list or the
        # configuration rolls the pod.
        - name: config
          configMap:
            name: proxy-config
        # Backup: none, the log is read from stdout. The limit bounds it.
        - name: log
          emptyDir:
            sizeLimit: 256Mi
        - name: run
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: egress-proxy
  namespace: matchmark-sandboxes
spec:
  selector:
    app.kubernetes.io/name: egress-proxy
  ports:
    - name: proxy
      port: 3128
      targetPort: proxy

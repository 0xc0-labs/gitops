# What the factory worker's sandbox adapter calls, and nothing else
# (README.md, The worker's Role): it creates a `Sandbox`, reads it and the pod
# it made for the pod's address, and deletes it. No `list` and no `watch`: it
# polls the one it made by name. No Secret: the sandbox's token is derived, not
# stored.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factory-worker
  namespace: matchmark-sandboxes
rules:
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["create", "get", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factory-worker
  namespace: matchmark-sandboxes
subjects:
  - kind: ServiceAccount
    name: factory-worker
    namespace: matchmark
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: factory-worker

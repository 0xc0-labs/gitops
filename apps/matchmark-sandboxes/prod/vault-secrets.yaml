# The operator's Claude subscription token and the image pull Secret
# (README.md, The subscription token, The image pull Secret).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: matchmark-sandboxes
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-secrets
  namespace: matchmark-sandboxes
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    # Its own role, bound to this namespace and read-only on one path: the
    # namespace is not labelled `vault.0xc0.cc/apps`, so it is not in `apps`.
    role: matchmark-sandboxes
    serviceAccount: vault-secrets
    audiences: [vault]
---
# No rolloutRestartTargets: a sandbox lives for one attempt and reads the
# token when it starts.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: claude-subscription
  namespace: matchmark-sandboxes
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: matchmark/claude-subscription
  refreshAfter: 1h
  destination:
    name: claude-subscription-vault
    create: true
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        oauth_token:
          text: '{{ get .Secrets "oauth_token" | trimAll "\r\n" }}'
---
# The runner's image is private: the kubelet reads this at each pull, so a new
# token needs no restart (README.md, The image pull Secret).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ghcr-pull
  namespace: matchmark-sandboxes
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: shared/ghcr-pull
  refreshAfter: 1h
  destination:
    name: ghcr-pull-vault
    create: true
    type: kubernetes.io/dockerconfigjson
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        .dockerconfigjson:
          text: '{{ dict "auths" (dict "ghcr.io" (dict "auth" (printf "%s:%s" (get .Secrets "username") (get .Secrets "password") | b64enc))) | toJson }}'

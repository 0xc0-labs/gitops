# The operator's Claude subscription token, the namespace's only Secret
# (README.md, The subscription token).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: matchmark-sandboxes
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-secrets
  namespace: matchmark-sandboxes
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    # Its own role, bound to this namespace and read-only on one path: the
    # namespace is not labelled `vault.0xc0.cc/apps`, so it is not in `apps`.
    role: matchmark-sandboxes
    serviceAccount: vault-secrets
    audiences: [vault]
---
# No rolloutRestartTargets: a sandbox lives for one attempt and reads the
# token when it starts.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: claude-subscription
  namespace: matchmark-sandboxes
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: matchmark/claude-subscription
  refreshAfter: 1h
  destination:
    name: claude-subscription-vault
    create: true
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        oauth_token:
          text: '{{ get .Secrets "oauth_token" | trimAll "\r\n" }}'

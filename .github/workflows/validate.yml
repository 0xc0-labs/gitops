# Renders every component under platform/ and apps/ as Argo CD does, and validates it and
# the bootstrap's manifests, on every PR that touches them. The steps live in
# the reusable workflow in 0xc0-labs/.github.
name: validate

on:
  pull_request:
    branches: [main]
    paths: ['platform/**', 'apps/**', 'bootstrap/**', 'mise.toml', '.github/workflows/validate.yml']

permissions:
  contents: read

jobs:
  validate:
    uses: 0xc0-labs/.github/.github/workflows/kustomize-validate.yml@main
    with:
      components: platform/* apps/*/prod apps/*/staging

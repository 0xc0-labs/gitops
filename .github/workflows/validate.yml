# No paths filter: both checks are required, and a required check must
# report on every PR.
name: validate

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  validate:
    uses: 0xc0-labs/.github/.github/workflows/kustomize-validate.yml@main
    with:
      components: platform/* apps/*/prod apps/*/staging

  pin:
    uses: 0xc0-labs/.github/.github/workflows/pin-check.yml@main

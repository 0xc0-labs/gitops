# The collectors' own metrics, for Prometheus's alert on exporters that fail
# to send (platform/kube-prometheus-stack, alerting-rules.yaml).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: collectors
  namespace: openobserve-collector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: opentelemetry-collector
  podMetricsEndpoints:
    - portNumber: 8888
      path: /metrics
      interval: 60s

# Backups: no volumes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openobserve-collector
helmCharts:
  - name: openobserve-collector
    repo: https://charts.openobserve.ai
    version: 0.5.0
    releaseName: openobserve-collector
    namespace: openobserve-collector
    kubeVersion: "1.36.4"
    includeCRDs: true
    valuesFile: values.yaml
resources:
  - namespace.yaml
  - network-policy.yaml
  - vault-secrets.yaml
patches:
  # The chart takes the Authorization header as a literal only.
  - target:
      kind: OpenTelemetryCollector
    patch: |-
      - op: add
        path: /spec/env/-
        value:
          name: O2_AUTH
          valueFrom:
            secretKeyRef:
              name: openobserve-auth-vault
              key: O2_AUTH
  # etcd's metrics, which the chart does not scrape (infrastructure's
  # rke2_server role exposes them on 2381).
  - target:
      kind: OpenTelemetryCollector
      name: openobserve-collector-gateway
    patch: |-
      - op: add
        path: /spec/config/receivers/prometheus/config/scrape_configs/-
        value:
          job_name: etcd
          scrape_interval: 60s
          scrape_timeout: 10s
          kubernetes_sd_configs:
            - role: pod
              namespaces:
                names: [kube-system]
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_label_component]
              action: keep
              regex: etcd
            - source_labels: [__address__]
              action: replace
              regex: "([^:]+)(?::\\d+)?"
              replacement: "$1:2381"
              target_label: __address__
            - source_labels: [__meta_kubernetes_pod_node_name]
              target_label: node
  # The applications' OTLP metrics to Prometheus as well (kube-prometheus-stack,
  # workspace#290). A pipeline of its own with the OTLP receiver alone: what
  # the collector scrapes stays out, since Prometheus scrapes the same
  # ServiceMonitors itself and forwarding them would duplicate every series.
  - target:
      kind: OpenTelemetryCollector
      name: openobserve-collector-gateway
    patch: |-
      - op: add
        path: /spec/config/exporters/otlphttp~1prometheus
        value:
          endpoint: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/otlp
          compression: gzip
          timeout: 10s
          retry_on_failure:
            enabled: true
            initial_interval: 5s
            max_interval: 30s
            max_elapsed_time: 120s
          sending_queue:
            enabled: true
            queue_size: 1000
      - op: add
        path: /spec/config/service/pipelines/metrics~1prometheus
        value:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, attributes, k8sattributes, batch]
          exporters: [otlphttp/prometheus]
  # Every container's logs to Loki as well (workspace#290, phase 2), from the
  # agent that reads them: the gateway has no pipeline of them. OpenObserve's
  # exporter stays. The queue is small and never blocks, so a slow Loki drops
  # its own copy and holds back neither OpenObserve nor the agent's memory.
  - target:
      kind: OpenTelemetryCollector
      name: openobserve-collector-agent
    patch: |-
      - op: add
        path: /spec/config/exporters/otlphttp~1loki
        value:
          endpoint: http://loki.loki.svc.cluster.local:3100/otlp
          encoding: proto
          compression: gzip
          timeout: 10s
          retry_on_failure:
            enabled: true
            initial_interval: 5s
            max_interval: 30s
            max_elapsed_time: 120s
          sending_queue:
            enabled: true
            queue_size: 100
            block_on_overflow: false
      - op: add
        path: /spec/config/service/pipelines/logs/exporters/-
        value: otlphttp/loki
  # The traces to Tempo as well; OpenObserve's exporter and the service graph
  # stay.
  - target:
      kind: OpenTelemetryCollector
      name: openobserve-collector-gateway
    patch: |-
      - op: add
        path: /spec/config/exporters/otlp~1tempo
        value:
          endpoint: tempo.tempo.svc.cluster.local:4317
          tls:
            insecure: true
          compression: gzip
          timeout: 10s
          retry_on_failure:
            enabled: true
            initial_interval: 5s
            max_interval: 30s
            max_elapsed_time: 120s
          sending_queue:
            enabled: true
            queue_size: 1000
            block_on_overflow: false
      - op: add
        path: /spec/config/service/pipelines/traces/exporters/-
        value: otlp/tempo
  # The usage record: the log records of a model call, from the OTLP receiver,
  # to Matchmark's API (apps/matchmark/README.md, The usage record). No other
  # pipeline takes logs from that receiver, so a slow or failing API holds back
  # nothing that goes to OpenObserve: its exporter has a queue and retries of
  # its own, bounded, and a full queue drops these records alone.
  - target:
      kind: OpenTelemetryCollector
      name: openobserve-collector-gateway
    patch: |-
      - op: add
        path: /spec/config/exporters/otlphttp~1matchmark_api
        value:
          endpoint: http://api.matchmark.svc.cluster.local/otlp
          encoding: proto
          compression: gzip
          timeout: 10s
          retry_on_failure:
            enabled: true
            initial_interval: 5s
            max_interval: 30s
            max_elapsed_time: 120s
          sending_queue:
            enabled: true
            queue_size: 1000
            block_on_overflow: false
      - op: add
        path: /spec/config/processors/filter~1matchmark_usage
        value:
          error_mode: ignore
          logs:
            log_record:
              - attributes["gen_ai.usage.input_tokens"] == nil and attributes["gen_ai.usage.output_tokens"] == nil
      - op: add
        path: /spec/config/service/pipelines/logs~1matchmark_usage
        value:
          receivers: [otlp]
          processors: [memory_limiter, filter/matchmark_usage, batch]
          exporters: [otlphttp/matchmark_api]
  # Once a minute: the chart's jobs and the allocator's default are 30 s.
  - target:
      kind: OpenTelemetryCollector
      name: openobserve-collector-gateway
    patch: |-
      - op: replace
        path: /spec/config/receivers/prometheus/config/scrape_configs/0/scrape_interval
        value: 60s
      - op: replace
        path: /spec/config/receivers/prometheus/config/scrape_configs/1/scrape_interval
        value: 60s
      - op: replace
        path: /spec/config/receivers/prometheus/config/scrape_configs/2/scrape_interval
        value: 60s
      - op: replace
        path: /spec/config/receivers/prometheus/config/scrape_configs/3/scrape_interval
        value: 60s
      - op: replace
        path: /spec/config/receivers/prometheus/config/scrape_configs/4/scrape_interval
        value: 60s
      - op: replace
        path: /spec/config/receivers/prometheus/config/scrape_configs/5/scrape_interval
        value: 60s
      - op: replace
        path: /spec/config/receivers/prometheus/config/scrape_configs/6/scrape_interval
        value: 60s
      - op: add
        path: /spec/targetAllocator/prometheusCR/scrapeInterval
        value: 60s

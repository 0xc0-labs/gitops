# Egress stays open: they scrape every namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: openobserve-collector
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otlp-from-senders
  namespace: openobserve-collector
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: opentelemetry-collector
      app.kubernetes.io/instance: openobserve-collector.openobserve-collector-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: offby1-cc
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: payload
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: payload-staging
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: artistlabco-com
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: artistlabco-com-staging
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: target-allocator-from-gateway
  namespace: openobserve-collector
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: opentelemetry-targetallocator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: opentelemetry-collector
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: self-metrics-from-gateway
  namespace: openobserve-collector
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: opentelemetry-collector
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: opentelemetry-collector
      ports:
        - protocol: TCP
          port: 8888

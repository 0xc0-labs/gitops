# The superuser's password: Vault's value without a trailing newline, so the
# server and the Jobs see the same bytes however it was written. PostgreSQL
# reads POSTGRES_PASSWORD at its first start only; the superuser container
# (statefulset.yaml) sets the role to this Secret at every start and whenever
# it changes, so rotating it is a write to Vault.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: postgres
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-secrets
  namespace: postgres
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: postgres
    serviceAccount: vault-secrets
    audiences: [vault]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: postgres-superuser
  namespace: postgres
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: platform
  path: postgres/superuser
  refreshAfter: 1h
  destination:
    name: postgres-superuser-vault
    create: true
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        password:
          text: '{{ get .Secrets "password" | trimAll "\r\n" }}'

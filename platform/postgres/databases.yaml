# Idempotent, after every sync: creates what is missing and sets each role's
# password to Vault's, so a rotation is a write to Vault and a sync.
#
# Adding an application: its VaultStaticSecret here, a volume and mount below,
# and its namespace in network-policy.yaml.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: payload-database
  namespace: postgres
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: payload/database
  refreshAfter: 1h
  destination:
    name: payload-database-vault
    create: true
    transformation:
      excludeRaw: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: payload-staging-database
  namespace: postgres
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: payload-staging/database
  refreshAfter: 1h
  destination:
    name: payload-staging-database-vault
    create: true
    transformation:
      excludeRaw: true
---
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-databases
  namespace: postgres
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-databases
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: databases
          image: docker.io/library/postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
          command:
            - bash
            - -euo
            - pipefail
            - -c
            - |
              until pg_isready -h postgres -U postgres -q; do
                echo "waiting for postgres"; sleep 5
              done
              for dir in /databases/*/; do
                export name=$(basename "$dir") dir
                # psql quotes the variables itself (:'x' as a literal, :"x" as
                # an identifier). The password is read by psql from the file:
                # it never reaches a command line.
                psql -h postgres -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
              \set name `printf '%s' "$name"`
              \set pw `cat "$dir/password"`
              SELECT format('CREATE ROLE %I LOGIN', :'name')
                WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'name') \gexec
              ALTER ROLE :"name" PASSWORD :'pw';
              SELECT format('CREATE DATABASE %I OWNER %I ENCODING ''UTF8''', :'name', :'name')
                WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'name') \gexec
              SQL
                echo "database $name ready"
              done
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-superuser-vault
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: payload
              mountPath: /databases/payload
              readOnly: true
            - name: payload-staging
              mountPath: /databases/payload-staging
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: payload
          secret:
            secretName: payload-database-vault
            items:
              - key: password
                path: password
        - name: payload-staging
          secret:
            secretName: payload-staging-database-vault
            items:
              - key: password
                path: password
        - name: tmp
          emptyDir: {}

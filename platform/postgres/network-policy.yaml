# Accepts connections and initiates none (CLAUDE.md, Hard rules).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: postgres
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-server
  namespace: postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres-dumps
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres-databases
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: artistlabco-com
          podSelector:
            matchLabels:
              app.kubernetes.io/name: artistlabco-com-cms
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: artistlabco-com-staging
          podSelector:
            matchLabels:
              app.kubernetes.io/name: artistlabco-com-cms
        # Only the pods that connect (apps/plane/prod/network-policy.yaml).
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: plane
          podSelector:
            matchExpressions:
              - key: app.name
                operator: In
                values:
                  - plane-plane-api
                  - plane-plane-api-migrate
                  - plane-plane-worker
                  - plane-plane-beat-worker
        # Only the pods that connect (apps/matchmark/prod/network-policy-usage.yaml).
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: matchmark
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - matchmark-api
                  - matchmark-api-migrate
      ports:
        - protocol: TCP
          port: 5432
  egress: []

# A new major version is not a bump of the digest: the datadir of one major
# does not start under another. It goes through a dump and a restore.
# The image keeps its datadir under /var/lib/postgresql/<major>/docker, so the
# volume mounts one level up (18+ layout).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: postgres
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: docker.io/library/postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
          # Sized for a small shared server: a few applications, little
          # traffic.
          args:
            - -c
            - shared_buffers=128MB
            - -c
            - max_connections=100
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-superuser-vault
                  key: password
          ports:
            - name: postgres
              containerPort: 5432
          startupProbe:
            exec:
              command: [pg_isready, -U, postgres]
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [pg_isready, -U, postgres]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, postgres]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
        # The superuser's password follows the Secret: the server takes
        # POSTGRES_PASSWORD at initdb alone, so a new value in Vault would
        # leave the Jobs that log in with it (databases.yaml, dumps.yaml)
        # locked out. This sets the role to the mounted Secret, over the local
        # socket, once the server is up and whenever the file changes (Vault
        # Secrets Operator's refresh, then the kubelet's, within the hour).
        - name: superuser
          image: docker.io/library/postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
          command:
            - bash
            - -euo
            - pipefail
            - -c
            - |
              applied=
              while true; do
                sum=$(sha256sum < /superuser/password)
                if [ "$sum" != "$applied" ] && pg_isready -q -U postgres; then
                  # The value never reaches a command line: psql reads it
                  # from the file and quotes it itself.
                  if psql -U postgres -d postgres -v ON_ERROR_STOP=1 -q <<'SQL'
              \set pw `cat /superuser/password`
              ALTER ROLE postgres PASSWORD :'pw';
              SQL
                  then
                    applied=$sum
                    echo "superuser password set from the Secret"
                  fi
                fi
                sleep 10
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: run
              mountPath: /var/run/postgresql
            - name: superuser
              mountPath: /superuser
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: superuser
          secret:
            secretName: postgres-superuser-vault
            items:
              - key: password
                path: password
  # Backup: PBS's nightly backup of the RKE2 VMs, plus dumps.yaml.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            storage: 10Gi

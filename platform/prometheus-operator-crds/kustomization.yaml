# CRDs only, for the collectors' target allocator and for kube-prometheus-stack,
# which leaves its own off. Keep it on the operator's version there.
#
# Backups: no volumes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: prometheus-operator-crds
    repo: https://prometheus-community.github.io/helm-charts
    version: 33.0.2
    releaseName: prometheus-operator-crds
    kubeVersion: "1.36.4"
    includeCRDs: true
# No pruning: every ServiceMonitor hangs off these CRDs.
commonAnnotations:
  argocd.argoproj.io/sync-options: Prune=false

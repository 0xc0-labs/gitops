# Egress stays open: the Kubernetes API, for service registration and
# TokenReview.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: vault
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-server
  namespace: vault
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault
      component: server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault-secrets-operator
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vault-secrets-operator
              control-plane: controller-manager
        # OpenObserve's collector: metrics share the API's port.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openobserve-collector
          podSelector:
            matchLabels:
              app.kubernetes.io/component: opentelemetry-collector
        # The sites' CMS writes its integrations' keys with its own identity
        # (apps/artistlabco-com/README.md, The CMS).
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - artistlabco-com
                  - artistlabco-com-staging
          podSelector:
            matchLabels:
              app.kubernetes.io/name: artistlabco-com-cms
        # Matchmark's API signs its agent tokens with its Transit key.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: matchmark
          podSelector:
            matchLabels:
              app.kubernetes.io/name: matchmark-api
        # The runners' registrar signs the runner App's JWT in Transit
        # (platform/actions-runners).
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: actions-runner-controller
          podSelector:
            matchLabels:
              app.kubernetes.io/name: actions-runner-registrar
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
              component: server
      ports:
        - protocol: TCP
          port: 8200
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
              component: server
      ports:
        - protocol: TCP
          port: 8201

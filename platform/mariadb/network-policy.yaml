# Accepts connections and initiates none (CLAUDE.md, Hard rules).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: mariadb
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mariadb-server
  namespace: mariadb
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mariadb
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mariadb-dumps
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mariadb-databases
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - mautic-artistlabco-com
          podSelector:
            matchLabels:
              app.kubernetes.io/name: mautic
      ports:
        - protocol: TCP
          port: 3306
  egress: []

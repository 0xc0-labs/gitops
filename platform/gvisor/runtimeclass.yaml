# runsc exists on the `sandbox` pool alone (vm-rke2-06): the class places every
# pod that asks for it, so a workload sets only `runtimeClassName`
# (workspace#288).
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
scheduling:
  nodeSelector:
    0xc0.cc/pool: sandbox
  tolerations:
    - key: 0xc0.cc/pool
      operator: Equal
      value: sandbox
      effect: NoSchedule

apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudflare-exporter
  namespace: cloudflare-exporter
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-exporter
  namespace: cloudflare-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflare-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflare-exporter
    spec:
      serviceAccountName: cloudflare-exporter
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          # 0.2.3, the image `latest` points at.
          image: ghcr.io/lablabs/cloudflare_exporter:0.2.3@sha256:6bf84a81725c6d75b14fb584135ccfe5f8aff89d23c36b04511d22b1c6cc10cb
          env:
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-vault
                  key: api_token
            # In 0.2.3 every per-zone query returns early when it is true,
            # and filters out Free zones when it is false (README.md).
            - name: FREE_TIER
              value: "true"
            - name: LOG_LEVEL
              value: debug
            - name: LISTEN
              value: ":8080"
          ports:
            - name: metrics
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi

# Cloudflare's edge analytics as Prometheus metrics (README.md).
#
# Backups: no volumes. It keeps nothing.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloudflare-exporter
resources:
  - namespace.yaml
  - network-policy.yaml
  - vault-secrets.yaml
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml

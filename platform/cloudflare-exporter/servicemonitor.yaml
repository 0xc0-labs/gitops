apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cloudflare-exporter
  namespace: cloudflare-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflare-exporter
  endpoints:
    - port: metrics
      # Every GraphQL query counts against Cloudflare's 300 per 5 minutes.
      interval: 60s
      scrapeTimeout: 30s

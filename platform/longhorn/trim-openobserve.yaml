# OpenObserve's volume trim, as a job that waits for the answer (README, A trim
# that outlasts the recurring job). Longhorn's own recurring job gives up after
# a fixed minute; this one waits as long as the node's fstrim may run (one
# hour).
#
# The Longhorn API takes no credential, so the pod gets none: no service
# account token, and a NetworkPolicy that opens the manager's API to it alone.
# The volume is named here: a replaced volume gets a new name, and a 404 from
# this job says so.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: filesystem-trim-openobserve
  namespace: longhorn-system
spec:
  schedule: "47 * * * *"
  # Never two trims of one filesystem at once: that is what answered 500.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A retry would start a second fstrim beside the first, which may still
      # be running: the next hour's run is the retry.
      backoffLimit: 0
      activeDeadlineSeconds: 3900
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: filesystem-trim-openobserve
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: trim
              image: docker.io/curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
              args:
                - --silent
                - --show-error
                - --fail-with-body
                - --max-time
                - "3700"
                - --output
                - /dev/null
                - --write-out
                - "trimFilesystem answered HTTP %{http_code} after %{time_total}s\\n"
                - --request
                - POST
                - http://longhorn-backend:9500/v1/volumes/pvc-96a82cef-3be6-4ad2-afba-b8172b092c73?action=trimFilesystem
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trim-openobserve-to-manager
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: filesystem-trim-openobserve
      ports:
        - protocol: TCP
          port: 9500

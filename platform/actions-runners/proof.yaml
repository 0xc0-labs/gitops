# The proof that a runner pod reaches the internet and nothing of the
# cluster (README.md, The proof): a plain Job, not a sync hook, kept after it
# ends and not run again by a sync. It carries the runner's label, so the
# runner's network policy is the one under test, and the runner's pod shape:
# gVisor, no token, restricted.
apiVersion: batch/v1
kind: Job
metadata:
  name: runner-network-proof-2
  namespace: actions-runners
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: actions-runner
    spec:
      restartPolicy: Never
      runtimeClassName: gvisor
      priorityClassName: actions-runners
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proof
          image: docker.io/library/python:3.13.15-alpine@sha256:79e7a9b9ff1cbceff819f856fb374477792a5967759d94df266de7b7b4120e6f
          command: [python3, -u, /opt/proof/proof.py]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: proof
              mountPath: /opt/proof
              readOnly: true
      volumes:
        - name: proof
          configMap:
            name: proof-script

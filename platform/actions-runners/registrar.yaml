# The registrar (registrar.py, README.md): keeps RUNNERS just-in-time runner
# pods in `actions-runners`. Its identity is its own: Vault's role
# `actions-runners` admits this namespace and this service account alone.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: registrar
  namespace: actions-runner-controller
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: registrar
  namespace: actions-runners
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: registrar
  namespace: actions-runners
subjects:
  - kind: ServiceAccount
    name: registrar
    namespace: actions-runner-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: registrar
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registrar
  namespace: actions-runner-controller
  labels:
    app.kubernetes.io/name: actions-runner-registrar
spec:
  replicas: 1
  # Two registrars at once would each keep RUNNERS pods.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: actions-runner-registrar
  template:
    metadata:
      labels:
        app.kubernetes.io/name: actions-runner-registrar
    spec:
      serviceAccountName: registrar
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registrar
          image: docker.io/library/python:3.13.15-alpine@sha256:79e7a9b9ff1cbceff819f856fb374477792a5967759d94df266de7b7b4120e6f
          command: [python3, -u, /opt/registrar/registrar.py]
          env:
            # Zero: the pilot is being retired (gitops#590). A runner pod
            # already up is replaced by nothing once idle for
            # IDLE_TIMEOUT_SECONDS or finished, and its registration goes.
            - name: RUNNERS
              value: "0"
            - name: RUNNER_NAMESPACE
              value: actions-runners
            # GitHub's runner image, the release the CI VMs run (infrastructure,
            # `github_runner_version`). It never updates itself: bump it with
            # that, within 30 days of each release.
            - name: RUNNER_IMAGE
              value: ghcr.io/actions/actions-runner:2.338.0@sha256:4ffadc0002b2581327e06101fc8c06cd189232baf79fe561fac9caeb76f5e807
            - name: RUNNER_GROUP
              value: "0xc0-cluster"
            - name: RUNNER_LABEL
              value: "0xc0-cluster"
            - name: RUNNER_PRIORITY_CLASS
              value: actions-runners
            # A runner idle this long is replaced by a fresh one.
            - name: IDLE_TIMEOUT_SECONDS
              value: "3600"
            # What a check's four test workers need (README.md, The runner pod).
            - name: RUNNER_CPU_REQUEST
              value: "1"
            - name: RUNNER_MEMORY_REQUEST
              value: 2Gi
            - name: RUNNER_CPU_LIMIT
              value: "4"
            - name: RUNNER_MEMORY_LIMIT
              value: 4Gi
            # The runner App's ids, which are not secret: the same as
            # infrastructure's ansible/inventory/group_vars/ci.yml.
            - name: GITHUB_APP_ID
              value: "5051391"
            - name: GITHUB_APP_INSTALLATION_ID
              value: "164149198"
            - name: VAULT_ADDR
              value: http://vault-active.vault.svc.cluster.local:8200
            - name: VAULT_ROLE
              value: actions-runners
            - name: VAULT_TRANSIT_KEY
              value: github-runner-app
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test $(( $(date +%s) - $(stat -c %Y /tmp/alive) )) -lt 300
            initialDelaySeconds: 60
            periodSeconds: 60
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: script
              mountPath: /opt/registrar
              readOnly: true
            - name: tmp
              mountPath: /tmp
            # The Kubernetes API's token and CA, and a token for Vault alone
            # (audience `vault`), both rotated by the kubelet.
            - name: kube
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: vault
              mountPath: /var/run/secrets/vault
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: registrar-script
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: kube
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: vault
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: vault
                  expirationSeconds: 3600

# Below the sandboxes' `matchmark-batch` (-100) and the default (0), and never
# preempting: a node short of memory evicts a runner before a sandbox or
# anything of the platform. Cluster-scoped, so it lives here.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: actions-runners
value: -200
preemptionPolicy: Never
globalDefault: false
description: GitHub Actions runner pods, evicted first and never preempting.

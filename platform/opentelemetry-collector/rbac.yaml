apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-agent
  namespace: opentelemetry
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-gateway
  namespace: opentelemetry
---
# What `k8sattributes` reads to name a pod's owner, and the gateway's events.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets, deployments, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector
subjects:
  - kind: ServiceAccount
    name: otel-agent
    namespace: opentelemetry
  - kind: ServiceAccount
    name: otel-gateway
    namespace: opentelemetry

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: opentelemetry
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# The namespaces that send OTLP: the ones `openobserve-collector` admits today.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otlp-from-senders
  namespace: opentelemetry
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: opentelemetry-collector
      app.kubernetes.io/instance: opentelemetry.otel-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: offby1-cc
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: artistlabco-com
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: artistlabco-com-staging
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: matchmark
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
---
# The collectors' own metrics, which Prometheus scrapes (servicemonitor.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: self-metrics-from-prometheus
  namespace: opentelemetry
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: opentelemetry-collector
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8888
---
# DNS and the Kubernetes API, which both collectors read for `k8sattributes`.
# Under Canal a Service address is translated before the policy applies, so
# the rule names the three RKE2 servers (infrastructure's `servers`).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dns-and-kube-api
  namespace: opentelemetry
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: opentelemetry-collector
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 10.10.4.21/32
        - ipBlock:
            cidr: 10.10.4.22/32
        - ipBlock:
            cidr: 10.10.4.23/32
      ports:
        - protocol: TCP
          port: 6443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: logs-to-loki
  namespace: opentelemetry
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: opentelemetry-collector
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: loki
          podSelector:
            matchLabels:
              app.kubernetes.io/name: loki
      ports:
        - protocol: TCP
          port: 3100
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-to-tempo-and-prometheus
  namespace: opentelemetry
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: opentelemetry-collector
      app.kubernetes.io/instance: opentelemetry.otel-gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tempo
          podSelector:
            matchLabels:
              app.kubernetes.io/name: tempo
      ports:
        - protocol: TCP
          port: 4317
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9090

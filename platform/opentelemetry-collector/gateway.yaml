# The gateway: the one OTLP entry point of the cluster. Traces go to Tempo,
# metrics to Prometheus, logs and Kubernetes events to Loki. README.md.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-gateway
  namespace: opentelemetry
spec:
  mode: deployment
  replicas: 1
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.160.0@sha256:799dc6cf12c96192af37b5bdba804da8c10b3bc563b43cb90c3f3c58d9572ad6
  serviceAccount: otel-gateway
  nodeSelector:
    0xc0.cc/pool: infra
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  config:
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      k8sobjects/events:
        auth_type: serviceAccount
        objects:
          - group: events.k8s.io
            mode: watch
            name: events
    connectors:
      # The service map of Grafana's Tempo data source reads these metrics.
      servicegraph:
        dimensions:
          - http.method
        latency_histogram_buckets:
          [2ms, 4ms, 6ms, 8ms, 10ms, 50ms, 100ms, 200ms, 400ms, 800ms, 1s, 1400ms, 2s, 5s, 10s, 15s]
        store:
          max_items: 10000
          ttl: 30s
    processors:
      # In MiB, near 80% of the container's limit.
      memory_limiter:
        check_interval: 1s
        limit_mib: 800
        spike_limit_mib: 200
      resourcedetection:
        detectors: [env]
        override: true
        timeout: 2s
      attributes:
        actions:
          - action: insert
            key: k8s_cluster
            value: 0xc0-prod
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.job.name
            - k8s.cronjob.name
            - k8s.container.name
            - container.image.name
            - container.image.tag
          labels:
            - from: pod
              key: app.kubernetes.io/name
              tag_name: service.name
            - from: pod
              key: app.kubernetes.io/version
              tag_name: service.version
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: connection
      batch:
        send_batch_size: 2000
        send_batch_max_size: 5000
        timeout: 5s
    exporters:
      otlp/tempo:
        endpoint: tempo.tempo.svc.cluster.local:4317
        tls:
          insecure: true
        compression: gzip
        timeout: 10s
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 120s
        sending_queue:
          enabled: true
          queue_size: 1000
          block_on_overflow: false
      # Prometheus's OTLP receiver, which listens over HTTP alone.
      otlphttp/prometheus:
        endpoint: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/otlp
        compression: gzip
        timeout: 10s
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 120s
        sending_queue:
          enabled: true
          queue_size: 1000
          block_on_overflow: false
      otlphttp/loki:
        endpoint: http://loki.loki.svc.cluster.local:3100/otlp
        encoding: proto
        compression: gzip
        timeout: 10s
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 120s
        sending_queue:
          enabled: true
          queue_size: 1000
          block_on_overflow: false
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, attributes, k8sattributes, batch]
          exporters: [otlp/tempo, servicegraph]
        metrics:
          receivers: [otlp, servicegraph]
          processors: [memory_limiter, resourcedetection, attributes, k8sattributes, batch]
          exporters: [otlphttp/prometheus]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, attributes, k8sattributes, batch]
          exporters: [otlphttp/loki]
        logs/k8s_events:
          receivers: [k8sobjects/events]
          processors: [memory_limiter, resourcedetection, attributes, k8sattributes, batch]
          exporters: [otlphttp/loki]
---
# The name the applications use. The operator's own Service is
# `otel-gateway-collector`, the old collector's pattern; this one carries the
# agreed name.
apiVersion: v1
kind: Service
metadata:
  name: otel-gateway
  namespace: opentelemetry
spec:
  selector:
    app.kubernetes.io/component: opentelemetry-collector
    app.kubernetes.io/instance: opentelemetry.otel-gateway
    app.kubernetes.io/managed-by: opentelemetry-operator
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP

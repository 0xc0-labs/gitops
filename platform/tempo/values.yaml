replicas: 1

tempo:
  tag: 2.9.0@sha256:65a5789759435f1ef696f1953258b9bbdb18eb571d5ce711ff812d2e128288a4
  # No ballast: the memory limit is small and the chart's 1024 MB would eat it.
  memBallastSizeMbs: 0
  reportingEnabled: false
  # 14 days, enforced by the compactor on the bucket.
  retention: 336h
  storage:
    trace:
      backend: s3
      s3:
        bucket: tempo-blocks
        # From r2-vault (vault-secrets.yaml), expanded at start.
        endpoint: ${R2_HOST}
        region: auto
        access_key: ${R2_ACCESS_KEY_ID}
        secret_key: ${R2_SECRET_ACCESS_KEY}
        forcepathstyle: true
      wal:
        path: /var/tempo/wal
  # The chart's Service template reads the Jaeger receivers, so they stay
  # configured; the NetworkPolicy admits OTLP alone.
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  # TraceQL metrics (Grafana's trace and Matchmark time series) read the
  # local-blocks processor alone. service-graphs and span-metrics stay off: the
  # gateway's servicegraph connector feeds Prometheus, and span metrics would
  # duplicate series. Nothing is remote-written. Its WAL and blocks live under
  # /var/tempo, on the volume.
  metricsGenerator:
    enabled: true
    # Unused: no processor writes series. The chart wants an endpoint.
    remoteWriteUrl: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write
    processor:
      local_blocks:
        # Every span, not the server spans alone: the panels also count
        # client and internal ones.
        filter_server_spans: false
        # Blocks reach the bucket, so a range beyond the last hour answers.
        flush_to_storage: true
    storage:
      path: /var/tempo/generator/wal
    traces_storage:
      path: /var/tempo/generator/traces
  overrides:
    defaults:
      metrics_generator:
        processors:
          - local-blocks
  extraArgs:
    config.expand-env: "true"
  extraEnvFrom:
    - secretRef:
        name: r2-vault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
  resources:
    requests:
      cpu: 100m
      memory: 768Mi
    limits:
      memory: 2Gi

# The chart's, with the seccomp profile the namespace's restricted level asks.
securityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# The WAL alone: the blocks live in R2.
persistence:
  enabled: true
  size: 10Gi

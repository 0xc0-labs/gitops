# Traces, monolithic (workspace#290). Blocks live
# in R2.
#
# Backups: storage-tempo-0 (Longhorn, 10 Gi, the WAL alone), in PBS's nightly
# backup of the RKE2 VMs. The traces are in R2 (bucket tempo-blocks), not backed
# up here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tempo
helmCharts:
  - name: tempo
    repo: https://grafana.github.io/helm-charts
    version: 1.24.4
    releaseName: tempo
    namespace: tempo
    kubeVersion: "1.36.4"
    skipTests: true
    valuesFile: values.yaml
resources:
  - namespace.yaml
  - network-policy.yaml
  - vault-secrets.yaml
# No pruning: it holds data.
commonAnnotations:
  argocd.argoproj.io/sync-options: Prune=false

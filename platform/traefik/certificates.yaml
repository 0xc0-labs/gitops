# sergioaten.cloud has none: the Cloudflare token does not reach it.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-0xc0-cc
  namespace: traefik
spec:
  secretName: wildcard-0xc0-cc
  dnsNames:
    - "*.0xc0.cc"
    - 0xc0.cc
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
---

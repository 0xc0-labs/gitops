image:
  registry: docker.io
  repository: traefik
  tag: v3.7.13
  digest: sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
# With externalTrafficPolicy Local, a node answers only through its own pod.
deployment:
  kind: DaemonSet
providers:
  kubernetesGateway:
    enabled: true
  # For Middlewares: CrowdSec's bouncer is one.
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: false
ingressClass:
  enabled: false
gateway:
  # The public tunnel (infrastructure: tofu output public_tunnel_id).
  annotations:
    external-dns.kubernetes.io/target: 2bca7b27-f56a-4d12-bb93-079837015367.cfargotunnel.com
  # The API server's defaults are written out, or Argo CD sees a diff forever.
  listeners:
    web:
      port: 8000
      protocol: HTTP
      namespacePolicy:
        from: Same
    websecure-0xc0-cc:
      port: 8443
      protocol: HTTPS
      hostname: "*.0xc0.cc"
      mode: Terminate
      certificateRefs:
        - name: wildcard-0xc0-cc
          group: ""
          kind: Secret
      namespacePolicy: &routes
        from: Selector
        selector:
          matchLabels:
            gateway.0xc0.cc/web: "true"
    websecure-0xc0-cc-apex:
      port: 8443
      protocol: HTTPS
      hostname: 0xc0.cc
      mode: Terminate
      certificateRefs:
        - name: wildcard-0xc0-cc
          group: ""
          kind: Secret
      namespacePolicy: *routes
    websecure-offby1-cc:
      port: 8443
      protocol: HTTPS
      hostname: "*.offby1.cc"
      mode: Terminate
      certificateRefs:
        - name: wildcard-offby1-cc
          group: ""
          kind: Secret
      namespacePolicy: *routes
    # WARP only.
    internal:
      port: 8444
      protocol: HTTPS
      hostname: "*.int.0xc0.cc"
      mode: Terminate
      certificateRefs:
        - name: wildcard-int-0xc0-cc
          group: ""
          kind: Secret
      namespacePolicy:
        from: Selector
        selector:
          matchLabels:
            gateway.0xc0.cc/internal: "true"
    websecure-offby1-cc-apex:
      port: 8443
      protocol: HTTPS
      hostname: offby1.cc
      mode: Terminate
      certificateRefs:
        - name: wildcard-offby1-cc
          group: ""
          kind: Secret
      namespacePolicy: *routes
    websecure-artistlabco-com:
      port: 8443
      protocol: HTTPS
      hostname: "*.artistlabco.com"
      mode: Terminate
      certificateRefs:
        - name: wildcard-artistlabco-com
          group: ""
          kind: Secret
      namespacePolicy: *routes
    websecure-artistlabco-com-apex:
      port: 8443
      protocol: HTTPS
      hostname: artistlabco.com
      mode: Terminate
      certificateRefs:
        - name: wildcard-artistlabco-com
          group: ""
          kind: Secret
      namespacePolicy: *routes
service:
  spec:
    type: NodePort
    # No SNAT: Traefik sees the load balancer's address, so it trusts its
    # forwarded headers and nobody else's.
    externalTrafficPolicy: Local
ports:
  web:
    nodePort: 30080
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    nodePort: 30443
    # vm-lb-01 and vm-lb-02: HAProxy connects from each one's own address,
    # not the VIP.
    forwardedHeaders:
      trustedIPs: [10.10.4.11/32, 10.10.4.12/32]
    # A span per middleware: CrowdSec emits no traces of its own.
    observability:
      traceVerbosity: detailed
    http:
      middlewares:
        - traefik-crowdsec-bouncer@kubernetescrd
        - traefik-security-headers@kubernetescrd
  # The internal VIP's 443; the public tunnel never comes here, so no bouncer.
  internal:
    port: 8444
    nodePort: 30444
    exposedPort: 8444
    protocol: TCP
    expose:
      default: true
    http:
      tls:
        enabled: true
      middlewares:
        - traefik-security-headers@kubernetescrd
accessLog:
  enabled: true
  format: json
experimental:
  plugins:
    crowdsec-bouncer:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.7.1
volumes:
  - name: crowdsec-bouncer-vault
    mountPath: /etc/traefik/crowdsec
    type: secret
# The API check is off: Kustomize renders without the cluster's API versions.
metrics:
  prometheus:
    disableAPICheck: true
    service:
      enabled: true
    serviceMonitor:
      enabled: true
# Every request is traced (the default sample rate): traffic is low.
tracing:
  otlp:
    enabled: true
    grpc:
      enabled: true
      endpoint: openobserve-collector-gateway-collector.openobserve-collector.svc.cluster.local:4317
      insecure: true

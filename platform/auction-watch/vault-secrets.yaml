apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: auction-watch
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-secrets
  namespace: auction-watch
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: auction-watch
    serviceAccount: vault-secrets
    audiences: [vault]
---
# Keys `api_key` (Resend's) and `to` (the address the mails go to): the
# operator writes them (README.md).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mail
  namespace: auction-watch
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: platform
  path: auction-watch/mail
  refreshAfter: 1h
  destination:
    name: auction-watch-mail
    create: true
    transformation:
      includes: ["^api_key$", "^to$"]
      excludeRaw: true

# The record, a SQLite file of every offer the feed has shown (README.md).
#
# Backup: PBS's nightly backup of the RKE2 VMs, which takes Longhorn's replicas
# with it. SQLite recovers from the write-ahead log of a crash-consistent copy.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auction-watch-record
  namespace: auction-watch
  # No pruning: it holds data.
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      # About 1 KB an offer, 100 offers a day for 400 days: tens of MB.
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auction-watch
  namespace: auction-watch
spec:
  replicas: 1
  # One pod owns the volume and the record: the old one stops before the new
  # one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: auction-watch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auction-watch
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: watch
          image: docker.io/library/python:3.13.15-alpine@sha256:79e7a9b9ff1cbceff819f856fb374477792a5967759d94df266de7b7b4120e6f
          command: [python3, -u, /opt/auction-watch/watch.py]
          env:
            - name: AUCTION_WATCH_SEED
              value: /opt/auction-watch-seed/seed.jsonl.gz
            - name: AUCTION_WATCH_DB
              value: /data/record.db
            - name: AUCTION_WATCH_POLL_SECONDS
              value: "10"
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: auction-watch-mail
                  key: api_key
            - name: MAIL_TO
              valueFrom:
                secretKeyRef:
                  name: auction-watch-mail
                  key: to
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          # The loop touches /tmp/alive after each ask of the feed, every 10
          # seconds: five minutes without it is a hung loop.
          livenessProbe:
            exec:
              command: [sh, -c, 'test $(( $(date +%s) - $(stat -c %Y /tmp/alive) )) -lt 300']
            initialDelaySeconds: 120
            periodSeconds: 60
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: script
              mountPath: /opt/auction-watch
              readOnly: true
            - name: seed
              mountPath: /opt/auction-watch-seed
              readOnly: true
            - name: record
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: auction-watch-script
        - name: seed
          configMap:
            name: auction-watch-seed
        - name: record
          persistentVolumeClaim:
            claimName: auction-watch-record
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi

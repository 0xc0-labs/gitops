# Two secrets, each read by a sign-in that lives in infrastructure (the argocd
# role). Argo CD resolves `$<secret>:<key>` only from a Secret labelled
# part-of argocd.
# - argocd-github-oauth: the OAuth App's credentials, read by Dex's GitHub
#   connector, until Cloudflare's sign-in replaces it.
# - argocd-oidc: Cloudflare Access's OIDC client, read by the sign-in through
#   Cloudflare.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: argocd
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-secrets
  namespace: argocd
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: argocd
    serviceAccount: vault-secrets
    audiences: [vault]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: argocd-github-oauth
  namespace: argocd
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: platform
  path: argocd/github-oauth
  refreshAfter: 1h
  destination:
    name: argocd-github-oauth
    create: true
    labels:
      app.kubernetes.io/part-of: argocd
    transformation:
      excludeRaw: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: argocd-oidc
  namespace: argocd
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: platform
  path: argocd/oidc
  refreshAfter: 1h
  destination:
    name: argocd-oidc
    create: true
    labels:
      app.kubernetes.io/part-of: argocd
    transformation:
      excludeRaw: true

# The OAuth App's credentials for Argo CD's GitHub sign-in. Its Dex connector
# lives in infrastructure (the argocd role) and reads them as
# $argocd-github-oauth:client_id: Argo CD resolves that only from a Secret
# labelled part-of argocd.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: argocd
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-secrets
  namespace: argocd
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: argocd
    serviceAccount: vault-secrets
    audiences: [vault]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: argocd-github-oauth
  namespace: argocd
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: platform
  path: argocd/github-oauth
  refreshAfter: 1h
  destination:
    name: argocd-github-oauth
    create: true
    labels:
      app.kubernetes.io/part-of: argocd
    transformation:
      excludeRaw: true

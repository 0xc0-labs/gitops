# argocd-oidc: Cloudflare Access's OIDC client, the one secret left, read by
# Argo CD's sign-in through Cloudflare (the argocd role in infrastructure).
# Argo CD resolves `$<secret>:<key>` only from a Secret labelled part-of argocd.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: argocd
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-secrets
  namespace: argocd
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: argocd
    serviceAccount: vault-secrets
    audiences: [vault]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: argocd-oidc
  namespace: argocd
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: platform
  path: argocd/oidc
  refreshAfter: 1h
  destination:
    name: argocd-oidc
    create: true
    labels:
      app.kubernetes.io/part-of: argocd
    transformation:
      excludeRaw: true

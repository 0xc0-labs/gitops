# Personal client certificates with O=admins are cluster-admin
# (platform/cluster-access/README.md).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: Group
    name: admins
    apiGroup: rbac.authorization.k8s.io

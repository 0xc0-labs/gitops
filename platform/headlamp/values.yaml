image:
  tag: "v0.45.0@sha256:db3f0e0fc58d358d41daa3fe7fc852437552c7ee873c3645470f7b86a8e0db49"
# Not cluster-admin: every user brings a token of their own (admin.yaml).
clusterRoleBinding:
  create: false
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
securityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
httpRoute:
  enabled: true
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: internal
  hostnames:
    - headlamp.int.0xc0.cc
# Sign-in through Cloudflare Access: the client and its settings come from the
# Secret that vault-secrets.yaml writes, so the chart creates none.
config:
  oidc:
    secret:
      create: false
    externalSecret:
      enabled: true
      name: headlamp-oidc
      hasScopes: true
    # Only passes the flag: the chart reads the address from the Secret's
    # OIDC_CALLBACK_URL.
    callbackURL: https://headlamp.int.0xc0.cc/oidc-callback

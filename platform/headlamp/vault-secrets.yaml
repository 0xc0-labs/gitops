# headlamp-oidc: Cloudflare Access's OIDC client, written by the operator at
# platform/headlamp/oidc (the vault repo, README), read by the chart's
# `externalSecret` as environment variables. The issuer, scopes and callback
# are not secret: they are set here, beside the client.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: headlamp
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-secrets
  namespace: headlamp
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: headlamp
    serviceAccount: vault-secrets
    audiences: [vault]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: headlamp-oidc
  namespace: headlamp
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: platform
  path: headlamp/oidc
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: Deployment
      name: headlamp
  destination:
    name: headlamp-oidc
    create: true
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        OIDC_CLIENT_ID:
          text: '{{ get .Secrets "client_id" }}'
        OIDC_CLIENT_SECRET:
          text: '{{ get .Secrets "client_secret" }}'
        OIDC_ISSUER_URL:
          text: https://0xc0.cloudflareaccess.com/cdn-cgi/access/sso/oidc/ce6ce5b6752cc8cd7366367c36b3f8cea85e4feff9d16de741a16ce219fb1640
        OIDC_SCOPES:
          text: email,profile
        OIDC_CALLBACK_URL:
          text: https://headlamp.int.0xc0.cc/oidc-callback
        OIDC_USE_PKCE:
          text: "true"

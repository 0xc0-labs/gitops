# Prometheus and Grafana: the one view of metrics, logs and traces (workspace#290).
#
# Backups: prometheus-kube-prometheus-stack-prometheus-db-prometheus-
# kube-prometheus-stack-prometheus-0 (Longhorn, 20 Gi), in PBS's nightly backup
# of the RKE2 VMs. Grafana keeps nothing.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 93.11.0
    releaseName: kube-prometheus-stack
    namespace: monitoring
    kubeVersion: "1.36.4"
    skipTests: true
    valuesFile: values.yaml
    additionalValuesFiles:
      - alerting-rules.yaml
resources:
  - namespace.yaml
  - network-policy.yaml
  - vault-secrets.yaml
  - httproute.yaml
  - scrape-configs.yaml
# No pruning: it holds data.
commonAnnotations:
  argocd.argoproj.io/sync-options: Prune=false
# One ConfigMap per dashboard, which Grafana's sidecar loads into the folder
# named by grafana_folder. Never one per folder: Argo CD's last-applied
# annotation caps a ConfigMap near 256 KiB. The names carry no hash, so an
# edit replaces the dashboard instead of leaving the old one behind.
configMapGenerator:
  # Home, Grafana's home dashboard: mounted as a file (values.yaml), so no
  # grafana_dashboard label for the sidecar.
  - name: grafana-dashboard-home
    files:
      - dashboards/home/home.json
    options:
      disableNameSuffixHash: true
  - name: grafana-dashboard-kubernetes-events
    files:
      - dashboards/kubernetes/kubernetes-events.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Kubernetes
  - name: grafana-dashboard-argocd
    files:
      - dashboards/platform/argocd.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Platform
  - name: grafana-dashboard-crowdsec
    files:
      - dashboards/platform/crowdsec.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Platform
  - name: grafana-dashboard-longhorn
    files:
      - dashboards/platform/longhorn.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Platform
  - name: grafana-dashboard-traefik
    files:
      - dashboards/platform/traefik.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Platform
  - name: grafana-dashboard-vault
    files:
      - dashboards/platform/vault.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Platform
  - name: grafana-dashboard-rightsizing
    files:
      - dashboards/platform/rightsizing.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Platform
  - name: grafana-dashboard-apps
    files:
      - dashboards/applications/apps.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Applications
  - name: grafana-dashboard-matchmark
    files:
      - dashboards/applications/matchmark.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Applications
  - name: grafana-dashboard-rum
    files:
      - dashboards/applications/rum.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Applications
  - name: grafana-dashboard-traces-overall
    files:
      - dashboards/traces/traces-overall.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Traces
  - name: grafana-dashboard-traces-by-service

# The chart's CRDs are platform/prometheus-operator-crds': one owner each.
crds:
  enabled: false

defaultRules:
  create: true
  rules:
    # Switched off below: nothing scrapes it, so its rules would only fire.
    kubeProxy: false
    # Alertmanager is off (below): its rules would only fire.
    alertmanager: false
  # About Alertmanager itself, or only there to be watched by it.
  disabled:
    Watchdog: true
    InfoInhibitor: true
    PrometheusNotConnectedToAlertmanagers: true
    PrometheusErrorSendingAlertsToSomeAlertmanagers: true
    PrometheusErrorSendingAlertsToAnyAlertmanager: true

# The operator has no webhooks: no certgen Job, no port for the API server.
prometheusOperator:
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
  image:
    tag: v0.95.2
    sha: 7986c2afa118c9dea07d01c5e1a29555824582e92f6ee8607591d1a7178acf29
  prometheusConfigReloader:
    image:
      tag: v0.95.2
      sha: cc74ddedad4ab1c49446971f6d51302ad4303d8660a2018af925c7f62c114304
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi

prometheus:
  prometheusSpec:
    image:
      tag: v3.16.0-distroless
      sha: 9764044e09eb2c9e1abdb12d0f0188d4efb7384b0262d3c080f0fc59045c89ba
    replicas: 1
    retention: 30d
    # Under the volume's 20 Gi, so a full disk never stops the head.
    retentionSize: 16GB
    # As the collectors scrape: every minute.
    scrapeInterval: 60s
    evaluationInterval: 60s
    # The applications' metrics arrive over OTLP from the collectors' gateway
    # (platform/opentelemetry-collector).
    enableOTLPReceiver: true
    # The resource attributes Grafana filters by become labels; the rest stay
    # in target_info. Temporality is cumulative, the SDKs' default.
    otlp:
      promoteResourceAttributes:
        - service.name
        - service.namespace
        - k8s.namespace.name
        - k8s.pod.name
        - deployment.environment
    # Every ServiceMonitor, PodMonitor, Probe and PrometheusRule in the
    # cluster, not only the chart's own.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 200m
        memory: 1536Mi
      limits:
        memory: 3Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 20Gi

# Alerting lives in Grafana (alerting-rules.yaml, workspace#290): no
# Alertmanager, and Prometheus has none to send to.
alertmanager:
  enabled: false

grafana:
  image:
    tag: 13.3.2-distroless
    sha: d9425e704fa9dff189966b827fbc9b63befc5b443999c7b82193f1b1a73c74f7
  # The login from Vault (vault-secrets.yaml), keys as written there.
  admin:
    existingSecret: grafana-admin
    userKey: admin_user
    passwordKey: admin_password
  # Dashboards and data sources come from git: nothing to keep.
  persistence:
    enabled: false
  defaultDashboardsEnabled: true
  # Loki and Tempo (workspace#290, phase 2), linked both ways by trace ID. Loki
  # turns the OTLP attributes into the labels service_name,
  # k8s_namespace_name and k8s_pod_name; trace_id is structured metadata.
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki.loki.svc.cluster.local:3100
      access: proxy
      jsonData:
        derivedFields:
          - name: trace
            matcherType: label
            matcherRegex: trace_id
            url: "$${__value.raw}"
            datasourceUid: tempo
    - name: Tempo
      type: tempo
      uid: tempo
      url: http://tempo.tempo.svc.cluster.local:3200
      access: proxy
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          filterByTraceID: true
          tags:
            - key: k8s.namespace.name
              value: k8s_namespace_name
            - key: k8s.pod.name
              value: k8s_pod_name
        serviceMap:
          datasourceUid: prometheus
        nodeGraph:
          enabled: true
  grafana.ini:
    server:
      domain: grafana.int.0xc0.cc
      root_url: https://grafana.int.0xc0.cc
    analytics:
      check_for_updates: false
      reporting_enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi
  sidecar:
    dashboards:
      # The folder comes from each ConfigMap's grafana_folder annotation; the
      # chart's own dashboards carry the one below.
      folderAnnotation: grafana_folder
      annotations:
        grafana_folder: Kubernetes
      provider:
        foldersFromFilesStructure: true
    # The chart adds one for the Alertmanager it no longer runs.
    datasources:
      alertmanager:
        enabled: false
    image:
      tag: 2.14.3
      sha: 52d311dcedd587421a236c4d6c621f05614c40a51386e955e0699dca97ec0880
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 128Mi

kube-state-metrics:
  image:
    tag: v2.20.0
    sha: sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
  # Not the chart's own wildcard: it would let the pool taints through.
  tolerations: []
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  image:
    digest: sha256:dbc46b5381ae47c5634a6ad16d7b4862191979b0ba4f4cfbdee85e5aa2fcd1e3
  # Every node reports, the tainted pools included, and only those taints.
  tolerations:
    - key: 0xc0.cc/pool
      operator: Equal
      value: apps
      effect: NoSchedule
    - key: 0xc0.cc/pool
      operator: Equal
      value: sandbox
      effect: NoSchedule
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 96Mi

# RKE2 exposes the control plane's metrics on the node's address, as the
# rke2_server role in infrastructure sets: etcd's over HTTP on 2381, the
# scheduler's (10259) and the controller manager's (10257) over HTTPS behind
# the API's authorization, the chart's defaults for a bearer token and no
# verification. The ports are stated so a chart bump cannot move them.
kubeEtcd:
  service:
    port: 2381
    targetPort: 2381
kubeControllerManager:
  service:
    port: 10257
    targetPort: 10257
kubeScheduler:
  service:
    port: 10259
    targetPort: 10259
# RKE2's kube-proxy listens on 127.0.0.1:10249 and the zone firewall admits
# no such port between the nodes: no target can be reached.
kubeProxy:
  enabled: false

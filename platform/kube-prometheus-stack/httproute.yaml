# The Service is in this namespace: no ReferenceGrant needed.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: internal
  hostnames:
    - grafana.int.0xc0.cc
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80

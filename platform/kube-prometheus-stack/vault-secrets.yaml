# A machine's secret though a person logs in with it: Grafana reads it at its
# start (the vault repo, README, "People or machines").
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: monitoring
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-secrets
  namespace: monitoring
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: monitoring
    serviceAccount: vault-secrets
    audiences: [vault]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: platform
  path: grafana/admin
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: Deployment
      name: kube-prometheus-stack-grafana
  destination:
    name: grafana-admin
    create: true
    transformation:
      excludeRaw: true

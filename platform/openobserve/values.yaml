fullnameOverride: openobserve

auth:
  existingRootUserSecret:
    name: openobserve-root-vault
    emailKey: ZO_ROOT_USER_EMAIL
    passwordKey: ZO_ROOT_USER_PASSWORD

config:
  ZO_WEB_URL: https://o2.int.0xc0.cc
  # At info, its ingestion log lines were 98% of all logs.
  RUST_LOG: warn
  # On by default, outside RUST_LOG: ~3,500 lines a minute of query plans.
  ZO_PRINT_KEY_SQL: "false"
  # About half the volume's bytes and two thirds of its inodes. Longer needs
  # a larger volume (README, Retention and size).
  ZO_COMPACT_DATA_RETENTION_DAYS: "30"
  ZO_TELEMETRY: "false"
  ZO_MMDB_DISABLE_DOWNLOAD: "true"
  ZO_PROMETHEUS_ENABLED: "true"
  # In MB, to stay inside its memory limit.
  ZO_MEMORY_CACHE_MAX_SIZE: "256"
  ZO_MEMORY_CACHE_DATAFUSION_MAX_SIZE: "256"
  # Past the memtable cap every write gets a 503. Rotate well under it: with
  # both at 512, the active memtable filled the cap before it ever rotated.
  ZO_MEM_TABLE_MAX_SIZE: "512"
  ZO_MAX_FILE_SIZE_IN_MEMORY: "64"
  ZO_MAX_FILE_RETENTION_TIME: "120"
  # The chart's 150 froze _rumdata and moved its new fields into _all; 1000 is
  # OpenObserve's own default (#333, README, A frozen stream).
  ZO_SCHEMA_MAX_FIELDS_TO_ENABLE_UDS: "1000"

persistence:
  enabled: true
  size: 50Gi
  storageClass: longhorn

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

# Measured at 1.3 GiB with every target in (2026-10-01).
resources:
  requests:
    cpu: 100m
    memory: 1Gi
  limits:
    memory: 3Gi

serviceMonitor:
  enabled: true
  interval: 60s

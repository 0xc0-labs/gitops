# The R2 token of the bucket and its address: written by the operator at
# platform/loki/r2 (the vault repo, README), read here as environment variables.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: loki
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-secrets
  namespace: loki
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: loki
    serviceAccount: vault-secrets
    audiences: [vault]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: r2
  namespace: loki
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: platform
  path: loki/r2
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: StatefulSet
      name: loki
  destination:
    name: r2-vault
    create: true
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        R2_ACCESS_KEY_ID:
          text: '{{ get .Secrets "access_key_id" }}'
        R2_SECRET_ACCESS_KEY:
          text: '{{ get .Secrets "secret_access_key" }}'
        # The bucket's client takes a host: the key holds the https:// address.
        R2_HOST:
          text: '{{ get .Secrets "endpoint" | trimPrefix "https://" }}'
